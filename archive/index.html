      pstInline(n, dest);         // span / font / u / 未知标签：只留内容
    });
  }
  // li 的内容：段落合并成一行（用 <br> 分隔），嵌套列表挂在 li 里
  function pstLiContent(src, dest) {
    Array.from(src.childNodes).forEach(n => {
      if (n.nodeType === 3) {
        const t = pstText(n.nodeValue).replace(/\s+/g, ' ');
        if (!t.trim() && !dest.lastChild) return;
        if (t) dest.appendChild(document.createTextNode(t));
        return;
      }
      if (n.nodeType !== 1) return;
      const tag = n.tagName.toUpperCase();
      if (PST_DROP.has(tag)) return;
      if (tag === 'UL' || tag === 'OL') { pstList(n, dest); return; }
      if (tag === 'TABLE') { pstTable(n, dest); return; }
      if (PST_BLOCK.has(tag)) {
        if (hasBlockChild(n) && !/^(P|DIV|SECTION)$/.test(tag)) { pstBlocks(n, dest); return; }
        if (dest.textContent.trim() && !dest.lastChild) dest.appendChild(document.createElement('br'));
        pstInlineNode(n, dest);
        return;
      }
      pstInlineNode(n, dest);
    });
  }
  function pstList(srcList, dest) {
    const ordered = srcList.tagName.toUpperCase() === 'OL';
    const list = document.createElement(ordered ? 'ol' : 'ul');
    const start = parseInt(srcList.getAttribute('start'), 10);
    if (ordered && start > 1) list.setAttribute('start', String(start));
    Array.from(srcList.children).forEach(li => {
      if (li.tagName.toUpperCase() !== 'LI') {
        const holder = document.createElement('li');
        pstLiContent(li, holder);
        if (holder.textContent.trim() || holder.querySelector('img')) list.appendChild(holder);
        return;
      }
      const out = document.createElement('li');
      pstLiContent(li, out);
      const hasOwn = out.textContent.trim() || out.querySelector('img');
      if (hasOwn) { list.appendChild(out); return; }
      // 只有子列表、没有自己的文字：把子列表挂到上一项，避免出现空圆点
      const subs = Array.from(out.children).filter(c => /^(UL|OL)$/i.test(c.tagName));
      const prev = list.lastElementChild;
      if (prev) subs.forEach(s => prev.appendChild(s));
      else subs.forEach(s => dest.appendChild(s));
    });
    if (list.children.length) dest.appendChild(list);
  }
  function pstTable(srcTable, dest) {
    const trs = Array.from(srcTable.querySelectorAll('tr'))
      .filter(tr => Array.from(tr.children).some(c => /^(TD|TH)$/i.test(c.tagName)));
    if (!trs.length) return;
    const rows = trs.map(tr => Array.from(tr.children)
      .filter(c => /^(TD|TH)$/i.test(c.tagName))
      .map(c => {
        const holder = document.createElement('div');
        pstInline(c, holder);
        return Array.from(holder.childNodes).map(x => x.nodeType === 1 && x.tagName === 'BR' ? ' ' : (x.textContent || '')).join('')
          .replace(/\s+/g, ' ').trim();
      }));
    const cols = Math.max(...rows.map(r => r.length));
    const t = document.createElement('table');
    const thead = document.createElement('thead');
    const htr = document.createElement('tr');
    for (let c = 0; c < cols; c++) {
      const th = document.createElement('th');
      th.textContent = rows[0][c] || '';
      htr.appendChild(th);
    }
    thead.appendChild(htr);
    t.appendChild(thead);
    const tbody = document.createElement('tbody');
    rows.slice(1).forEach(r => {
      const tr = document.createElement('tr');
      for (let c = 0; c < cols; c++) {
        const td = document.createElement('td');
        td.textContent = r[c] || '';
        if (!td.textContent) td.innerHTML = '<br>';
        tr.appendChild(td);
      }
      tbody.appendChild(tr);
    });
    t.appendChild(tbody);
    dest.appendChild(t);
  }
  // 块级内容
  function pstBlocks(src, dest) {
    Array.from(src.childNodes).forEach(n => {
      if (n.nodeType === 3) {
        const t = pstText(n.nodeValue).replace(/\s+/g, ' ').trim();
        if (!t) return;
        const p = document.createElement('p');
        p.textContent = t;
        dest.appendChild(p);
        return;
      }
      if (n.nodeType !== 1) return;
      const tag = n.tagName.toUpperCase();
      if (PST_DROP.has(tag)) return;
      if (tag === 'UL' || tag === 'OL') { pstList(n, dest); return; }
      if (tag === 'LI') { const ul = document.createElement('ul'); ul.appendChild(n.cloneNode(true)); pstList(ul, dest); return; }
      if (tag === 'TABLE') { pstTable(n, dest); return; }
      if (tag === 'HR') { dest.appendChild(document.createElement('hr')); return; }
      if (tag === 'PRE') {
        const pre = document.createElement('pre');
        const code = document.createElement('code');
        code.textContent = n.textContent.replace(/\n+$/, '');
        pre.appendChild(code);
        dest.appendChild(pre);
        return;
      }
      if (tag === 'BLOCKQUOTE') {
        const bq = document.createElement('blockquote');
        pstBlocks(n, bq);
        if (!bq.childNodes.length) bq.innerHTML = '<p><br></p>';
        dest.appendChild(bq);
        return;
      }
      if (/^H[1-6]$/.test(tag)) {
        const h = document.createElement(tag.toLowerCase());
        pstInline(n, h);
        if (h.textContent.trim() || h.querySelector('img')) dest.appendChild(h);
        return;
      }
      if (!PST_BLOCK.has(tag)) {          // 顶层行内元素 → 单独一段
        const p = document.createElement('p');
        pstInlineNode(n, p);
        if (p.textContent.trim() || p.querySelector('img')) dest.appendChild(p);
        return;
      }
      if (hasBlockChild(n)) { pstBlocks(n, dest); return; }   // 纯容器：拆开
      const p = document.createElement('p');
      pstInlineNode(n, p);
      if (p.textContent.trim() || p.querySelector('img')) dest.appendChild(p);
    });
  }
  function pasteHtmlToNodes(html) {
    const doc = new DOMParser().parseFromString(String(html || ''), 'text/html');
    const holder = document.createElement('div');
    pstBlocks(doc.body, holder);
    return holder;
  }

  function countWords(text) {
    const t = String(text || '').replace(/```[\s\S]*?```/g, '')
      .replace(/<\/?(?:span|mark)\b[^>]*>/gi, '')
      .replace(/[#>*`~\-|[\]()!]/g, '');
    const cjk = (t.match(/[\u3400-\u4DBF\u4E00-\u9FFF\u3040-\u30FF\uAC00-\uD7AF]/g) || []).length;
    const latin = (t.replace(/[\u3400-\u4DBF\u4E00-\u9FFF\u3040-\u30FF\uAC00-\uD7AF]/g, ' ').match(/[A-Za-z0-9]+/g) || []).length;
    return cjk + latin;
  }

  function extractTags(text) {
    // 去掉代码块与行内 HTML（字体颜色/高亮），避免把 #d64545 这类色值当成标签
    const t = String(text || '')
      .replace(/```[\s\S]*?```/g, '')
      .replace(/<\/?(?:span|mark)\b[^>]*>/gi, '');
    const tags = new Set();
    const re = /(^|[\s(（])#([^\s#，。,;；!！?？'"）)]{1,40})/g;
    let m;
    while ((m = re.exec(t))) tags.add(m[2]);
    return Array.from(tags);
  }

  function extractWikiLinks(text) {
    const t = String(text || '').replace(/```[\s\S]*?```/g, '');
    const out = new Set();
    const re = /\[\[([^\]]+)\]\]/g;
    let m;
    while ((m = re.exec(t))) out.add(m[1].trim());
    return Array.from(out);
  }

  /* ---------------- 存储层（IndexedDB → localStorage → 内存） ---------------- */
  const Store = {
    mode: 'indexeddb',      // indexeddb | localstorage | memory
    db: null,
    mem: new Map(),
    LS_KEY: 'orca-notes-data',

    async init() {
      try {
        if (!('indexedDB' in window)) throw new Error('no indexedDB');
        this.db = await new Promise((res, rej) => {
          const req = indexedDB.open('orca-notes', 1);
          req.onupgradeneeded = () => {
            const db = req.result;
            if (!db.objectStoreNames.contains('notes')) {
              const s = db.createObjectStore('notes', { keyPath: 'id' });
              s.createIndex('name', 'name', { unique: true });
            }
            if (!db.objectStoreNames.contains('settings')) db.createObjectStore('settings', { keyPath: 'key' });
          };
          req.onsuccess = () => res(req.result);
          req.onerror = () => rej(req.error || new Error('open failed'));
          setTimeout(() => rej(new Error('open timeout')), 3000);
        });
        this.mode = 'indexeddb';
      } catch (e) {
        // 降级到 localStorage
        try {
          localStorage.setItem('__t', '1');
          localStorage.removeItem('__t');
          this.mode = 'localstorage';
        } catch (e2) {
          this.mode = 'memory';
        }
      }
      // 兼容旧数据：曾绑定过本地文件夹的用户，把残留的 handle 清掉
      try { await this.setSetting('folderHandle', null); } catch {}
      return this.mode;
    },

    _lsRead() {
      try { return JSON.parse(localStorage.getItem(this.LS_KEY) || '{"notes":{},"settings":{}}'); }
      catch { return { notes: {}, settings: {} }; }
    },
    _lsWrite(data) {
      try { localStorage.setItem(this.LS_KEY, JSON.stringify(data)); } catch {}
    },

    async allNotes() {
      if (this.mode === 'indexeddb') {
        try {
          return await new Promise((res, rej) => {
            const r = this.db.transaction('notes', 'readonly').objectStore('notes').getAll();
            r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
          });
        } catch { /* 落回下方 */ }
      }
      if (this.mode === 'localstorage') return Object.values(this._lsRead().notes);
      return Array.from(this.mem.values());
    },

    async byName(name) {
      const all = await this.allNotes();
      return all.find(n => n.name === name) || null;
    },

    async put(note) {
      const now = Date.now();
      let target = note;
      if (!note.id) {
        const exist = await this.byName(note.name);
        target = Object.assign({}, exist || {}, note, { id: exist ? exist.id : note.name });
      }
      target.updatedAt = now;

      if (this.mode === 'indexeddb') {
        try {
          await new Promise((res, rej) => {
            const r = this.db.transaction('notes', 'readwrite').objectStore('notes').put(target);
            r.onsuccess = () => res(); r.onerror = () => rej(r.error);
          });
          return target;
        } catch { /* 落回 */ }
      }
      if (this.mode === 'localstorage') {
        const d = this._lsRead(); d.notes[target.id] = target; this._lsWrite(d); return target;
      }
      this.mem.set(target.id, target);
      return target;
    },

    async del(id) {
      if (this.mode === 'indexeddb') {
        try {
          await new Promise((res, rej) => {
            const r = this.db.transaction('notes', 'readwrite').objectStore('notes').delete(id);
            r.onsuccess = () => res(); r.onerror = () => rej(r.error);
          });
          return;
        } catch {}
      }
      if (this.mode === 'localstorage') {
        const d = this._lsRead(); delete d.notes[id]; this._lsWrite(d); return;
      }
      this.mem.delete(id);
    },

    async clear() {
      if (this.mode === 'indexeddb') {
        try {
          await new Promise((res, rej) => {
            const r = this.db.transaction('notes', 'readwrite').objectStore('notes').clear();
            r.onsuccess = () => res(); r.onerror = () => rej(r.error);
          });
          return;
        } catch {}
      }
      if (this.mode === 'localstorage') { const d = this._lsRead(); d.notes = {}; this._lsWrite(d); return; }
      this.mem.clear();
    },

    async getSetting(key, fb) {
      if (this.mode === 'indexeddb' || this.db) {
        try {
          const rec = await new Promise((res, rej) => {
            const r = this.db.transaction('settings', 'readonly').objectStore('settings').get(key);
            r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
          });
          return rec ? rec.value : fb;
        } catch {}
      }
      if (this.mode === 'localstorage') {
        const d = this._lsRead(); return key in d.settings ? d.settings[key] : fb;
      }
      return fb;
    },

    async setSetting(key, value) {
      if (this.mode === 'indexeddb' || this.db) {
        try {
          await new Promise((res, rej) => {
            const r = this.db.transaction('settings', 'readwrite').objectStore('settings').put({ key, value });
            r.onsuccess = () => res(); r.onerror = () => rej(r.error);
          });
          return;
        } catch {}
      }
      if (this.mode === 'localstorage') {
        const d = this._lsRead(); d.settings[key] = value; this._lsWrite(d);
      }
    },
  };

  /* ---------------- 状态 ---------------- */
  const S = {
    notes: [],
    // current / dirty 是「活动窗格」的快捷视图，见下面的 defineProperty
    view: 'edit',                 // edit | preview
    split: false,                 // 源码对照（左编辑 / 右 Markdown 源码）
    daySplit: false,              // 双栏：左右各一天，可同时编辑
    tags: [],
    dav: { url: '', user: '', pass: '', auto: false },
    firstMonday: true,
    search: '',
    tab: 'notes',                 // notes=全部 | fav=收藏
    tagFilter: '',                // 侧栏标签筛选
    bpOpen: false,                // 底部引用面板展开状态
    calView: new Date(),
    calSel: new Date(),
    noteDates: new Set(),
  };

  /* ---------------- 窗格（单栏 A / 双栏 A+B） ---------------- */
  // 每个窗格有自己的笔记、编辑器、撤回栈、自动保存定时器；
  // 所有“当前”操作落到 ACTIVE 窗格上，另一个窗格只负责显示与自存。
  const PANES = {};
  let ACTIVE = 'a';
  const curPane = () => PANES[ACTIVE] || PANES.a;
  const otherPane = (p) => (p && p.key === 'a' ? PANES.b : PANES.a);
  const ED = (p) => (p || curPane()).el.editor;

  Object.defineProperty(S, 'current', {
    get: () => curPane().note,
    set: (v) => { curPane().note = v; },
    configurable: true,
  });
  Object.defineProperty(S, 'dirty', {
    get: () => curPane().dirty,
    set: (v) => { curPane().dirty = v; },
    configurable: true,
  });

  function paneOfNote(note) {
    if (!note) return null;
    for (let i = 0; i < 2; i++) {
      const p = PANES[i === 0 ? 'a' : 'b'];
      if (p && p.note && p.note.id === note.id) return p;
    }
    return null;
  }
  function paintActivePane() {
    ['a', 'b'].forEach(k => {
      const p = PANES[k];
      if (!p) return;
      p.root.classList.toggle('dim', k !== ACTIVE);
      p.root.classList.toggle('active', k === ACTIVE);
    });
  }
  // 切窗格：状态栏、侧栏高亮、引用面板、日历都跟着走
  function setActive(key) {
    if (!PANES[key] || ACTIVE === key) return;
    ACTIVE = key;
    paintActivePane();
    const p = curPane();
    renderNotes();
    renderBottomPanel();
    if (p.note) {
      setSaveState(p.dirty ? '未保存…'
        : (p.note.draft ? '未创建（输入内容后自动保存）' : '未修改'), p);
    }
    const jd = currentJournalDate(p);
    if (jd) {
      fitDatedTitle(jd, p);
      if (dayKey(jd) !== dayKey(S.calSel)) {
        S.calSel = new Date(jd.getFullYear(), jd.getMonth(), jd.getDate());
        S.calView = new Date(jd.getFullYear(), jd.getMonth(), 1);
        renderCalendar();
      }
    }
    updateTableBar();
  }

  // 撤回 / 重做：每个窗格一套快照栈
  function makeUndo(p) {
    return {
      stack: [], idx: -1, lock: false, timer: null, LIMIT: 120,
      reset(md) {
        this.stack = [{ md: md === undefined ? getMd(p) : md, caret: 0 }];
        this.idx = 0;
        this.lock = false;
        this.update();
      },
      snap() {
        if (this.lock || !p.note) return;
        const md = getMd(p);
        const top = this.stack[this.idx];
        if (top && top.md === md) return;
        if (this.idx !== this.stack.length - 1) this.stack = this.stack.slice(0, this.idx + 1);
        this.stack.push({ md: md, caret: caretOffset(p) });
        if (this.stack.length > this.LIMIT) this.stack.shift();
        this.idx = this.stack.length - 1;
        this.update();
      },
      schedule() { clearTimeout(this.timer); this.timer = setTimeout(() => this.snap(), 420); },
      apply(entry) {
        if (!entry) return;
        this.lock = true;
        setMd(entry.md, p);
        markDirty(p);
        p.el.editor.focus();
        setCaretByOffset(entry.caret || 0, p);
        this.update();
        setTimeout(() => { this.lock = false; }, 60);
      },
      undo() {
        if (this.idx <= 0) return false;
        this.idx--; this.apply(this.stack[this.idx]);
        status('已撤回');
        return true;
      },
      redo() {
        if (this.idx >= this.stack.length - 1) return false;
        this.idx++; this.apply(this.stack[this.idx]);
        status('已重做');
        return true;
      },
      update() {
        const u = p.el.undo, r = p.el.redo;
        if (u) u.disabled = this.idx <= 0;
        if (r) r.disabled = this.idx >= this.stack.length - 1;
      },
    };
  }

  // 右栏由左栏克隆出来（结构 / 样式与左栏完全一致），id 统一加 “-b” 后缀
  function buildPane(key) {
    const sfx = key === 'a' ? '' : '-' + key;
    let root = key === 'a' ? $('pane-a') : null;
    if (key !== 'a') {
      const clone = $('pane-a').cloneNode(true);
      clone.querySelectorAll('[id]').forEach(el => { el.id = el.id + sfx; });
      clone.id = 'pane-' + key;
      clone.classList.remove('active', 'dim');
      clone.classList.add('hidden');
      const c = (id) => clone.querySelector('#' + id + sfx);
      c('doc-title').value = '';
      c('doc-title').style.width = '';
      c('dt-chips').innerHTML = '';
      c('tag-suggest').innerHTML = '';
      c('tag-suggest').classList.add('hidden');
      c('tb-palette').innerHTML = '';
      c('tb-palette').classList.add('hidden');
      c('wc-badge').textContent = '0';
      c('src-view').value = '';
      c('editor').innerHTML = '<p><br></p>';
      c('editor').classList.remove('is-empty');
      c('preview-pane').classList.add('hidden');
      c('editor-pane').classList.remove('hidden');
      c('editor-wrap').classList.remove('split');
      c('btn-prev-day').classList.add('hidden');
      c('btn-next-day').classList.add('hidden');
      $('panes').appendChild(clone);
      root = clone;
    }
    const q = (id) => document.getElementById(id + sfx);
    const p = {
      key: key, sfx: sfx, root: root,
      note: null, dirty: false, _t: null,
      el: {
        editor: q('editor'), title: q('doc-title'), chips: q('dt-chips'),
        tagInput: q('dt-input'), tagSuggest: q('tag-suggest'),
        wrap: q('editor-wrap'), editPane: q('editor-pane'), preview: q('preview-pane'),
        toolbar: q('toolbar'), undo: q('btn-undo'), redo: q('btn-redo'),
        palette: q('tb-palette'), wc: q('wc-badge'), src: q('src-view'),
        prevDay: q('btn-prev-day'), nextDay: q('btn-next-day'),
      },
    };
    p.undo = makeUndo(p);
    bindPane(p);
    return p;
  }

  function initPanes() {
    PANES.a = buildPane('a');
    paintActivePane();
  }

  // 双栏开关：打开时右栏显示“当前日期的后一天”，两栏都能写
  async function setDaySplit(on) {
    if (!!on === !!S.daySplit) return;
    if (on) {
      await saveCurrent(false, curPane());
      S.split = false;                      // 双栏下不再叠加源码对照，否则每列太窄
      S.daySplit = true;
      PANES.b = buildPane('b');
      $('panes').classList.add('splitting');
      PANES.b.root.classList.remove('hidden');
      PANES.b.root.classList.add('dim');
      const base = currentJournalDate(PANES.a);
      // 左栏是日记 → 右栏接着显示次日；左栏是普通笔记 → 右栏显示今天
      const next = base
        ? new Date(base.getFullYear(), base.getMonth(), base.getDate() + 1, 12)
        : new Date();
      await openJournal(next, PANES.b);
      const from = base || next;
      status('双栏：' + (from.getMonth() + 1) + '月' + from.getDate() + '日 / ' +
        (next.getMonth() + 1) + '月' + next.getDate() + '日');
    } else {
      const wasB = ACTIVE === 'b';
      const b = PANES.b;
      if (b) {
        clearTimeout(b._t);
        if (b.dirty) await saveCurrent(false, b);
        b.dead = true;
      }
      S.daySplit = false;
      $('panes').classList.remove('splitting');
      if (b) b.root.remove();
      delete PANES.b;
      ACTIVE = 'a';
      // 焦点在右栏时，把右栏正在看的笔记挪到左栏，别让眼前内容消失
      if (wasB && b && b.note) await loadPane(PANES.a, b.note);
      paintActivePane();
      status('已退出双栏');
    }
    await Store.setSetting('daySplit', S.daySplit);
    applyView();
    renderNotes();
    renderBottomPanel();
  }


  /* ---------------- 日历 ---------------- */
  function renderCalendar() {
    const grid = $('cal-grid');
    const y = S.calView.getFullYear();
    const m = S.calView.getMonth();
    $('cal-year').textContent = y;
    $('cal-month').textContent = m + 1;

    const heads = S.firstMonday
      ? ['一', '二', '三', '四', '五', '六', '日']
      : ['日', '一', '二', '三', '四', '五', '六'];

    let html = '<div class="cal-cell head"></div>';
    heads.forEach(w => { html += '<div class="cal-cell head">周' + w + '</div>'; });

    const first = new Date(y, m, 1);
    const offset = S.firstMonday ? (first.getDay() + 6) % 7 : first.getDay();
    const start = new Date(y, m, 1 - offset);
    const today = new Date();
    const cur = new Date(start);

    for (let row = 0; row < 6; row++) {
      html += '<div class="cal-cell weeknum">' + isoWeek(cur) + '</div>';
      for (let col = 0; col < 7; col++) {
        const cls = ['cal-cell', 'day'];
        if (cur.getMonth() !== m) cls.push('other');
        if (dayKey(cur) === dayKey(today)) cls.push('today');
        if (dayKey(cur) === dayKey(S.calSel)) cls.push('selected');
        const has = S.noteDates.has(dayKey(cur));
        html += '<div class="' + cls.join(' ') + '" data-date="' + dayKey(cur) + '">' +
          '<span class="num">' + cur.getDate() + '</span>' +
          (has ? '<span class="dot"></span>' : '') + '</div>';
        cur.setDate(cur.getDate() + 1);
      }
    }
    grid.innerHTML = html;

    grid.querySelectorAll('.cal-cell.day').forEach(cell => {
      cell.addEventListener('click', () => {
        const p = cell.dataset.date.split('-').map(Number);
        S.calSel = new Date(p[0], p[1] - 1, p[2]);
        S.calView = new Date(p[0], p[1] - 1, 1);
        renderCalendar();
        openJournal(new Date(p[0], p[1] - 1, p[2]));
      });
    });
  }

  /* ---------------- 搜索辅助 ---------------- */
  // 日记文件名是 2026-10-24，界面上显示 2026年10月24日（只用于显示，不参与搜索）
  function journalAlias(name) {
    const d = parseJournalName(name);
    if (!d) return '';
    return d.getFullYear() + '年' + (d.getMonth() + 1) + '月' + d.getDate() + '日';
  }
  // Markdown → 可读纯文字（去标记，保留内容），供搜索命中与结果摘要使用
  function plainText(md) {
    return String(md || '')
      .replace(/<!--[\s\S]*?-->/g, ' ')
      .replace(/^```[^\n]*$/gm, ' ')
      .replace(/!\[[^\]]*\]\([^)]*\)/g, ' ')
      .replace(/\[\[([^\]]*)\]\]/g, '$1')
      .replace(/\[([^\]]*)\]\([^)]*\)/g, '$1')
      .replace(/^\s{0,3}#{1,6}\s+/gm, '')
      .replace(/^\s{0,3}>\s?/gm, '')
      .replace(/^\s*(?:[-*+]|\d+\.)\s+/gm, '')
      .replace(/[*_~`]/g, '')
      .replace(/\s+/g, ' ')
      .trim();
  }
  // 空格分词，全部命中才算（AND）
  function searchTerms() {
    return S.search.trim().toLowerCase().split(/\s+/).filter(Boolean);
  }
  // 命中处前后各取一小段作为摘要；起点优先落在标点之后，保证关键词在窄侧栏里也能露出来
  function snippetOf(text, terms) {
    if (!text) return '';
    const low = text.toLowerCase();
    let at = -1;
    terms.forEach(t => {
      const i = low.indexOf(t);
      if (i >= 0 && (at < 0 || i < at)) at = i;
    });
    if (at < 0) return '';
    let start = Math.max(0, at - 10);
    if (start > 0) {
      const win = text.slice(start, at);
      const p = Math.max.apply(null, [' ', '，', '。', '：', '；', '、', '）', '】', '!', '?']
        .map(c => win.lastIndexOf(c)));
      if (p >= 0) start = start + p + 1;
    }
    const end = Math.min(text.length, at + 56);
    const body = text.slice(start, end).trim();
    return (start > 0 ? '…' : '') + body + (end < text.length ? '…' : '');
  }
  // 把命中词包成 <mark>（先分词再逐个转义，避免把标签也替换掉）
  function hlTerms(text, terms) {
    if (!terms.length) return esc(text);
    const pattern = terms.map(t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'))
      .sort((a, b) => b.length - a.length).join('|');
    const re = new RegExp('(' + pattern + ')', 'gi');
    return String(text).split(re)
      .map((seg, i) => (i % 2 ? '<mark>' + esc(seg) + '</mark>' : esc(seg))).join('');
  }
  // 日记在列表里直接显示中文日期，和顶部标题一致
  function displayName(n) {
    const d = parseJournalName(n.name);
    return d ? journalAlias(n.name) : n.name.replace(/\.md$/i, '');
  }

  /* ---------------- 侧栏列表 ---------------- */
  function renderNotes() {
    const ul = $('note-list');
    const terms = searchTerms();
    const searching = terms.length > 0;
    // 空日记（bug 遗留或清空后的）不参与列表
    let list = S.notes.filter(n => !isBlankJournal(n));

    // 分段：全部 / 收藏
    if (S.tab === 'fav') list = list.filter(n => !!n.favorite);
    // 标签筛选
    if (S.tagFilter) list = list.filter(n => extractTags(n.content).includes(S.tagFilter));

    // 只搜正文内容：笔记按日期记录，没有标题这一说
    const hayOf = (n) => plainText(liveContent(n));
    let hits = new Map();
    if (searching) {
      list = list.filter(n => {
        const body = hayOf(n);
        if (!terms.every(t => body.toLowerCase().includes(t))) return false;
        hits.set(n.id, body);
        return true;
      });
    }

    // 筛选条：标签筛选 / 搜索关键词 共用一条
    const bar = $('filter-bar');
    if (S.tagFilter) {
      $('filter-label').textContent = '#' + S.tagFilter;
      bar.classList.remove('hidden');
    } else if (searching) {
      $('filter-label').textContent = '“' + S.search.trim() + '” · ' + list.length + ' 条';
      bar.classList.remove('hidden');
    } else {
      bar.classList.add('hidden');
    }

    if (!list.length) {
      let tip = '暂无笔记';
      if (searching) tip = '没有匹配“' + S.search.trim() + '”的笔记';
      else if (S.tagFilter) tip = '没有带 #' + S.tagFilter + ' 的笔记';
      else if (S.tab === 'fav') tip = '还没有收藏。把鼠标移到笔记上，点右侧的 ☆ 即可收藏。';
      ul.innerHTML = '<li class="empty-tip">' + esc(tip) + '</li>';
      return;
    }
    ul.innerHTML = '';
    const sorted = list.slice().sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
    // 另一个窗格正在显示的那篇，用浅底标出来（活动窗格那篇仍是 .active）
    const op = ACTIVE === 'b' ? PANES.a : PANES.b;
    const bp = op && op.note && !(S.current && op.note.id === S.current.id) ? op.note.id : null;
    sorted.slice(0, 300).forEach(n => {
      const d = parseJournalName(n.name);
      const li = document.createElement('li');
      li.className = 'note-item' +
        (S.current && S.current.id === n.id ? ' active' : (bp && bp === n.id ? ' open' : ''));
      li.innerHTML =
        '<span class="n-icon">' + (d ? '📅' : '📄') + '</span>' +
        '<span class="n-main"><span class="n-name"></span><span class="n-snip"></span></span>' +
        '<button class="n-fav' + (n.favorite ? ' on' : '') + '" title="' +
          (n.favorite ? '取消收藏' : '收藏') + '">' + (n.favorite ? '★' : '☆') + '</button>' +
        '<button class="n-more" title="更多">⋮</button>';
      li.querySelector('.n-name').textContent = displayName(n);
      const snip = li.querySelector('.n-snip');
      if (searching) {
        const s = snippetOf(hits.get(n.id) || hayOf(n), terms);
        if (s) snip.innerHTML = hlTerms(s, terms);
        else snip.remove();
      } else {
        snip.remove();
      }
      li.addEventListener('click', (e) => {
        if (e.target.closest('.n-more') || e.target.closest('.n-fav')) return;
        openNote(n, true);
      });
      li.querySelector('.n-fav').addEventListener('click', async (e) => {
        e.stopPropagation();
        const fav = !n.favorite;
        await Store.put({ id: n.id, name: liveName(n), content: liveContent(n), favorite: fav });
        if (S.current && S.current.id === n.id) S.current.favorite = fav;
        await refreshAll();
        status(fav ? '已收藏' : '已取消收藏');
      });
      li.querySelector('.n-more').addEventListener('click', (e) => {
        e.stopPropagation();
        showNoteMenu(e.clientX, e.clientY, n);
      });
      ul.appendChild(li);
    });
  }

  function filterByTag(tag) {
    S.tagFilter = tag;
    S.tab = 'notes';
    document.querySelectorAll('.seg-item').forEach(b => b.classList.remove('selected'));
    $('note-list').classList.remove('hidden');
    $('tag-list').classList.add('hidden');
    renderNotes();
  }

  // 标签池：所有笔记里用过的标签（含使用次数），供侧栏列表与「添加标签」建议共用
  function tagPool() {
    const map = new Map();
    S.notes.forEach(n => extractTags(n.content).forEach(t => map.set(t, (map.get(t) || 0) + 1)));
    return Array.from(map.entries())
      .sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]))
      .map(([name, count]) => ({ name, count }));
  }
  function renderTags() {
    const ul = $('tag-list');
    const tags = tagPool();
    if (!tags.length) {
      ul.innerHTML = '<li class="empty-tip">还没有标签。在编辑区标题下方的「＋ 添加标签」，或直接在正文写 #标签。</li>';
      return;
    }
    ul.innerHTML = '';
    tags.forEach(({ name: t, count: c }) => {
      const li = document.createElement('li');
      li.className = 'tag-item';
      li.innerHTML = '<span>#' + esc(t) + '</span><span class="t-count">' + c + '</span>';
      li.addEventListener('click', () => {
        S.search = '';
        $('search').value = '';
        filterByTag(t);
        status('筛选 #' + t + '：' + c + ' 篇');
      });
      ul.appendChild(li);
    });
  }

  /* ---------------- 当前笔记的标签条 ---------------- */
  function renderDocTags(p) {
    p = p || curPane();
    const box = p.el.chips;
    if (!box) return;
    if (!p.note) { box.innerHTML = ''; return; }
    const tags = extractTags(getMd(p));
    box.innerHTML = '';
    tags.forEach(t => {
      const chip = document.createElement('span');
      chip.className = 'dt-chip';
      chip.dataset.tag = t;
      chip.innerHTML = '<span>#' + esc(t) + '</span><span class="dt-x" title="从正文移除">✕</span>';
      chip.querySelector('.dt-x').addEventListener('click', (e) => {
        e.stopPropagation();
        removeTag(t, p);
      });
      chip.addEventListener('click', () => filterByTag(t));
      box.appendChild(chip);
    });
  }

  function addTag(tag, p) {
    p = p || curPane();
    const clean = String(tag || '').trim().replace(/^#+/, '').replace(/\s+/g, '');
    if (!clean) return;
    if (extractTags(getMd(p)).includes(clean)) { renderDocTags(p); return; }
    const el = document.createElement('p');
    const span = document.createElement('span');
    span.className = 'tag-chip';
    span.dataset.tag = clean;
    span.textContent = '#' + clean;
    el.appendChild(span);
    ED(p).appendChild(el);
    markDirty(p);
    renderDocTags(p);
  }

  function removeTag(tag, p) {
    p = p || curPane();
    const re = new RegExp('(^|[\\s(（])#' + tag.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '(?=$|[\\s，。,;；!！?？\'"）)])', 'g');
    const md = getMd(p).replace(re, (m, p1) => p1)
      .replace(/\n{3,}/g, '\n\n').replace(/\s+$/, '');
    setMd(md, p);
    markDirty(p);
    renderDocTags(p);
  }

  /* --- 标签池建议：别的笔记用过的标签会出现在这里，点一下才标记到本篇 --- */
  let tagSugIdx = -1;
  let tagSugList = [];
  let tagSugPane = null;
  function tagSuggestCandidates(p) {
    const used = extractTags(getMd(p));
    const q = p.el.tagInput.value.trim().replace(/^#+/, '').toLowerCase();
    return tagPool()
      .filter(x => !used.includes(x.name))
      .filter(x => !q || x.name.toLowerCase().includes(q));
  }
  function showTagSuggest(p) {
    p = p || curPane();
    const box = p.el.tagSuggest;
    if (!box) return;
    tagSugPane = p;
    tagSugList = tagSuggestCandidates(p);
    tagSugIdx = -1;
    if (!tagSugList.length) {
      const other = tagPool().filter(x => !extractTags(getMd(p)).includes(x.name));
      box.innerHTML = '<div class="ts-empty">' + (other.length
        ? '没有匹配的标签'
        : '标签池里还没有别的标签。输入新名字回车，它会出现在其它笔记的建议里。') + '</div>';
      box.classList.remove('hidden');
      return;
    }
    box.innerHTML = '';
    tagSugList.slice(0, 10).forEach((x, i) => {
      const b = document.createElement('button');
      b.className = 'ts-item';
      b.dataset.i = String(i);
      b.innerHTML = '<span>#' + esc(x.name) + '</span><span class="ts-count">' + x.count + ' 篇</span>';
      b.addEventListener('mousedown', (e) => { e.preventDefault(); pickTag(x.name, p); });
      box.appendChild(b);
    });
    box.classList.remove('hidden');
  }
  function pickTag(name, p) {
    p = p || tagSugPane || curPane();
    addTag(name, p);
    p.el.tagInput.value = '';
    hideTagSuggest(p);
    status('已添加标签 #' + name);
  }
  function hideTagSuggest(p) {
    p = p || curPane();
    const box = p.el.tagSuggest;
    if (box) box.classList.add('hidden');
    tagSugIdx = -1;
  }
  function moveTagSug(delta, p) {
    p = p || curPane();
    if (!tagSugList.length) return;
    tagSugIdx = (tagSugIdx + delta + tagSugList.length) % tagSugList.length;
    const box = p.el.tagSuggest;
    Array.from(box.querySelectorAll('.ts-item')).forEach((el, i) => el.classList.toggle('on', i === tagSugIdx));
  }

  /* ---------------- 笔记打开 / 保存 ---------------- */
  // 正在某个窗格里编辑的笔记以编辑器内容为准，避免收藏/改名时用旧内容覆盖
  function liveContent(note) {
    const p = paneOfNote(note);
    return p ? getMd(p) : (note.content || '');
  }
  function liveName(note) {
    const p = paneOfNote(note);
    if (!p) return note.name;
    const jd = parseJournalName(note.name);
    if (jd) return note.name;
    const t = p.el.title.value.trim();
    return t ? (t.endsWith('.md') ? t : t + '.md') : note.name;
  }
  function setTitleFor(note, p) {
    p = p || curPane();
    const t = p.el.title;
    const jd = parseJournalName(note.name);
    if (jd) {
      t.value = jd.getFullYear() + '年' + (jd.getMonth() + 1) + '月' + jd.getDate() + '日';
      t.readOnly = true;
      t.title = '日记文件名固定为日期，不可改名';
    } else {
      t.value = note.name.replace(/\.md$/, '');
      t.readOnly = false;
      t.title = '';
    }
    fitDatedTitle(jd, p);
  }
  // 日记标题按文字宽度收窄，好让「›」紧贴日期，又不动左边缘（标题仍与正文左对齐）
  function measureTextWidth(text, el) {
    const cs = getComputedStyle(el);
    const c = document.createElement('canvas').getContext('2d');
    c.font = cs.fontStyle + ' ' + cs.fontWeight + ' ' + cs.fontSize + ' / 1 ' + cs.fontFamily;
    return c.measureText(text).width;
  }
  function fitDatedTitle(jd, p) {
    p = p || curPane();
    const t = p.el.title;
    const on = !!jd;
    p.el.prevDay.classList.toggle('hidden', !on);
    p.el.nextDay.classList.toggle('hidden', !on);
    t.classList.toggle('dated', on);
    if (!on) { t.style.width = ''; return; }
    t.style.width = Math.ceil(measureTextWidth(t.value, t)) + 2 + 'px';
  }
  // 窗格对应的日期（非日记返回 null）
  function currentJournalDate(p) {
    p = p || curPane();
    return p.note ? parseJournalName(p.note.name) : null;
  }
  async function stepDay(delta, p) {
    p = p || curPane();
    const jd = currentJournalDate(p);
    if (!jd) return;
    // 用中午避开夏令时/时区边界
    const d = new Date(jd.getFullYear(), jd.getMonth(), jd.getDate() + delta, 12);
    if (p === curPane()) {
      S.calSel = new Date(d.getFullYear(), d.getMonth(), d.getDate());
      S.calView = new Date(d.getFullYear(), d.getMonth(), 1);
      renderCalendar();
    }
    await openJournal(d, p);
    status((delta < 0 ? '前一天 · ' : '后一天 · ') + (d.getMonth() + 1) + '月' + d.getDate() + '日');
  }

  async function openJournal(date, p) {
    p = p || curPane();
    const name = journalName(date);
    let note = await Store.byName(name);
    if (!note) {
      // 不落盘：只在内存里开一个草稿视图，用户真正写入内容后才创建 .md
      note = {
        id: 'draft:' + name,
        name: name,
        content: '',
        favorite: false,
        draft: true,
        updatedAt: Date.now(),
      };
    }
    await openNote(note, false, true, p);
  }

  // 只装载，不做保存 / 去重判断
  async function loadPane(p, note) {
    p.note = note;
    p.dirty = false;
    setTitleFor(note, p);
    setMd(note.content || '', p);
    p.undo.reset(note.content || '');
    renderPreview(p);
    updateWc(p);
    renderDocTags(p);
    if (p === curPane()) {
      setSaveState(note.draft ? '未创建（输入内容后自动保存）' : '未修改', p);
    }
    renderNotes();
    renderBottomPanel();
  }

  async function openNote(note, pushHistory, doSave, p) {
    p = p || curPane();
    if (doSave !== false && p.dirty) await saveCurrent(false, p);

    const o = otherPane(p);
    // 同一篇笔记不同时占两个窗格：撞上了就互换两边内容
    const swap = (o && o.note && p.note && o.note.id === note.id) ? p.note : null;
    await loadPane(p, note);
    if (swap) await loadPane(o, swap);

    // 空白笔记直接进入可写状态，点日历当天就能打字（只对正在操作的窗格抢焦点）
    if (p === curPane() && !getMd(p).trim() && S.view === 'edit' && !S.split) {
      const ed = p.el.editor;
      ed.focus();
      placeCaretEnd(ed.firstElementChild || ed);
    }
    // 窄屏下选完笔记把抽屉收起来，别挡着正文
    if (p === curPane() && isNarrow()) setSidebar(false);
  }

  async function saveCurrent(manual, p) {
    p = p || curPane();
    if (!p.note || p.dead) return;
    const content = getMd(p);

    // 空白日记草稿不落盘：不产生文件、不进列表、不打日历圆点
    if (p.note.draft && !content.trim()) {
      p.note.content = '';
      p.dirty = false;
      if (p === curPane()) setSaveState('未创建（输入内容后自动保存）', p);
      if (manual) status('空日记未创建文件');
      return;
    }

    const title = p.el.title.value.trim() || '无标题';
    const jd = parseJournalName(p.note.name);
    const name = jd ? p.note.name
      : (title.endsWith('.md') ? title : title + '.md');

    const saved = await Store.put({
      id: p.note.draft ? undefined : p.note.id,
      name: name,
      content: content,
      favorite: p.note.favorite || false,
    });
    p.note = saved;
    p.dirty = false;
    if (p === curPane()) {
      setSaveState('已保存 ' + new Date().toLocaleTimeString('zh-CN', { hour12: false }), p);
    }
    await refreshAll();
    renderPreview(p);
    updateWc(p);
    if (manual) status('已保存到本地');
    if (FEATURES.webdav && S.dav.auto && S.dav.url) {
      davPutOne(saved).catch(e => setSyncStatus('同步失败：' + e.message));
    }
  }

  /* ---------------- 撤回 / 重做（每个窗格一套 Markdown 快照栈，见 makeUndo） ---------------- */
  // 光标在编辑器内的文本偏移量（撤销后用它把光标放回原处）
  function caretOffset(p) {
    const r = getRange(p);
    if (!r) return 0;
    const pre = document.createRange();
    pre.selectNodeContents(ED(p));
    try { pre.setEnd(r.startContainer, r.startOffset); } catch (e) { return 0; }
    return pre.toString().length;
  }
  function setCaretByOffset(off, p) {
    const ed = ED(p);
    const walker = document.createTreeWalker(ed, NodeFilter.SHOW_TEXT);
    let acc = 0, n, last = null;
    while ((n = walker.nextNode())) {
      const len = n.textContent.length;
      if (acc + len >= off) { placeCaret(n, Math.max(0, off - acc)); return; }
      acc += len; last = n;
    }
    if (last) placeCaret(last, last.textContent.length);
    else placeCaret(ed, 0);
  }
  function markDirty(p) {
    p = p || curPane();
    p.dirty = true;
    p.undo.schedule();
    setSaveState('未保存…', p);
    updatePlaceholder(p);
    renderPreview(p);
    updateWc(p);
    renderDocTags(p);
    clearTimeout(p._t);
    p._t = setTimeout(() => saveCurrent(false, p), 650);
  }

  function updateWc(p) {
    p = p || curPane();
    if (p.el.wc) p.el.wc.textContent = countWords(getMd(p));
  }
  // 状态栏只有一条：只显示活动窗格的保存状态
  function setSaveState(txt, p) {
    p = p || curPane();
    if (p !== curPane()) return;
    const el = $('status-save');
    el.textContent = txt;
    el.classList.toggle('dirty', p.dirty);
    el.classList.toggle('saved', !p.dirty && txt.indexOf('已保存') === 0);
  }
  // 源码视图：用户正在源码框里打字时不要回写，避免光标跳动
  function renderSource(p) {
    p = p || curPane();
    const src = p.el.src;
    if (!src) return;
    if (document.activeElement === src) return;
    src.value = getMd(p);
  }
  function renderPreview(p) { renderSource(p); }
  function status(t) { $('status-text').textContent = t; }
  function setSyncStatus(t) {
    $('status-sync').textContent = t;
    clearTimeout(S._st);
    S._st = setTimeout(() => { $('status-sync').textContent = ''; }, 5000);
  }

  // 清掉历史版本“点日期即建空文件”留下的空日记（内容为空，无信息损失）
  async function purgeBlankJournals() {
    const blanks = (await Store.allNotes()).filter(isBlankJournal);
    for (const n of blanks) {
      try { await Store.del(n.id); } catch {}
    }
    return blanks.length;
  }

  async function refreshAll() {
    S.notes = (await Store.allNotes()).sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
    S.noteDates = new Set(
      S.notes
        .filter(n => !isBlankJournal(n))
        .map(n => parseJournalName(n.name)).filter(Boolean).map(d => dayKey(d))
    );
    renderNotes();
    renderTags();
    renderCalendar();   // 日历随数据刷新圆点
    renderBottomPanel(); // 新建 / 删除笔记后引用方随之更新
  }

  /* ---------------- 底部引用面板：双链引用方 ---------------- */
  function bpStats() {
    if (!S.current) return { refs: [], missing: [] };
    const curName = S.current.name.replace(/\.md$/, '');
    const jd = parseJournalName(S.current.name);
    const alias = jd ? jd.getFullYear() + '年' + (jd.getMonth() + 1) + '月' + jd.getDate() + '日' : null;
    const names = alias ? [curName, alias] : [curName];

    const refs = S.notes.filter(n => {
      if (n.id === S.current.id) return false;
      const links = extractWikiLinks(n.content).map(l => l.replace(/\.md$/, ''));
      if (links.some(l => names.includes(l))) return true;
      return names.some(nm => new RegExp('\\[([^\\]]*)\\]\\(' + nm.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\.md\\)').test(n.content || ''));
    });

    const missing = extractWikiLinks(getMd())
      .filter(l => !S.notes.some(n => n.name === l + '.md' || n.name === l || n.name === l.replace(/\.md$/, '') + '.md'));

    return { refs };
  }

  function renderBottomPanel() {
    const body = $('bp-body');
    if (!S.current) {
      $('bp-summary').textContent = '无打开笔记';
      body.innerHTML = '<div class="bp-empty">无打开笔记</div>';
      return;
    }
    const { refs } = bpStats();
    // 日记提示里用界面上看到的日期写法，用户照着写 [[2026年10月24日]] 也能解析
    const curName = displayName(S.current);
    $('bp-summary').textContent = '引用方 ' + refs.length;

    body.innerHTML = '';
    if (!refs.length) {
      body.innerHTML = '<div class="bp-empty">还没有其他笔记引用本篇。在别的笔记正文里写 [[' +
        esc(curName) + ']]，它就会出现在这里（双向链接）。</div>';
      return;
    }
    refs.forEach(n => body.appendChild(bpRow(n)));
  }

  function bpRow(n) {
    const div = document.createElement('div');
    div.className = 'bp-row';
    const d = parseJournalName(n.name);
    div.innerHTML = '<span>' + (d ? '📅' : '📄') + '</span><span></span>';
    div.lastElementChild.textContent = n.name.replace(/\.md$/, '');
    div.addEventListener('click', () => openNote(n, true));
    return div;
  }

  /* ---------------- 笔记菜单 ---------------- */
  let activeMenu = null;
  function closeMenu() {
    if (activeMenu) { activeMenu.remove(); activeMenu = null; }
  }
  function showNoteMenu(x, y, note) {
    closeMenu();
    const menu = document.createElement('div');
    menu.className = 'menu';
    menu.style.left = Math.min(x, window.innerWidth - 150) + 'px';
    menu.style.top = Math.min(y, window.innerHeight - 130) + 'px';
    const jd = parseJournalName(note.name);
    menu.innerHTML =
      '<button data-act="favorite">' + (note.favorite ? '取消收藏' : '收藏') + '</button>' +
      '<button data-act="rename"' + (jd ? ' disabled style="opacity:.4"' : '') + '>重命名</button>' +
      '<button data-act="export">导出 .md</button>' +
      '<button data-act="delete" class="danger">删除</button>';
    document.body.appendChild(menu);
    activeMenu = menu;
    menu.addEventListener('click', async (e) => {
      const act = e.target.dataset.act;
      if (!act) return;
      closeMenu();
      if (act === 'favorite') {
        const fav = !note.favorite;
        await Store.put({
          id: note.id, name: liveName(note), content: liveContent(note), favorite: fav,
        });
        if (S.current && S.current.id === note.id) S.current.favorite = fav;
        await refreshAll();
        status(fav ? '已收藏' : '已取消收藏');
      }
      if (act === 'export') downloadNote(note);
      if (act === 'rename') {
        const name = prompt('新名称（不含 .md）', note.name.replace(/\.md$/, ''));
        if (!name) return;
        await Store.put({ id: note.id, name: name + '.md', content: liveContent(note), favorite: note.favorite });
        await refreshAll();
        if (S.current && S.current.id === note.id) {
          const fresh = await Store.byName(name + '.md');
          if (fresh) await openNote(fresh, false, false);
        }
      }
      if (act === 'delete') {
        if (!confirm('删除「' + note.name + '」？')) return;
        await Store.del(note.id);
        if (S.current && S.current.id === note.id) {
          S.current = null;
          await refreshAll();
          await openJournal(new Date());
        } else {
          await refreshAll();
        }
      }
    });
  }
  document.addEventListener('click', (e) => {
    if (activeMenu && !activeMenu.contains(e.target)) closeMenu();
  });

  /* ---------------- 视图模式 ---------------- */
  /* 顶栏图标（16px 线性 SVG，描边用 currentColor，和文字一起变色） */
  const SVG = (d, extra) => '<svg viewBox="0 0 16 16" width="16" height="16" fill="none" ' +
    'stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round">' +
    d + (extra || '') + '</svg>';
  const ICON = {
    eye: SVG('<path d="M1.9 8S4.4 3.9 8 3.9 14.1 8 14.1 8 11.6 12.1 8 12.1 1.9 8 1.9 8Z"/>', '<circle cx="8" cy="8" r="1.75"/>'),
    pencil: SVG('<path d="M11.1 2.6l2.3 2.3-7.4 7.4-3.1.8.8-3.1 7.4-7.4Z"/><path d="M9.6 4.1l2.3 2.3"/>'),
    split: SVG('<rect x="2.2" y="3.2" width="11.6" height="9.6" rx="1.2"/><path d="M8 3.2v9.6"/>'),
  };

  function applyView() {
    ['a', 'b'].forEach(k => {
      const p = PANES[k];
      if (!p) return;
      // 双栏时不再叠加「源码对照」，否则每一列都太窄
      const srcSplit = S.split && !S.daySplit;
      p.el.wrap.classList.toggle('split', srcSplit);
      if (srcSplit) {
        p.el.editPane.classList.remove('hidden');
        p.el.preview.classList.remove('hidden');
      } else if (S.view === 'preview') {
        p.el.editPane.classList.add('hidden');
        p.el.preview.classList.remove('hidden');
        renderPreview(p);
      } else {
        p.el.editPane.classList.remove('hidden');
        p.el.preview.classList.add('hidden');
      }
    });
    const btn = $('btn-view');
    if (S.split && !S.daySplit) {
      btn.innerHTML = ICON.split;
      btn.title = '分栏对照（再点回到写作）';
    } else if (S.view === 'preview') {
      btn.innerHTML = ICON.pencil;
      btn.title = '回到写作 (Ctrl+E)';
    } else {
      btn.innerHTML = ICON.eye;
      btn.title = '只读预览 (Ctrl+E)';
    }
    const db = $('btn-day-split');
    if (db) {
      db.classList.toggle('on', S.daySplit);
      db.title = S.daySplit
        ? '退出双栏 (Ctrl+Shift+D)'
        : '双栏：同时编辑连续两天 (Ctrl+Shift+D)';
    }
  }

  /* ---------------- 富文本编辑器（所见即所得，落盘仍是 Markdown） ---------------- */
  function getMd(p) { return htmlToMd(ED(p)); }
  function updatePlaceholder(p) {
    p = p || curPane();
    const el = p.el.editor;
    const empty = !el.textContent.trim() &&
      !el.querySelector('img,table,pre,hr,ul,ol,blockquote');
    el.classList.toggle('is-empty', empty);
  }
  function setMd(md, p) {
    p = p || curPane();
    const el = p.el.editor;
    const html = renderMd(md || '');
    // 始终保证有可编辑的块，避免文字落在编辑器根的裸文本节点里
    el.innerHTML = html || '<p><br></p>';
    updatePlaceholder(p);
    renderSource(p);
  }
  function getRange(p) {
    const sel = window.getSelection();
    if (!sel || !sel.rangeCount) return null;
    const r = sel.getRangeAt(0);
    if (!ED(p).contains(r.startContainer)) return null;
    return r;
  }
  function placeCaret(node, offset) {
    if (!node) return;
    const r = document.createRange();
    try { r.setStart(node, offset || 0); } catch (e) { return; }
    r.collapse(true);
    const sel = window.getSelection();
    sel.removeAllRanges(); sel.addRange(r);
  }
  function placeCaretEnd(el) {
    const r = document.createRange();
    r.selectNodeContents(el); r.collapse(false);
    const sel = window.getSelection();
    sel.removeAllRanges(); sel.addRange(r);
  }
  function blockOf() {
    const r = getRange();
    if (!r) return null;
    let node = r.startContainer;
    if (node.nodeType === 3) node = node.parentNode;
    while (node && node !== ED()) {
      if (node.nodeType === 1 && BLOCKS.test(node.tagName)) return node;
      node = node.parentNode;
    }
    return null;
  }
  // 光标在编辑器根（裸文本 / 空白区）时，放进最近的块
  function ensureBlock() {
    const blk = blockOf();
    if (blk) return blk;
    const r = getRange();
    if (!r) return null;
    let node = r.startContainer;
    if (node.nodeType === 3 && node.parentNode === ED()) {
      const p = document.createElement('p');
      node.before(p);
      p.appendChild(node);
      placeCaret(p.firstChild, Math.min(r.startOffset, p.firstChild.textContent.length));
      return p;
    }
    if (node === ED()) {
      const kids = Array.from(ED().children);
      let target = kids[r.startOffset - 1] || kids[r.startOffset] || kids[kids.length - 1];
      if (!target) {
        const p = document.createElement('p');
        p.innerHTML = '<br>';
        ED().appendChild(p);
        target = p;
      }
      if (/^(UL|OL)$/.test(target.tagName)) target = target.lastElementChild || target;
      if (/^(BLOCKQUOTE)$/.test(target.tagName)) target = target.lastElementChild || target;
      placeCaretEnd(target);
      return blockOf();
    }
    return null;
  }

  // 浏览器插入块内容时可能把 <ul>/<table> 塞进 <p> 里，这里把它们提到段落之后
  function liftNestedBlocks(root) {
    if (!root) return;
    Array.from(root.querySelectorAll('p,h1,h2,h3,h4,h5,h6')).forEach(host => {
      if (!host.isConnected) return;
      const extra = Array.from(host.children).filter(c => /^(UL|OL|TABLE|PRE|BLOCKQUOTE|HR)$/.test(c.tagName));
      if (!extra.length) return;
      // 用 DocumentFragment 一次性插到段落后面：逐个 host.after() 会让多个块逆序
      const frag = document.createDocumentFragment();
      extra.forEach(c => frag.appendChild(c));
      host.after(frag);         // 同一父容器内提到段落后面，结构就合法了
    });
  }
  // 粘贴后收拾块首/块尾多余的 <br>（空段落里的 <br> 保留）
  function tidyAfterPaste(root) {
    if (!root) return;
    root.querySelectorAll('p,h1,h2,h3,h4,h5,h6').forEach(el => {
      if (!el.isConnected) return;
      if (!el.textContent.trim() && !el.querySelector('img,table')) return;
      while (el.firstChild && el.firstChild.nodeName === 'BR') el.removeChild(el.firstChild);
      while (el.lastChild && el.lastChild.nodeName === 'BR') el.removeChild(el.lastChild);
    });
  }

  /* --- 回车：续列表 / 退列表 / 标题后回正文 / 续引用 --- */
  // 光标是否已在该块内容末尾（后面没有可见内容）
  function caretAtBlockEnd(blk) {
    const r = getRange();
    if (!r || !r.collapsed) return false;
    const tail = document.createRange();
    try {
      tail.setStart(r.startContainer, r.startOffset);
      tail.setEnd(blk, blk.childNodes.length);
    } catch (err) { return false; }
    let frag;
    // 先看文字：光标后面还有字就肯定不在末尾（避免长段落每次 clone 整个 DOM）
    try { if (tail.toString().replace(/[\s\u00a0\u200b]/g, '')) return false; } catch (err) { return false; }
    try { frag = tail.cloneContents(); } catch (err) { return false; }
    if (frag.querySelector('img,table,hr')) return false;
    return true;
  }
  function splitBlock(blk, tagName) {
    let r = getRange();
    if (!r) return null;
    // 有选区时先删掉选中内容，再从光标处切分
    if (!r.collapsed) { r.deleteContents(); r = getRange() || r; }
    const after = document.createRange();
    after.setStart(r.startContainer, r.startOffset);
    after.setEnd(blk, blk.childNodes.length);
    const frag = after.extractContents();
    const el = document.createElement(tagName || 'p');
    el.appendChild(frag);
    if (!el.textContent && !el.querySelector('img,br,table')) el.innerHTML = '<br>';
    // 原块被切空时必须补回 <br>：否则它会塌成 0 高度，
    // 表现为「在空行里按回车没反应」（只是把唯一那个 <br> 往下挪了一格）
    if (!blk.textContent && !blk.querySelector('img,br,table')) blk.innerHTML = '<br>';
    blk.after(el);
    placeCaret(el, 0);
    if (el.firstChild && el.firstChild.nodeName === 'BR') placeCaret(el, 0);
    return el;
  }
  function splitLi(li) {
    let r = getRange();
    if (!r) return;
    if (!r.collapsed) { r.deleteContents(); r = getRange() || r; }
    const after = document.createRange();
    after.setStart(r.startContainer, r.startOffset);
    after.setEnd(li, li.childNodes.length);
    const frag = after.extractContents();
    const nli = document.createElement('li');
    nli.appendChild(frag);
    if (!nli.textContent && !nli.querySelector('img,br')) nli.innerHTML = '<br>';
    li.after(nli);
    placeCaret(nli, 0);
  }
  // 空列表项退出列表：空行必须是 <ol> 的兄弟节点，不能塞进 <ol> 里，
  // 否则剩下的项会被当成「子列表」（渲染成 (1)(2)），序号也跟着错。
  function exitList(li) {
    const list = li.parentNode;
    // 子级列表不能直接退出：空段落会插进父级 <li> 里（非法结构，内容还会丢），
    // 先升一级，再按一次才退出列表
    if (list && list.closest('li')) { outdentLi(li); return; }
    const p = document.createElement('p');
    p.innerHTML = '<br>';
    const pos = Array.from(list.children).indexOf(li); // 0 基
    const base = parseInt(list.getAttribute('start'), 10) || 1;
    const rest = document.createElement(list.tagName);
    let sib = li.nextElementSibling;
    while (sib) { const nx = sib.nextElementSibling; rest.appendChild(sib); sib = nx; }
    li.remove();
    if (!list.children.length) {
      list.replaceWith(p);
    } else {
      list.after(p);
      if (rest.children.length) {
        // 后面的项另起一个列表，序号接着原来的往下排（不被重置成 1）
        if (rest.tagName === 'OL') {
          const start = base + pos + 1;
          rest.setAttribute('start', String(start));
          // CSS 的 ol1/ol2 计数器不认 start 属性，得直接重置（从 start-1 起，首项自增后正好是 start）
          rest.setAttribute('style', 'counter-reset:ol' + olDepthOf(list) + ' ' + (start - 1));
        }
        p.after(rest);
      }
    }
    placeCaret(p, 0);
  }
  // 该列表在 CSS 计数器里对应 olN 中的第几层（有序祖先的个数，含自身）
  function olDepthOf(el) {
    let d = 0, n = el;
    while (n && n !== ED()) {
      if (n.tagName === 'OL') d++;
      n = n.parentNode;
    }
    return Math.max(1, d);
  }
  function handleEnter(e) {
    let blk = blockOf();
    if (!blk) blk = ensureBlock();
    if (!blk) return false;
    const tag = blk.tagName;
    if (tag === 'PRE' || tag === 'TABLE') return false;
    const li = blk.closest('li');
    if (li) {
      e.preventDefault();
      if (!li.textContent.trim() && !li.querySelector('img,table')) exitList(li);
      else splitLi(li);
      return true;
    }
    if (/^H[1-4]$/.test(tag)) {
      e.preventDefault();
      if (!caretAtBlockEnd(blk)) {
        // 标题中间回车：前半留在标题，后半变成正文段落
        splitBlock(blk, 'p');
        return true;
      }
      const p = document.createElement('p');
      p.innerHTML = '<br>';
      blk.after(p);
      placeCaret(p, 0);
      return true;
    }
    if (blk.parentNode && blk.parentNode.tagName === 'BLOCKQUOTE') {
      e.preventDefault();
      const bq = blk.parentNode;
      if (!blk.textContent.trim()) {
        // 空的引用行 → 跳出引用，接着写正文
        const p = document.createElement('p');
        p.innerHTML = '<br>';
        if (bq.children.length === 1) bq.replaceWith(p);
        else { bq.after(p); blk.remove(); }
        placeCaret(p, 0);
      } else if (!caretAtBlockEnd(blk)) {
        // 引用行中间回车：后半段切到引用内的下一段（不再整段留在原处）
        splitBlock(blk, 'p');
      } else {
        // 引用行末尾回车：引用内新增一行
        const p = document.createElement('p');
        p.innerHTML = '<br>';
        blk.after(p);
        placeCaret(p, 0);
      }
      return true;
    }
    if (tag === 'P' || tag === 'DIV') {
      e.preventDefault();
      splitBlock(blk, 'p');
      return true;
    }
    return false;
  }

  /* --- Tab：列表层级 --- */
  // 把光标放回 li 自身的文本末尾（跳过子列表）
  function caretInLi(li) {
    let target = null;
    Array.from(li.childNodes).forEach(c => {
      if (c.nodeType === 3 && c.textContent.trim()) target = c;
      else if (c.nodeType === 1 && !/^(UL|OL)$/.test(c.tagName)) target = c;
    });
    if (!target) { placeCaret(li, 0); return; }
    if (target.nodeType === 3) placeCaret(target, target.textContent.length);
    else placeCaretEnd(target);
  }
  function indentLi(li) {
    const prev = li.previousElementSibling;
    if (!prev) return false;
    let sub = null;
    Array.from(prev.children).forEach(c => {
      if (/^(UL|OL)$/.test(c.tagName)) sub = c;
    });
    if (!sub) {
      sub = document.createElement(li.parentNode.tagName.toLowerCase());
      prev.appendChild(sub);
    }
    sub.appendChild(li);
    caretInLi(li);
    return true;
  }
  function outdentLi(li) {
    const list = li.parentNode;
    const parentLi = list.closest('li');
    if (!parentLi) return false;
    const rest = document.createElement(list.tagName);
    while (li.nextElementSibling) rest.appendChild(li.nextElementSibling);
    parentLi.after(li);
    if (rest.children.length) li.after(rest);
    if (!list.children.length) list.remove();
    caretInLi(li);
    return true;
  }
  function handleTab(e) {
    const blk = blockOf();
    if (!blk) return false;
    const li = blk.closest('li');
    if (li) {
      return e.shiftKey ? outdentLi(li) : indentLi(li);
    }
    if (e.shiftKey) return false;
    document.execCommand('insertText', false, '\u00a0\u00a0\u00a0\u00a0');
    return true;
  }
  /* --- 删除键：子级序号回到上一级（等价 Shift+Tab），一级空项退出列表 --- */
  // 光标是否在列表项自身文字的最前面（跳过子列表）
  function caretAtLiStart(li) {
    const r = getRange();
    if (!r || !r.collapsed) return false;
    const head = document.createRange();
    try { head.setStart(li, 0); head.setEnd(r.startContainer, r.startOffset); } catch (err) { return false; }
    return !head.toString().replace(/[\s\u00a0\u200b]/g, '');
  }
  function handleDeleteKey(li, key) {
    const list = li.parentNode;
    if (!list || !/^(UL|OL)$/.test(list.tagName)) return false;
    if (!caretAtLiStart(li)) return false;
    const nested = !!list.closest('li');
    const empty = !li.textContent.trim() && !li.querySelector('img,table');
    // 子级（空项或行首）→ 升回上一级，等价 Shift+Tab
    if (nested) return outdentLi(li);
    // 一级列表的空项 → 退出列表变正文
    if (key === 'Backspace' && empty) { exitList(li); return true; }
    return false;
  }

  /* --- Markdown 即时语法：输入 "# " "- " "1. " "> " 自动变格式 --- */
  function replaceBlock(blk, makeEl, caretTarget) {
    const el = makeEl();
    blk.replaceWith(el);
    placeCaret(caretTarget ? caretTarget(el) : el, 0);
    return el;
  }
  function autoFormat() {
    const blk = blockOf();
    if (!blk || blk.tagName === 'PRE') return;
    // 已经在列表项里就不再触发块级转换，避免嵌套列表结构损坏
    if (blk.tagName === 'LI') return;
    const text = blk.textContent;
    let m;
    if ((m = /^(#{1,3})\s$/.exec(text))) {
      replaceBlock(blk, () => {
        const h = document.createElement('h' + m[1].length);
        h.innerHTML = '<br>';
        return h;
      });
      return;
    }
    if (/^[-*+]\s$/.test(text) || /^\d+[.)]\s$/.test(text)) {
      const ordered = /^\d/.test(text);
      replaceBlock(blk, () => {
        const list = document.createElement(ordered ? 'ol' : 'ul');
        const li = document.createElement('li');
        li.innerHTML = '<br>';
        list.appendChild(li);
        return list;
      }, (list) => list.firstChild);
      return;
    }
    if (/^>\s$/.test(text)) {
      replaceBlock(blk, () => {
        const bq = document.createElement('blockquote');
        const p = document.createElement('p');
        p.innerHTML = '<br>';
        bq.appendChild(p);
        return bq;
      }, (bq) => bq.firstChild);
      return;
    }
    if (/^```$/.test(text)) {
      replaceBlock(blk, () => {
        const pre = document.createElement('pre');
        const code = document.createElement('code');
        code.textContent = '\n';
        pre.appendChild(code);
        return pre;
      }, (pre) => pre.firstChild);
      return;
    }
    if (/^(---+|\*\*\*+)$/.test(text)) {
      const hr = document.createElement('hr');
      const p = document.createElement('p');
      p.innerHTML = '<br>';
      blk.replaceWith(hr);
      hr.after(p);
      placeCaret(p, 0);
      return;
    }
  }

  /* --- 格式命令 --- */
  // 把列表项从列表里摘出来变成独立段落，后面的兄弟项保留为新列表
  function detachFromList(li) {
    const list = li.parentNode;
    const p = document.createElement('p');
    p.innerHTML = li.innerHTML || '<br>';
    if (li.nextElementSibling) {
      const rest = document.createElement(list.tagName);
      while (li.nextElementSibling) rest.appendChild(li.nextElementSibling);
      list.after(p);
      p.after(rest);
    } else {
      list.after(p);
    }
    li.remove();
    if (!list.children.length) list.remove();
    return p;
  }
  function setBlockTag(tag) {
    let blk = ensureBlock() || blockOf();
    if (!blk) return;
    const li = blk.closest('li');
    // 在列表里改成标题/正文/引用：先摘出列表，否则会出现 <ul><p> 这种非法结构
    if (li) blk = detachFromList(li);
    const hostList = blk.parentNode && /^(UL|OL)$/.test(blk.parentNode.tagName) ? blk.parentNode : null;
    if (tag === 'blockquote') {
      if (blk.parentNode && blk.parentNode.tagName === 'BLOCKQUOTE') return;
      const bq = document.createElement('blockquote');
      const p = document.createElement('p');
      p.innerHTML = blk.innerHTML || '<br>';

  function toggleList(tag) {

  /* --- 字体颜色 / 高亮（Markdown 里存成行内 HTML） --- */
  const TEXT_COLORS = [

  function applyInlineStyle(makeEl) {

  function insertTagNode() {

  function insertCodeBlock() {

  /* --- 表格：增删行列（光标在表格内时出现浮动工具条） --- */
  let tblCell = null;
  function cellOfRange() {
    const r = getRange();

    let n = r.startContainer;
    if (n.nodeType === 3) n = n.parentNode;

  function updateTableBar() {

    const cell = cellOfRange();

    tblCell = cell;
    bar.classList.remove('hidden');
    const rect = cell.closest('table').getBoundingClientRect();

  function makeEmptyCell(tagName) {

  function tableOp(op) {
    const cell = tblCell || cellOfRange();

    const row = cell.parentNode;
    const colIdx = Array.from(row.children).indexOf(cell);
    const inHead = row.parentNode.tagName === 'THEAD';
    const rows = Array.from(table.querySelectorAll('tr'));
    const maxCols = Math.max(...rows.map(r => r.children.length));
    if (op === 'row-add') {
      const tr = document.createElement('tr');
      for (let i = 0; i < row.children.length; i++) {
        tr.appendChild(makeEmptyCell(inHead ? 'th' : (row.children[i].tagName || 'td').toLowerCase()));
      }
      if (inHead) {
        const body = table.querySelector('tbody') || table.appendChild(document.createElement('tbody'));
        if (body.firstChild) body.insertBefore(tr, body.firstChild);
        else body.appendChild(tr);

        row.after(tr);

      placeCaret(tr.children[Math.min(colIdx, tr.children.length - 1)], 0);
      status('已插入一行');
    } else if (op === 'col-add') {
      rows.forEach(r => {
        const ref = r.children[colIdx];
        const nc = makeEmptyCell(ref && ref.tagName === 'TH' ? 'th' : 'td');
        if (ref) ref.after(nc); else r.appendChild(nc);

      const bodyRows = Array.from(tbody.querySelectorAll('tr'));
