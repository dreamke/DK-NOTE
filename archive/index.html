  /* --- 表格列宽：拖动列边界调整；宽度按百分比写进 colgroup --- */
  const ColResize = {
    MIN: 64,      // 单列最小宽度（px），约可横排两个汉字 + 单元格内边距
    TOL: 4,       // 边界命中范围（px）
    drag: null,

    firstRow(table) { return table.querySelector('thead tr') || table.querySelector('tr'); },
    colCount(table) { const r = this.firstRow(table); return r ? r.children.length : 0; },

    metrics(table) {
      const row = this.firstRow(table);
      if (!row) return null;
      return {
        widths: Array.from(row.children).map(c => c.getBoundingClientRect().width),
        total: table.getBoundingClientRect().width,
      };
    },

    colgroup(table, create) {
      let cg = table.querySelector(':scope > colgroup');
      if (!cg && create) {
        cg = document.createElement('colgroup');
        table.insertBefore(cg, table.firstChild);
      }
      return cg;
    },

    // 按像素宽度写 colgroup（存成百分比，窗口变窄时按比例缩放）
    apply(table, widths) {
      const total = widths.reduce((a, b) => a + b, 0) || 1;
      const cg = this.colgroup(table, true);
      while (cg.children.length < widths.length) cg.appendChild(document.createElement('col'));
      while (cg.children.length > widths.length) cg.lastElementChild.remove();
      widths.forEach((w, i) => {
        cg.children[i].style.width = (w / total * 100).toFixed(2) + '%';
      });
    },

    // 增删列后校正 colgroup：新列取现有平均宽度，其余比例不变
    sync(table, at, mode) {
      const cg = table.querySelector(':scope > colgroup');
      if (!cg) return;
      const n = this.colCount(table);
      if (!n) return;
      let arr = Array.from(cg.children).map(c => parseFloat(c.style.width) || 0);
      const avg = arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length : 100 / n;
      if (mode === 'add') arr.splice(Math.max(0, Math.min(at, arr.length)), 0, avg);
      else if (mode === 'del') arr.splice(Math.max(0, Math.min(at, arr.length - 1)), 1);
      arr = arr.slice(0, n);
      while (arr.length < n) arr.push(100 / n);
      const sum = arr.reduce((a, b) => a + b, 0) || 1;
      while (cg.children.length < n) cg.appendChild(document.createElement('col'));
      while (cg.children.length > n) cg.lastElementChild.remove();
      arr.forEach((w, i) => { cg.children[i].style.width = (w / sum * 100).toFixed(2) + '%'; });
    },

    reset(table) {
      const cg = table.querySelector(':scope > colgroup');
      if (cg) cg.remove();
    },

    // 光标是否压在某个列边界上 → 返回该边界左侧的列索引
    hit(e) {
      // 用鼠标所在的那个编辑器判断（双栏时不一定等于活动窗格）
      const ed = e.target && e.target.closest ? e.target.closest('.editor') : null;
      if (!ed || !e.target || !ed.contains(e.target)) return null;
      const cell = e.target.closest && e.target.closest('td,th');
      if (!cell) return null;
      const table = cell.closest('table');
      if (!table) return null;
      const row = cell.parentNode;
      const idx = Array.from(row.children).indexOf(cell);
      const r = cell.getBoundingClientRect();
      if (Math.abs(e.clientX - r.right) <= this.TOL && idx < row.children.length - 1) {
        return { table, colIdx: idx };
      }
      if (Math.abs(e.clientX - r.left) <= this.TOL && idx > 0) {
        return { table, colIdx: idx - 1 };
      }
      return null;
    },

    showGuide(x, table) {
      const g = $('col-guide');
      if (!g) return;
      const r = table.getBoundingClientRect();
      g.style.left = Math.round(x) + 'px';
      g.style.top = r.top + 'px';
      g.style.height = r.height + 'px';
      g.classList.add('on');
    },
    hideGuide() {
      const g = $('col-guide');
      if (g) g.classList.remove('on');
    },

    hover(e) {
      const hit = this.hit(e);
      const ed = e.target && e.target.closest ? e.target.closest('.editor') : null;
      if (ed) ed.style.cursor = hit ? 'col-resize' : '';
      if (hit) this.showGuide(e.clientX, hit.table);
      else this.hideGuide();
      return hit;
    },

    start(e, hit) {
      const m = this.metrics(hit.table);
      if (!m || m.widths.length < 2) return;
      this.drag = { table: hit.table, colIdx: hit.colIdx, startX: e.clientX, widths: m.widths.slice() };
      document.body.classList.add('col-dragging');
      this.showGuide(e.clientX, hit.table);
      $('tbl-bar').classList.add('hidden');
      e.preventDefault();
    },

    move(e) {
      const d = this.drag;
      if (!d) return;
      if (!d.table.isConnected) { this.end(); return; }
      const i = d.colIdx;
      const pair = d.widths[i] + d.widths[i + 1];
      let left = d.widths[i] + (e.clientX - d.startX);
      // 两列合计不变，各自不小于 MIN；合计太窄时对半
      left = pair < this.MIN * 2 ? pair / 2 : Math.max(this.MIN, Math.min(pair - this.MIN, left));
      const arr = d.widths.slice();
      arr[i] = left;
      arr[i + 1] = pair - left;
      this.apply(d.table, arr);
      this.showGuide(e.clientX, d.table);
    },

    end() {
      if (!this.drag) return;
      const table = this.drag.table;
      this.drag = null;
      document.body.classList.remove('col-dragging');
      this.hideGuide();
      if (!table || !table.isConnected) return;
      markDirty();
      updateTableBar();
      status('已调整列宽（双击列边界可恢复等宽）');
    },

    bind(p) {
      const ed = p.el.editor;
      if (!ed) return;
      ed.addEventListener('mousemove', (e) => { if (!this.drag) this.hover(e); });
      ed.addEventListener('mouseleave', () => {
        if (this.drag) return;
        ed.style.cursor = '';
        this.hideGuide();
      });
      ed.addEventListener('mousedown', (e) => {
        const hit = this.hit(e);
        if (hit) this.start(e, hit);
      });
      // 双击列边界：恢复整表等分
      ed.addEventListener('dblclick', (e) => {
        const hit = this.hit(e);
        if (!hit) return;
        e.preventDefault();
        this.reset(hit.table);
        markDirty();
        status('已恢复等宽列');
      });
      if (this._glob) return;      // 文档级监听只挂一次（双栏会 bind 两次）
      this._glob = true;
      document.addEventListener('mousemove', (e) => { if (this.drag) this.move(e); });
      document.addEventListener('mouseup', () => { if (this.drag) this.end(); });
      // 拖到窗口外松手时收尾，避免状态卡在拖拽中
      window.addEventListener('blur', () => { if (this.drag) this.end(); });
    },
  };

  /* ---------------- 格式化工具 ---------------- */
  // 点工具栏时保住编辑器里的选区；没有选区就把光标放到末尾
  function caretToLastBlock(p) {
    p = p || curPane();
    const el = ED(p);
    let last = el.lastElementChild;
    if (!last) { setMd(getMd(p), p); last = el.lastElementChild; }
    if (/^(UL|OL)$/.test(last.tagName)) last = last.lastElementChild || last;
    if (/^(LI|BLOCKQUOTE)$/.test(last.tagName)) last = last.lastElementChild || last;
    placeCaretEnd(last || el);
    return last;
  }
  function focusEditable(p) {
    p = p || curPane();
    const el = ED(p);
    el.focus();
    if (getRange(p)) return;
    caretToLastBlock(p);
  }
  function applyFmt(fmt, p) {
    p = p || curPane();
    if (p.key !== ACTIVE) setActive(p.key);
    focusEditable(p);
    if (fmt === 'h1') setBlockTag('h1');
    else if (fmt === 'h2') setBlockTag('h2');
    else if (fmt === 'h3') setBlockTag('h3');
    else if (fmt === 'p') setBlockTag('p');
    else if (fmt === 'ul') toggleList('ul');
    else if (fmt === 'ol') toggleList('ol');
    else if (fmt === 'quote') setBlockTag('blockquote');
    else if (fmt === 'bold') wrapInline('strong');
    else if (fmt === 'italic') wrapInline('em');
    else if (fmt === 'strike') wrapInline('del');
    else if (fmt === 'code') wrapInline('code');
    else if (fmt === 'color') togglePalette();
    else if (fmt === 'mark') applyMark();
    else if (fmt === 'link') insertLink();
    else if (fmt === 'wiki') insertWiki();
    else if (fmt === 'tag') insertTagNode();
    else if (fmt === 'codeblock') insertCodeBlock();
    else if (fmt === 'table') insertTable();
    ED(p).focus();
    updatePlaceholder(p);
    markDirty(p);
  }

  /* ---------------- 导入 / 导出 ---------------- */
  function triggerDownload(blob, filename) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  }
  function downloadNote(note) {
    const blob = new Blob([note.content || ''], { type: 'text/markdown;charset=utf-8' });
    triggerDownload(blob, /\.md$/i.test(note.name) ? note.name : note.name + '.md');
  }

  /* ---- ZIP：零依赖打包 / 解包（支持 deflate-raw 就压缩，否则原样存储） ---- */
  const CRC_TABLE = (() => {
    const t = new Uint32Array(256);
    for (let i = 0; i < 256; i++) {
      let c = i;
      for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      t[i] = c >>> 0;
    }
    return t;
  })();
  function crc32(u8) {
    let c = 0xFFFFFFFF;
    for (let i = 0; i < u8.length; i++) c = CRC_TABLE[(c ^ u8[i]) & 0xFF] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  }
  async function deflateRaw(u8) {
    if (typeof CompressionStream === 'undefined') return null;
    try {
      const cs = new CompressionStream('deflate-raw');
      const w = cs.writable.getWriter();
      w.write(u8); w.close();
      const out = new Uint8Array(await new Response(cs.readable).arrayBuffer());
      return out.length < u8.length ? out : null;   // 压不小就存原样
    } catch { return null; }
  }
  async function inflateRaw(u8) {
    if (typeof DecompressionStream === 'undefined') {
      throw new Error('当前浏览器不支持解压，请用 Chrome / Edge 打开');
    }
    const ds = new DecompressionStream('deflate-raw');
    const w = ds.writable.getWriter();
    w.write(u8); w.close();
    return new Uint8Array(await new Response(ds.readable).arrayBuffer());
  }
  function dosDateTime(d) {
    return {
      time: (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1),
      date: ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate(),
    };
  }
  async function makeZip(items) {           // items: [{ name, text }]
    const enc = new TextEncoder();
    const { time, date } = dosDateTime(new Date());
    const parts = [], central = [];
    let offset = 0;
    for (const it of items) {
      const nameBytes = enc.encode(it.name);
      const raw = enc.encode(it.text);
      const crc = crc32(raw);
      const def = await deflateRaw(raw);
      const data = def || raw;
      const method = def ? 8 : 0;

      const lh = new Uint8Array(30 + nameBytes.length);
      const lv = new DataView(lh.buffer);
      lv.setUint32(0, 0x04034b50, true);
      lv.setUint16(4, 20, true);
      lv.setUint16(6, 0x0800, true);        // bit 11：文件名 UTF-8
      lv.setUint16(8, method, true);
      lv.setUint16(10, time, true);
      lv.setUint16(12, date, true);
      lv.setUint32(14, crc, true);
      lv.setUint32(18, data.length, true);
      lv.setUint32(22, raw.length, true);
      lv.setUint16(26, nameBytes.length, true);
      lv.setUint16(28, 0, true);
      lh.set(nameBytes, 30);
      parts.push(lh, data);

      const ch = new Uint8Array(46 + nameBytes.length);
      const cv = new DataView(ch.buffer);
      cv.setUint32(0, 0x02014b50, true);
      cv.setUint16(4, 20, true);
      cv.setUint16(6, 20, true);
      cv.setUint16(8, 0x0800, true);
      cv.setUint16(10, method, true);
      cv.setUint16(12, time, true);
      cv.setUint16(14, date, true);
      cv.setUint32(16, crc, true);
      cv.setUint32(20, data.length, true);
      cv.setUint32(24, raw.length, true);
      cv.setUint16(28, nameBytes.length, true);
      cv.setUint16(30, 0, true);
      cv.setUint16(32, 0, true);
      cv.setUint16(34, 0, true);
      cv.setUint16(36, 0, true);
      cv.setUint32(38, 0, true);
      cv.setUint32(42, offset, true);
      ch.set(nameBytes, 46);
      central.push(ch);

      offset += lh.length + data.length;
    }
    const cdSize = central.reduce((a, b) => a + b.length, 0);
    const eocd = new Uint8Array(22);
    const ev = new DataView(eocd.buffer);
    ev.setUint32(0, 0x06054b50, true);
    ev.setUint16(8, items.length, true);
    ev.setUint16(10, items.length, true);
    ev.setUint32(12, cdSize, true);
    ev.setUint32(16, offset, true);
    return new Blob(parts.concat(central, [eocd]), { type: 'application/zip' });
  }
  async function readZip(arrayBuffer) {
    const u8 = new Uint8Array(arrayBuffer);
    const dv = new DataView(arrayBuffer);
    if (u8.length < 22) throw new Error('不是有效的 zip 文件');
    let eocd = -1;
    const minPos = Math.max(0, u8.length - 65557);
    for (let i = u8.length - 22; i >= minPos; i--) {
      if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
    }
    if (eocd < 0) throw new Error('不是有效的 zip 文件（找不到目录结构）');
    const count = dv.getUint16(eocd + 10, true);
    let p = dv.getUint32(eocd + 16, true);
    const dec = new TextDecoder('utf-8');
    const out = [];
    for (let i = 0; i < count; i++) {
      if (dv.getUint32(p, true) !== 0x02014b50) throw new Error('zip 目录损坏，无法读取');
      const method = dv.getUint16(p + 10, true);
      const compSize = dv.getUint32(p + 20, true);
      const nameLen = dv.getUint16(p + 28, true);
      const extraLen = dv.getUint16(p + 30, true);
      const cmtLen = dv.getUint16(p + 32, true);
      const lho = dv.getUint32(p + 42, true);
      const name = dec.decode(u8.subarray(p + 46, p + 46 + nameLen));
      const lNameLen = dv.getUint16(lho + 26, true);
      const lExtraLen = dv.getUint16(lho + 28, true);
      const start = lho + 30 + lNameLen + lExtraLen;
      const data = u8.subarray(start, start + compSize);
      out.push({
        name,
        load: () => (method === 0 ? Promise.resolve(data) : inflateRaw(data)),
      });
      p += 46 + nameLen + extraLen + cmtLen;
    }
    return out;
  }

  function stampNow() {
    const d = new Date();
    const p = (n) => String(n).padStart(2, '0');
    return '' + d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) +
      '-' + p(d.getHours()) + p(d.getMinutes()) + p(d.getSeconds());
  }
  async function zipAllNotes() {          // → { blob, filename, count }
    const notes = (await Store.allNotes()).filter(n => !isBlankJournal(n));
    if (!notes.length) throw new Error('还没有可导出的笔记');
    const items = notes.map(n => ({
      name: /\.md$/i.test(n.name) ? n.name : n.name + '.md',
      text: n.content || '',
    })).sort((a, b) => a.name.localeCompare(b.name, 'zh'));
    return {
      blob: await makeZip(items),
      filename: 'DK-NOTE-' + stampNow() + '.zip',
      count: items.length,
    };
  }
  async function exportAll() {
    try {
      const { blob, filename, count } = await zipAllNotes();
      triggerDownload(blob, filename);
      status('已导出 ' + count + ' 篇笔记：' + filename);
    } catch (e) {
      alert('导出失败：' + (e.message || e));
    }
  }
  async function importFromFiles(files) {
    const decode = (bytes) => {
      let t = new TextDecoder('utf-8').decode(bytes);
      if (t.charCodeAt(0) === 0xFEFF) t = t.slice(1);   // 去掉 UTF-8 BOM（Windows 记事本/PS 会写）
      return t;
    };
    let entries = [];
    for (const f of files) {
      if (/\.zip$/i.test(f.name)) {
        const items = await readZip(await f.arrayBuffer());
        for (const it of items) {
          // Windows 的压缩工具会写反斜杠作路径分隔，两种都认
          const base = (it.name.split(/[\\/]/).pop() || '').trim();
          if (!/\.md$/i.test(base)) continue;
          if (/^__MACOSX[\\/]/.test(it.name) || /^\._/.test(base)) continue;
          entries.push({ name: base, content: decode(await it.load()) });
        }
      } else if (/\.(md|markdown)$/i.test(f.name)) {
        entries.push({ name: f.name.replace(/\.markdown$/i, '.md'), content: await f.text() });
      }
    }
    // 同名只留最后一份
    const map = new Map();
    entries.forEach(e => map.set(e.name, e.content));
    entries = Array.from(map, ([name, content]) => ({ name, content }));
    if (!entries.length) {
      alert('没有找到可导入的 .md 笔记');
      return;
    }
    const existing = await Store.allNotes();
    const byName = new Map(existing.map(n => [n.name, n]));
    const over = entries.filter(e => byName.has(e.name)).length;
    if (!confirm('将导入 ' + entries.length + ' 篇笔记' +
      (over ? '，其中 ' + over + ' 篇与现有笔记同名，会被导入内容覆盖' : '') +
      '。\n\n确定继续？')) return;

    for (const e of entries) {
      const old = byName.get(e.name);
      await Store.put({ name: e.name, content: e.content, favorite: old ? !!old.favorite : false });
    }
    await refreshAll();
    status('已导入 ' + entries.length + ' 篇笔记');
  }

  /* ---------------- WebDAV ---------------- */
  function davClient() {
    const cfg = S.dav;
    const auth = cfg.user || cfg.pass
      ? 'Basic ' + btoa(unescape(encodeURIComponent(cfg.user + ':' + cfg.pass)))
      : null;
    const headers = (extra) => Object.assign(auth ? { Authorization: auth } : {}, extra || {});
    const join = (name) => cfg.url.replace(/\/+$/, '/') + encodeURIComponent(name);
    return {
      valid: /^https?:\/\//.test(cfg.url),
      async test() {
        const r = await fetch(cfg.url, { method: 'PROPFIND', headers: headers({ Depth: '0' }) });
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return true;
      },
      async mkcol() {
        const r = await fetch(cfg.url, { method: 'MKCOL', headers: headers() });
        if (!r.ok && r.status !== 405 && r.status !== 301) throw new Error('MKCOL HTTP ' + r.status);
      },
      async list() {
        const r = await fetch(cfg.url, {
          method: 'PROPFIND',
          headers: headers({ Depth: '1', 'Content-Type': 'application/xml' }),
          body: '<?xml version="1.0" encoding="utf-8"?><d:propfind xmlns:d="DAV:"><d:prop>' +
            '<d:displayname/><d:getcontentlength/><d:getlastmodified/><d:resourcetype/></d:prop></d:propfind>',
        });
        if (!r.ok) throw new Error('PROPFIND HTTP ' + r.status);
        const xml = await r.text();
        const doc = new DOMParser().parseFromString(xml, 'application/xml');
        const out = [];
        Array.from(doc.getElementsByTagNameNS('DAV:', 'response')).forEach(resp => {
          const rt = resp.getElementsByTagNameNS('DAV:', 'resourcetype')[0];
          if (rt && rt.getElementsByTagNameNS('DAV:', 'collection').length) return;
          const href = (resp.getElementsByTagNameNS('DAV:', 'href')[0] || {}).textContent || '';
          const name = decodeURIComponent(href.split('/').filter(Boolean).pop() || '');
          if (!/\.md$/i.test(name)) return;
          const len = resp.getElementsByTagNameNS('DAV:', 'getcontentlength')[0];
          const mod = resp.getElementsByTagNameNS('DAV:', 'getlastmodified')[0];
          out.push({
            name: name,
            size: len ? +len.textContent : 0,
            lastModified: mod ? new Date(mod.textContent).getTime() : 0,
          });
        });
        return out;
      },
      async get(name) {
        const r = await fetch(join(name), { headers: headers() });
        if (!r.ok) throw new Error('GET ' + name + ' HTTP ' + r.status);
        return r.text();
      },
      async put(name, content) {
        const r = await fetch(join(name), {
          method: 'PUT',
          headers: headers({ 'Content-Type': 'text/markdown; charset=utf-8' }),
          body: content,
        });
        if (!r.ok) throw new Error('PUT ' + name + ' HTTP ' + r.status);
      },
    };
  }

  async function davPutOne(note) {
    const dav = davClient();

    await dav.mkcol();
    await dav.put(note.name, note.content || '');
    setSyncStatus('已上传 ' + note.name);
  }

  /* ---------------- 快捷键 ---------------- */
  function bindKeys() {
    document.addEventListener('keydown', (e) => {
      const meta = e.ctrlKey || e.metaKey;
      // 双栏时 Ctrl+S 把两边都存一遍，避免右栏内容还挂在定时器上
      if (meta && e.key.toLowerCase() === 's') {
        e.preventDefault();
        saveCurrent(true, curPane());
        if (PANES.b) saveCurrent(false, PANES.b);
      }
      if (meta && e.key.toLowerCase() === 'e') {
        e.preventDefault();
        S.view = S.view === 'edit' ? 'preview' : 'edit';
        S.split = false; applyView();
      }
      // Ctrl+Shift+D：双栏（连续两天）
      if (meta && e.shiftKey && e.key.toLowerCase() === 'd') {
        e.preventDefault();
        setDaySplit(!S.daySplit);
        return;
      }
      if (meta && !e.shiftKey && e.key.toLowerCase() === 'n') { e.preventDefault(); openJournal(new Date()); }
      // 对齐 Orca：Ctrl+O 把选中文字转成标签
      if (meta && e.key.toLowerCase() === 'o') { e.preventDefault(); applyFmt('tag'); }
      // 撤回 / 重做（统一走快照栈，避免浏览器原生撤销和块操作打架）
      // 源码框和标题框里保留浏览器原生撤销，否则会把焦点弹回正文
      const ae = document.activeElement;
      const inField = ae && (ae.classList.contains('src-view') || ae.classList.contains('doc-title'));
      if (meta && e.key.toLowerCase() === 'z') {
        if (inField) return;
        e.preventDefault();
        const u = curPane().undo;
        if (e.shiftKey) u.redo(); else u.undo();
      }
      if (meta && e.key.toLowerCase() === 'y') {
        if (inField) return;
        e.preventDefault();
        curPane().undo.redo();
      }
    });
  }

  function bindPane(p) {
    const ed = p.el.editor;

    // 谁被点击 / 聚焦，谁就是活动窗格（capture 保证先于工具栏自己的监听）
    p.root.addEventListener('mousedown', () => setActive(p.key), true);
    p.root.addEventListener('focusin', () => setActive(p.key));

    // 编辑器：所见即所得（底层仍写 Markdown）
    ed.addEventListener('input', (e) => {
      if (e.isComposing) { markDirty(p); return; }
      autoFormat();
      markDirty(p);
    });
    ed.addEventListener('keydown', (e) => {
      if (e.isComposing) return;
      if (e.key === 'Enter' && !e.shiftKey && !e.ctrlKey && !e.metaKey) {
        if (handleEnter(e)) { markDirty(p); }
        return;
      }
      if (e.key === 'Tab') {
        if (handleTab(e)) { e.preventDefault(); markDirty(p); }
        return;
      }
      if (e.key === 'Backspace' || e.key === 'Delete') {
        const blk = blockOf();
        const li = blk && blk.closest && blk.closest('li');
        if (li && handleDeleteKey(li, e.key)) { e.preventDefault(); markDirty(p); }
      }
    });
    ed.addEventListener('paste', (e) => {
      const dt = e.clipboardData || window.clipboardData;
      if (!dt) return;
      const text = dt.getData('text/plain') || '';
      const htmlRaw = dt.getData('text/html') || '';
      const blk = blockOf();

      // 代码块里粘贴：保持纯文本，别把代码变成排版
      if (blk && blk.tagName === 'PRE') {
        if (!text) return;
        e.preventDefault();
        document.execCommand('insertText', false, text);
        markDirty(p);
        return;
      }

      const holder = htmlRaw ? pasteHtmlToNodes(htmlRaw) : null;
      const FMT = 'ul,ol,table,pre,blockquote,h1,h2,h3,h4,h5,h6,hr,strong,b,em,i,del,s,strike,code,mark,a,img';
      const hasFmt = !!(holder && holder.querySelector(FMT));
      const mdLike = /(^|\n)(#{1,6}\s|[-*+]\s|\d+[.)]\s|>\s|```|\|)/.test(text);

      // 富文本优先：别的编辑器复制过来的粗体、多级列表、表格都在这儿保住
      if (holder && hasFmt) {
        e.preventDefault();
        document.execCommand('insertHTML', false, holder.innerHTML || '<br>');
        liftNestedBlocks(ed);
        tidyAfterPaste(ed);
        ensureBlock();
        markDirty(p);
        return;
      }
      if (!text) {
        // 只有 HTML 没有纯文本（罕见）：结构简单就直接插，否则放弃
        if (holder && holder.innerHTML.trim()) {
          e.preventDefault();
          document.execCommand('insertHTML', false, holder.innerHTML);
          liftNestedBlocks(ed);
          tidyAfterPaste(ed);
          ensureBlock();
          markDirty(p);
        }
        return;
      }
      e.preventDefault();
      if (mdLike) {
        // 纯文本但写着 Markdown 语法 → 渲染成排版
        document.execCommand('insertHTML', false, renderMd(text));
        liftNestedBlocks(ed);
        tidyAfterPaste(ed);
        ensureBlock();
      } else {
        document.execCommand('insertText', false, text);
      }
      markDirty(p);
    });
    // 编辑态里点双链 / 标签
    ed.addEventListener('click', async (e) => {
      const tagEl = e.target.closest('[data-tag]');
      if (tagEl) {
        e.preventDefault();
        const t = tagEl.dataset.tag;
        document.querySelector('.seg-item[data-tab="tags"]').click();
        filterByTag(t);
        status('筛选 #' + t);
        return;
      }
      const a = e.target.closest('[data-wiki]');
      if (!a) return;
      e.preventDefault();
      const name = a.dataset.wiki;
      let note = await Store.byName(name + '.md');
      if (!note) {
        note = await Store.put({ name: name + '.md', content: '', favorite: false });
        await refreshAll();
      }
      await openNote(note, true, true, p);
    });
    ed.addEventListener('blur', () => renderSource(p));
    // 点编辑器空白区：光标落到最后一个块，而不是编辑器根
    ed.addEventListener('mousedown', (e) => {
      if (e.target === ed) {
        e.preventDefault();
        ed.focus();
        caretToLastBlock(p);
      }
    });

    // 源码视图（可直接编辑，改完回写富文本）
    p.el.src.addEventListener('input', () => {
      ed.innerHTML = renderMd(p.el.src.value);
      updatePlaceholder(p);
      markDirty(p);
    });

    p.el.title.addEventListener('input', () => markDirty(p));
    // 日期翻页：前后一天
    p.el.prevDay.addEventListener('click', () => stepDay(-1, p));
    p.el.nextDay.addEventListener('click', () => stepDay(1, p));

    p.el.toolbar.addEventListener('mousedown', (e) => {
      // 保住编辑器选区，避免点按钮后光标丢失
      if (e.target.closest('button[data-fmt], .tb-act, .tb-palette')) e.preventDefault();
    });
    p.el.toolbar.addEventListener('click', (e) => {
      const b = e.target.closest('button[data-fmt]');
      if (b) applyFmt(b.dataset.fmt, p);
    });
    // 撤回 / 重做（本窗格）
    p.el.undo.addEventListener('click', () => p.undo.undo());
    p.el.redo.addEventListener('click', () => p.undo.redo());
    // 色板：选颜色 / 恢复默认
    p.el.palette.addEventListener('click', (e) => {
      const sw = e.target.closest('.tb-swatch');
      if (sw) applyColor(sw.dataset.color || '');
    });

    // 标签输入（聚焦/输入时给出标签池建议，点一下才加到本篇）
    const dtInput = p.el.tagInput;
    dtInput.addEventListener('focus', () => showTagSuggest(p));
    dtInput.addEventListener('input', () => showTagSuggest(p));
    dtInput.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowDown') { e.preventDefault(); showTagSuggest(p); moveTagSug(1, p); return; }
      if (e.key === 'ArrowUp') { e.preventDefault(); moveTagSug(-1, p); return; }
      if (e.key === 'Escape') { hideTagSuggest(p); return; }
      if (e.key === 'Enter' || e.key === ',' || e.key === '，') {
        e.preventDefault();
        if (tagSugIdx >= 0 && tagSugList[tagSugIdx]) { pickTag(tagSugList[tagSugIdx].name, p); return; }
        addTag(dtInput.value, p);
        dtInput.value = '';
        hideTagSuggest(p);
      } else if (e.key === 'Backspace' && !dtInput.value) {
        const tags = extractTags(getMd(p));
        if (tags.length) removeTag(tags[tags.length - 1], p);
      }
    });
    dtInput.addEventListener('blur', () => {
      setTimeout(() => {
        if (dtInput.value.trim()) { addTag(dtInput.value, p); dtInput.value = ''; }
        hideTagSuggest(p);
      }, 130);
    });

    // 表格
    ed.addEventListener('click', refreshTableBar);
    ed.addEventListener('keyup', refreshTableBar);
    p.el.editPane.addEventListener('scroll', updateTableBar);
    ColResize.bind(p);
    buildPalette(p);
  }

  // 侧栏：宽屏常驻；窄屏当抽屉用，打开时给内容区盖一层遮罩
  function setSidebar(open) {
    const sb = $('sidebar'), btn = $('btn-open-sidebar'), mask = $('side-mask');
    if (!sb) return;
    sb.classList.toggle('collapsed', !open);
    if (btn) btn.classList.toggle('hidden', open);
    if (mask) mask.classList.toggle('show', !!open && isNarrow());
  }
  function bindUI() {
    // 侧栏
    $('btn-collapse').addEventListener('click', () => setSidebar(false));
    $('btn-open-sidebar').addEventListener('click', () => setSidebar(true));
    $('side-mask').addEventListener('click', () => setSidebar(false));
    // 窄屏启动时先收起，把正文宽度让出来
    if (isNarrow()) setSidebar(false);
    let wasNarrow = isNarrow();
    window.addEventListener('resize', () => {
      const now = isNarrow();
      if (now === wasNarrow) return;
      wasNarrow = now;
      setSidebar(!now);
    });

    // 日历
    $('cal-prev').addEventListener('click', () => {
      S.calView = new Date(S.calView.getFullYear(), S.calView.getMonth() - 1, 1);
      renderCalendar();
    });
    $('cal-next').addEventListener('click', () => {
      S.calView = new Date(S.calView.getFullYear(), S.calView.getMonth() + 1, 1);
      renderCalendar();
    });
    $('cal-today').addEventListener('click', () => {
      const now = new Date();
      S.calView = new Date(now.getFullYear(), now.getMonth(), 1);
      S.calSel = now;
      renderCalendar();
      openJournal(now);
    });

    // 页签：收藏 / 标签（都没有选中 = 全部）
    document.querySelectorAll('.seg-item').forEach(btn => {
      btn.addEventListener('click', () => {
        const tab = btn.dataset.tab;
        const turnOn = !btn.classList.contains('selected');
        document.querySelectorAll('.seg-item').forEach(b => b.classList.remove('selected'));
        if (!turnOn) {               // 再点一次取消 → 回到全部笔记
          S.tab = 'notes';
          $('tag-list').classList.add('hidden');
          $('note-list').classList.remove('hidden');
          renderNotes();
          return;
        }
        btn.classList.add('selected');
        if (tab === 'tags') {
          $('note-list').classList.add('hidden');
          $('filter-bar').classList.add('hidden');
          $('tag-list').classList.remove('hidden');
          return;
        }
        S.tab = tab;                 // fav
        S.tagFilter = '';            // 切页签清掉标签筛选
        $('tag-list').classList.add('hidden');
        $('note-list').classList.remove('hidden');
        renderNotes();
      });
    });

    // 清除筛选 / 搜索
    $('filter-clear').addEventListener('click', () => {
      S.tagFilter = '';
      if (S.search) { S.search = ''; $('search').value = ''; }
      renderNotes();
    });

    // 搜索：标题、日记中文日期、正文（去 Markdown 标记）一起匹配，空格分词
    $('search').addEventListener('input', (e) => { S.search = e.target.value; renderNotes(); });
    $('search').addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        e.preventDefault();
        S.search = ''; e.target.value = ''; e.target.blur(); renderNotes();
      } else if (e.key === 'Enter') {
        // 回车直接打开第一条结果
        e.preventDefault();
        const first = document.querySelector('#note-list .note-item');
        if (first) first.click();
      }
    });

    // 表格浮动工具条（文档级）
    $('tbl-bar').addEventListener('mousedown', (e) => { e.preventDefault(); });
    $('tbl-bar').addEventListener('click', (e) => {
      const b = e.target.closest('button[data-tbl]');
      if (b) tableOp(b.dataset.tbl);
    });
    document.addEventListener('selectionchange', refreshTableBar);
    window.addEventListener('resize', updateTableBar);

    // 点空白处收起色板 / 标签建议
    document.addEventListener('click', (e) => {
      ['a', 'b'].forEach(k => {
        const p = PANES[k];
        if (!p) return;
        if (!e.target.closest('.tb-color-wrap')) hidePalette(p);
        if (!e.target.closest('.doc-tags')) hideTagSuggest(p);
      });
    });

    // 顶部按钮
    $('btn-view').addEventListener('click', () => {
      S.view = S.view === 'edit' ? 'preview' : 'edit';
      S.split = false; applyView();
    });
    $('btn-day-split').addEventListener('click', () => setDaySplit(!S.daySplit));
    $('btn-save').addEventListener('click', () => saveCurrent(true));
    $('btn-settings-side').addEventListener('click', openSettings);
    $('btn-theme').addEventListener('click', async () => {
      document.body.classList.toggle('dark');
      await Store.setSetting('dark', document.body.classList.contains('dark'));
    });
    // 字体可能异步就绪，就绪后重算一次标题宽度
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(() => {
        ['a', 'b'].forEach(k => {
          const p = PANES[k];
          const jd = p && currentJournalDate(p);
          if (jd) fitDatedTitle(jd, p);
        });
      });
    }

    // 导入 / 恢复（入口在设置里）：支持 .zip 备份包，也支持零散的 .md
    $('btn-import-settings').addEventListener('click', () => $('file-import').click());
    $('file-import').addEventListener('change', async (e) => {
      const files = Array.from(e.target.files || []);
      e.target.value = '';
      if (!files.length) return;
      try {
        await importFromFiles(files);
      } catch (err) {
        alert('导入失败：' + (err.message || err));
      }
    });

    // 底部引用面板（只有「引用方」一项，不再有页签切换）
    function toggleBp() {
      const panel = $('bottom-panel');
      S.bpOpen = !S.bpOpen;
      panel.classList.toggle('collapsed', !S.bpOpen);
      if (S.bpOpen) renderBottomPanel();
    }
    $('btn-bp-toggle').addEventListener('click', toggleBp);
    $('bp-summary').addEventListener('click', toggleBp);

    // 设置弹窗
    $('btn-close-settings').addEventListener('click', closeSettings);
    $('modal-settings').addEventListener('click', (e) => {
      if (e.target === $('modal-settings')) closeSettings();
    });
    ['set-dav-url', 'set-dav-user', 'set-dav-pass', 'set-dav-auto'].forEach(id => {
      $(id).addEventListener('change', saveDavCfg);
    });
    $('set-split').addEventListener('change', async () => {
      S.split = $('set-split').checked;
      await Store.setSetting('split', S.split);
      applyView();
    });
    $('set-monday').addEventListener('change', async () => {
      S.firstMonday = $('set-monday').checked;
      await Store.setSetting('firstMonday', S.firstMonday);
      renderCalendar();
    });

    $('btn-dav-test').addEventListener('click', async () => {
      await saveDavCfg();
      const dav = davClient();
      if (!dav.valid) return davStatus('请先填写有效的服务器地址', 'err');
      davStatus('连接中…');
      try { await dav.test(); davStatus('连接成功 ✓', 'ok'); }
      catch (e) { davStatus('连接失败：' + e.message, 'err'); }
    });

    $('btn-dav-up').addEventListener('click', async () => {
      await saveDavCfg();
      const dav = davClient();
      if (!dav.valid) return davStatus('请先填写有效的服务器地址', 'err');
      davStatus('上传中…');
      try {
        await dav.mkcol();
        const notes = (await Store.allNotes()).filter(n => !isBlankJournal(n));
        for (const n of notes) await dav.put(n.name, n.content || '');
        davStatus('已上传 ' + notes.length + ' 个笔记 ✓', 'ok');
        setSyncStatus('WebDAV 已上传 ' + notes.length + ' 篇');
      } catch (e) { davStatus('上传失败：' + e.message, 'err'); }
    });

    $('btn-dav-down').addEventListener('click', async () => {
      await saveDavCfg();
      const dav = davClient();
      if (!dav.valid) return davStatus('请先填写有效的服务器地址', 'err');
      davStatus('下载中…');
      try {
        const remote = await dav.list();
        let n = 0;
        for (const item of remote) {
          const local = await Store.byName(item.name);
          if (!local || (item.lastModified && item.lastModified > (local.updatedAt || 0))) {
            const content = await dav.get(item.name);
            await Store.put({ id: local ? local.id : undefined, name: item.name, content: content, favorite: local ? local.favorite : false });
            n++;
          }
        }
        await refreshAll();
        davStatus('合并完成：更新 ' + n + ' 篇 / 远端 ' + remote.length + ' 篇 ✓', 'ok');
        setSyncStatus('WebDAV 已拉取 ' + n + ' 篇');
      } catch (e) { davStatus('下载失败：' + e.message, 'err'); }
    });

    $('btn-export-settings').addEventListener('click', exportAll);

    $('btn-clear').addEventListener('click', async () => {
      if (!confirm('确定清空全部本地笔记？此操作不可恢复。\n\n建议先用「导出备份 (.zip)」留一份。')) return;
      await Store.clear();
      S.current = null;
      await refreshAll();
      await openJournal(new Date());
      status('本地数据已清空');
    });

    bindKeys();
  }

  /* ---------------- 启动 ---------------- */
  // 自动化测试 / 调试钩子
  window.__orca = {
    getMd: (k) => getMd(k ? PANES[k] : undefined),
    setMd: (md, k) => setMd(md, k ? PANES[k] : undefined),
    renderMd, htmlToMd, applyFmt,
    el: (k) => ED(k ? PANES[k] : undefined),
    focus: (k) => ED(k ? PANES[k] : undefined).focus(),
    undo: () => curPane().undo.undo(),
    redo: () => curPane().undo.redo(),
    undoSnap: () => curPane().undo.snap(),
    undoState: () => ({ idx: curPane().undo.idx, len: curPane().undo.stack.length }),
    tagPool: () => tagPool(),
    store: Store,
    refresh: () => refreshAll(),
    state: () => S,
    tableOp,
    zipAllNotes,
    readZip,
    importFromFiles,
    exportAll,
    // 双栏相关
    panes: () => PANES,
    active: () => ACTIVE,
    setDaySplit,
    openJournal,
    openNote,
  };

  async function boot() {
    // 1) 先同步渲染日历（不依赖存储，保证任何环境下都有界面）
    renderCalendar();

    // 2) 初始化存储
    const mode = await Store.init();

    // 3) 读设置
    S.dav = (await Store.getSetting('dav', null)) || { url: '', user: '', pass: '', auto: false };
    S.split = !!(await Store.getSetting('split', false));
    const wantDaySplit = !!(await Store.getSetting('daySplit', false));
    S.firstMonday = (await Store.getSetting('firstMonday', true)) !== false;
    if (await Store.getSetting('dark', false)) document.body.classList.add('dark');

    initPanes();
    bindUI();
    applyView();

    // 4) 数据
    const purged = await purgeBlankJournals();
    await refreshAll();
    await openJournal(new Date());
    // 上次退出时是双栏，就恢复双栏（右栏为次日）
    if (wantDaySplit) await setDaySplit(true);

    if (purged) {
      status('已清理 ' + purged + ' 篇空白日记');
    } else if (mode !== 'indexeddb') {
      status('存储降级为 ' + mode + '，建议导出备份');
    } else if (!S.daySplit) {
      status('就绪');
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();
</script>
</body>
</html>
