<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DK NOTE</title>
<style>
/* ================= 设计令牌（对齐 Orca Note） ================= */
:root{
  --gray-1:#f7f7f8; --gray-2:#efeff0; --gray-3:#e3e3e5; --gray-4:#c9c9cd;
  --gray-5:#a0a0a8; --gray-6:#77777f; --gray-7:#4a4a52; --gray-8:#35353b; --gray-9:#232328;
  --primary:#0b6bcb; --primary-weak:#e8f1fb; --danger:#d64545; --ok:#2f9e63;
  --sidebar-bg:#2c2c31; --sidebar-text:#e8e8ea; --sidebar-text-2:#9a9aa3;
  --sidebar-hover:#3a3a41; --sidebar-active:#484852;
  --content-bg:#fff; --content-text:#1f1f24; --content-text-2:#77777f;
  --border:#e3e3e5; --radius-sm:4px; --radius-md:8px;
  --font-ui:-apple-system,"Segoe UI","Microsoft YaHei UI","PingFang SC","Noto Sans SC",sans-serif;
  --font-mono:"Cascadia Code",Consolas,"JetBrains Mono",monospace;
}
body.dark{
  --content-bg:#1e1e22; --content-text:#e6e6e8; --content-text-2:#9a9aa3;
  --border:#35353b; --gray-1:#26262b; --gray-2:#2e2e34; --gray-3:#3a3a41;
  --gray-4:#55555e; --gray-9:#111114; --primary-weak:#1d2f45;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--font-ui);color:var(--content-text);background:var(--gray-2);overflow:hidden}
#app{display:flex;height:100vh}

/* ================= 侧栏 ================= */
#sidebar{width:272px;min-width:272px;background:var(--sidebar-bg);color:var(--sidebar-text);
  display:flex;flex-direction:column;z-index:10;box-shadow:2px 0 12px rgba(0,0,0,.08);transition:margin-left .18s ease}
#sidebar.collapsed{margin-left:-272px}
.side-head{display:flex;align-items:center;gap:2px;padding:10px 10px 2px}
#main .icon-btn:hover{background:var(--gray-2)}
.icon-btn{border:none;background:transparent;color:inherit;font-size:15px;width:28px;height:28px;
  border-radius:var(--radius-sm);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;line-height:1}
.icon-btn:hover{background:var(--sidebar-hover)}
.icon-btn:disabled{opacity:.35;cursor:default;background:transparent}
/* 顶栏图标：统一 16px 线性 SVG，颜色跟随文字色 */
.icon-btn svg{display:block;pointer-events:none}
.icon-btn svg.rot{transition:transform .14s ease}
.bottom-panel:not(.collapsed) #btn-bp-toggle svg.rot{transform:rotate(180deg)}
.side-spacer{flex:1}

/* 日历 */
.calendar{padding:8px 12px 6px;user-select:none}
.cal-header{display:flex;align-items:center;gap:2px;margin-bottom:6px}
.cal-title{font-size:13px;font-weight:600;letter-spacing:.2px;white-space:nowrap;display:flex;align-items:center;gap:2px}
.cal-title .cal-btn{cursor:pointer;padding:1px 3px;border-radius:3px}
.cal-title .cal-btn:hover{background:var(--sidebar-hover)}
.cal-today-btn{border:none;background:transparent;color:var(--sidebar-text-2);
  font-size:12px;font-weight:400;padding:2px 6px;border-radius:var(--radius-sm);cursor:pointer}
.cal-today-btn:hover{background:var(--sidebar-hover);color:var(--sidebar-text)}
.cal-grid{display:grid;grid-template-columns:20px repeat(7,1fr);gap:1px;font-size:11px}
.cal-cell{height:23px;display:flex;align-items:center;justify-content:center;border-radius:var(--radius-sm);position:relative;color:var(--sidebar-text)}
.cal-cell.head{color:var(--sidebar-text-2);font-size:10px;height:20px}
.cal-cell.weeknum{color:var(--sidebar-text-2);font-size:9.5px;opacity:.75}
.cal-cell.day{cursor:pointer}
.cal-cell.day:hover{background:var(--sidebar-hover)}
.cal-cell.day.other{color:var(--sidebar-text-2);opacity:.5}
.cal-cell.day .num{width:20px;height:20px;display:flex;align-items:center;justify-content:center;border-radius:50%}
.cal-cell.day.today .num{outline:1.5px solid #4ecdc4;outline-offset:0}
.cal-cell.day.selected .num{background:var(--primary);color:#fff;outline:none}
.cal-cell .dot{position:absolute;bottom:1px;left:50%;transform:translateX(-50%);width:3px;height:3px;border-radius:50%;background:var(--sidebar-text-2)}
.cal-cell.selected .dot{background:#fff}

/* 分段页签 + 列表 */
.seg-tabs{display:flex;background:rgba(255,255,255,.06);border-radius:var(--radius-sm);padding:2px;margin:2px 12px 8px}
.seg-item{flex:1;border:none;background:transparent;color:var(--sidebar-text-2);font-size:12px;padding:5px 0;border-radius:3px;cursor:pointer}
.seg-item.selected{background:rgba(255,255,255,.12);color:var(--sidebar-text)}
.side-scroll{flex:1;overflow-y:auto;min-height:0;padding:0 10px}
/* 侧栏页脚：应用名 + 版本 */
.side-foot{display:flex;align-items:baseline;gap:6px;padding:9px 14px 11px;
  border-top:1px solid rgba(255,255,255,.07);user-select:none;flex-shrink:0}
.side-foot .sf-name{font-size:11.5px;font-weight:600;letter-spacing:.9px;color:var(--sidebar-text);opacity:.82}
.side-foot .sf-ver{font-size:10px;letter-spacing:.3px;color:var(--sidebar-text-2);opacity:.72}
.note-list,.tag-list{list-style:none;margin:0;padding:0}
.note-item,.tag-item{display:flex;align-items:center;gap:7px;padding:5px 8px;border-radius:var(--radius-sm);
  cursor:pointer;font-size:13px;color:var(--sidebar-text);position:relative}
.note-item:hover,.tag-item:hover{background:var(--sidebar-hover)}
.note-item.active{background:var(--sidebar-active)}
.note-item .n-icon{opacity:.8;font-size:12px;width:14px;text-align:center}
.note-item .n-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.note-item .n-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.35}
.note-item .n-snip{font-size:11px;line-height:1.35;color:var(--sidebar-text);opacity:.66;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 搜索命中高亮（侧栏是深色底，不用默认的黄色底） */
.note-item mark{background:rgba(232,196,90,.26);color:#ffe9a8;border-radius:2px;padding:0 1px}
.note-item .n-more{opacity:0;border:none;background:transparent;color:var(--sidebar-text-2);cursor:pointer;
  font-size:13px;width:20px;height:20px;border-radius:3px;line-height:1}
.note-item:hover .n-more{opacity:1}
.note-item .n-more:hover{background:rgba(255,255,255,.14);color:#fff}
.tag-item .t-count{margin-left:auto;font-size:10px;color:var(--sidebar-text-2)}
.empty-tip{padding:10px 8px;font-size:12px;color:var(--sidebar-text-2);opacity:.8}

.filter-bar{display:flex;align-items:center;gap:6px;margin:0 0 6px;padding:5px 8px;border-radius:var(--radius-sm);
  background:rgba(255,255,255,.08);font-size:12px;color:var(--sidebar-text)}
.filter-bar.hidden{display:none}
.filter-bar .fb-tag{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.filter-bar button{border:none;background:transparent;color:var(--sidebar-text-2);cursor:pointer;font-size:12px;
  width:18px;height:18px;border-radius:3px;line-height:1}
.filter-bar button:hover{background:rgba(255,255,255,.14);color:#fff}
.note-item .n-fav{margin-left:auto;border:none;background:transparent;color:var(--sidebar-text-2);cursor:pointer;
  font-size:12px;width:18px;height:18px;border-radius:3px;line-height:1;opacity:.42;padding:0}
.note-item .n-fav.on{opacity:1;color:#e8c45a}
.note-item .n-fav:hover{opacity:1;color:#e8c45a}

/* ================= 主区 ================= */
#main{flex:1;display:flex;flex-direction:column;background:var(--content-bg);min-width:0}
.headbar{height:44px;display:flex;align-items:center;padding:0 14px;gap:10px;border-bottom:1px solid var(--border)}
.search-box{display:flex;align-items:center;gap:6px;background:var(--gray-1);border:1px solid var(--border);
  border-radius:6px;padding:4px 9px;width:260px}
.search-box input{border:none;outline:none;background:transparent;font-size:12.5px;color:var(--content-text);width:100%;font-family:inherit}
.search-box .search-ico{display:flex;color:var(--content-text-2);opacity:.62}
.head-right{margin-left:auto;display:flex;gap:2px}

.doc-head{padding:18px 44px 0}
.title-row{display:flex;align-items:center;gap:8px;position:relative}
.doc-title{flex:1;border:none;outline:none;background:transparent;font-size:26px;font-weight:700;
  color:var(--content-text);font-family:inherit;padding:0;min-width:0}
/* 日记：标题宽度贴合文字，好让「›」紧跟日期 */
.doc-title.dated{flex:none;max-width:100%}
.doc-title::placeholder{color:var(--gray-4)}
/* 日期翻页：前一天悬挂在标题左侧（不占位，保证标题仍与正文左对齐），后一天紧跟日期 */
.day-nav{border:none;background:transparent;color:var(--content-text-2);cursor:pointer;padding:0;
  width:22px;height:22px;border-radius:var(--radius-sm);font-size:18px;line-height:1;flex:none;
  display:inline-flex;align-items:center;justify-content:center;transition:background .12s,color .12s}
.day-nav:hover{background:var(--gray-2);color:var(--content-text)}
.day-nav:active{background:var(--gray-3)}
.day-nav.prev{position:absolute;left:-30px;top:50%;transform:translateY(-50%)}
.day-nav.hidden{display:none}
.wc-badge{font-size:11px;color:var(--content-text-2);background:var(--gray-2);padding:2px 8px;border-radius:10px;flex:none;
  margin-left:auto;margin-right:2px;line-height:1.5}

/* 标题下的标签条 */
.doc-tags{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:8px 0 2px;min-height:24px;position:relative}
.dt-label{font-size:11px;color:var(--content-text-2);flex:none}
.dt-chips{display:flex;gap:5px;flex-wrap:wrap}
.dt-chip{display:inline-flex;align-items:center;gap:3px;font-size:11.5px;line-height:1;padding:4px 7px;
  border-radius:11px;background:var(--gray-2);color:var(--content-text-2);cursor:pointer}
.dt-chip:hover{background:var(--gray-3);color:var(--content-text)}
.dt-chip .dt-x{font-size:11px;opacity:.55;padding:0 1px}
.dt-chip .dt-x:hover{opacity:1}
.dt-input{border:none;outline:none;background:transparent;font-size:11.5px;color:var(--content-text);
  font-family:inherit;padding:3px 0;min-width:92px}
.dt-input::placeholder{color:var(--gray-4)}
/* 标签池建议：点一下才加到本篇 */
.tag-suggest{position:absolute;left:0;top:100%;z-index:40;min-width:200px;max-width:320px;
  background:var(--content-bg);border:1px solid var(--border);border-radius:var(--radius-md);
  box-shadow:0 8px 24px rgba(0,0,0,.14);padding:4px;max-height:220px;overflow-y:auto}
.tag-suggest.hidden{display:none}
.ts-item{display:flex;align-items:center;gap:8px;width:100%;border:none;background:transparent;
  color:var(--content-text);font-size:12.5px;font-family:inherit;text-align:left;padding:5px 8px;
  border-radius:var(--radius-sm);cursor:pointer}
.ts-item:hover,.ts-item.on{background:var(--gray-2)}
.ts-item .ts-count{margin-left:auto;font-size:10.5px;color:var(--content-text-2)}
.ts-empty{padding:6px 8px;font-size:11.5px;color:var(--content-text-2);line-height:1.6}

.editor-wrap{flex:1;display:flex;min-height:0}
.editor-pane,.preview-pane{flex:1;min-width:0;display:flex;flex-direction:column;overflow-y:auto}
.editor-pane.hidden,.preview-pane.hidden{display:none}
.editor-wrap.split .editor-pane{border-right:1px solid var(--border)}
.toolbar{display:flex;align-items:center;gap:2px;flex-wrap:wrap;padding:6px 40px 4px;position:sticky;top:0;background:var(--content-bg);z-index:2}
.toolbar button{border:none;background:transparent;color:var(--content-text-2);font-size:12px;min-width:28px;height:26px;padding:0 6px;border-radius:var(--radius-sm);cursor:pointer}
.toolbar button:hover{background:var(--gray-2);color:var(--content-text)}
.toolbar button:disabled{opacity:.3;cursor:default}
.toolbar button:disabled:hover{background:transparent;color:var(--content-text-2)}
.toolbar button.on{background:var(--gray-2);color:var(--content-text)}
.tb-sep{width:1px;height:16px;background:var(--border);margin:0 5px}
/* 字色色板 */
.tb-color-wrap{position:relative;display:inline-flex}
.tb-palette{position:absolute;top:28px;left:0;z-index:40;display:grid;grid-template-columns:repeat(4,22px);gap:7px;
  padding:8px;background:var(--content-bg);border:1px solid var(--border);border-radius:var(--radius-md);
  box-shadow:0 8px 24px rgba(0,0,0,.14)}
.tb-palette.hidden{display:none}
.tb-swatch{width:22px;height:22px;border-radius:50%;border:1px solid rgba(0,0,0,.14);cursor:pointer;padding:0;min-width:0}
.tb-swatch:hover{outline:2px solid var(--primary);outline-offset:1px}
.tb-swatch.none{background:var(--content-bg);color:var(--content-text-2);font-size:11px;line-height:1;
  display:flex;align-items:center;justify-content:center}
/* 表格浮动工具条 */
.tbl-bar{position:fixed;z-index:45;display:flex;align-items:center;gap:1px;padding:2px;
  background:var(--content-bg);border:1px solid var(--border);border-radius:var(--radius-md);
  box-shadow:0 4px 16px rgba(0,0,0,.12)}
.tbl-bar.hidden{display:none}
.tbl-bar button{border:none;background:transparent;color:var(--content-text-2);font-size:11.5px;
  height:24px;padding:0 7px;border-radius:var(--radius-sm);cursor:pointer;font-family:inherit}
.tbl-bar button:hover{background:var(--gray-2);color:var(--content-text)}
.tbl-bar button.danger{color:var(--danger)}
.tbl-bar button.danger:hover{background:rgba(214,69,69,.1);color:var(--danger)}
.tbl-bar .tb-sep{margin:0 2px}
/* 表格列宽拖拽：靠近列边界时的参考线 */
.col-guide{position:fixed;left:0;top:0;width:2px;height:0;background:var(--primary);
  opacity:0;pointer-events:none;z-index:60;transition:opacity .1s}
.col-guide.on{opacity:.9}
body.col-dragging{cursor:col-resize;user-select:none}
body.col-dragging *{cursor:col-resize!important}
/* 富文本编辑器：写作态直接显示排版结果，不显示 Markdown 标记 */
.editor{flex:1;outline:none;padding:6px 44px 40px;font-family:var(--font-ui);
  font-size:14.5px;line-height:1.85;color:var(--content-text);background:transparent;
  min-height:200px;overflow-wrap:break-word;cursor:text;caret-color:var(--primary);word-break:break-word}
.editor:empty::before,.editor.is-empty::before{content:attr(data-placeholder);color:var(--gray-4);pointer-events:none}
.editor:focus{outline:none}
.preview-pane{padding:0}
.src-head{display:flex;align-items:center;gap:8px;padding:6px 40px 4px;font-size:11.5px;
  color:var(--content-text-2);position:sticky;top:0;background:var(--content-bg);z-index:2}
.src-hint{opacity:.75}
.src-view{flex:1;width:100%;border:none;outline:none;resize:none;background:transparent;
  padding:2px 40px 40px;font-family:var(--font-mono);font-size:13.2px;line-height:1.8;
  color:var(--content-text);min-height:200px}
/* 编辑区与预览共用的排版 */
:is(.preview-body,.editor){font-size:14.5px;line-height:1.85;overflow-wrap:break-word}
:is(.preview-body,.editor) h1,:is(.preview-body,.editor) h2,:is(.preview-body,.editor) h3,
:is(.preview-body,.editor) h4{margin:1em 0 .45em;line-height:1.35}
:is(.preview-body,.editor) h1{font-size:1.7em}:is(.preview-body,.editor) h2{font-size:1.42em}
:is(.preview-body,.editor) h3{font-size:1.2em}:is(.preview-body,.editor) h4{font-size:1.05em}
:is(.preview-body,.editor) p{margin:.5em 0}
:is(.preview-body,.editor) ul,:is(.preview-body,.editor) ol{padding-left:1.6em;margin:.45em 0}
:is(.preview-body,.editor) li{margin:.12em 0}
/* 无序列表各层都用实心圆点（浏览器默认会给二三级换成空心/方块，看着像换了一套格式） */
:is(.preview-body,.editor) ul,
:is(.preview-body,.editor) ul ul,
:is(.preview-body,.editor) ul ul ul,
:is(.preview-body,.editor) ul ul ul ul{list-style:disc}
/* 有序列表多级序号：一级 1. / 二级 (1) / 三级 a. / 四级 i. */
:is(.preview-body,.editor) ol{counter-reset:ol1}
:is(.preview-body,.editor) ol > li{counter-increment:ol1}
:is(.preview-body,.editor) ol ol{counter-reset:ol2;padding-left:2.15em}
:is(.preview-body,.editor) ol ol > li{counter-increment:ol1 0 ol2}
:is(.preview-body,.editor) ol ol ol{counter-reset:ol3;padding-left:2.3em}
:is(.preview-body,.editor) ol ol ol > li{counter-increment:ol1 0 ol2 0 ol3}
:is(.preview-body,.editor) ol ol ol ol{counter-reset:ol4;padding-left:2.5em}
:is(.preview-body,.editor) ol ol ol ol > li{counter-increment:ol1 0 ol2 0 ol3 0 ol4}
:is(.preview-body,.editor) ol > li::marker{content:counter(ol1) ". "}
:is(.preview-body,.editor) ol ol > li::marker{content:"(" counter(ol2) ") "}
:is(.preview-body,.editor) ol ol ol > li::marker{content:counter(ol3, lower-alpha) ". "}
:is(.preview-body,.editor) ol ol ol ol > li::marker{content:counter(ol4, lower-roman) ". "}
/* 子级列表（无序/有序混排）稍微缩进，层级一眼能看出 */
:is(.preview-body,.editor) ul ul, :is(.preview-body,.editor) ul ol,
:is(.preview-body,.editor) ol ul{padding-left:1.9em}
:is(.preview-body,.editor) blockquote{margin:.55em 0;padding:2px 14px;border-left:3px solid var(--gray-4);color:var(--content-text-2)}
:is(.preview-body,.editor) code{font-family:var(--font-mono);font-size:.88em;background:var(--gray-2);padding:1px 5px;border-radius:3px}
:is(.preview-body,.editor) pre{background:var(--gray-9);color:var(--gray-1);padding:12px 14px;border-radius:var(--radius-md);overflow-x:auto;font-size:.86em;line-height:1.6;font-family:var(--font-mono);white-space:pre-wrap}
:is(.preview-body,.editor) pre code{background:transparent;padding:0;color:inherit;font-size:1em}
:is(.preview-body,.editor) a{color:var(--primary);text-decoration:none;cursor:pointer}
:is(.preview-body,.editor) a:hover{text-decoration:underline}
:is(.preview-body,.editor) a.wiki{color:var(--primary);background:var(--primary-weak);padding:0 3px;border-radius:3px}
:is(.preview-body,.editor) hr{border:none;border-top:1px solid var(--border);margin:1.1em 0}
:is(.preview-body,.editor) table{border-collapse:collapse;margin:.65em 0;width:100%;font-size:.94em;table-layout:fixed}
:is(.preview-body,.editor) th,:is(.preview-body,.editor) td{border:1px solid var(--border);padding:5px 10px;text-align:left;vertical-align:top;overflow-wrap:anywhere;word-break:break-word}
:is(.preview-body,.editor) th{background:var(--gray-1)}
:is(.preview-body,.editor) img{max-width:100%}
/* 正文里的 #标签 */
:is(.preview-body,.editor) .tag-chip{display:inline-block;font-size:.9em;line-height:1.5;padding:0 6px;border-radius:9px;
  background:var(--gray-2);color:var(--content-text-2);cursor:pointer;text-decoration:none;user-select:all}
:is(.preview-body,.editor) .tag-chip:hover{background:var(--gray-3);color:var(--content-text);text-decoration:none}
/* 高亮（字体格式） */
:is(.preview-body,.editor) mark{background:#fff2a8;color:inherit;padding:0 2px;border-radius:2px}
body.dark :is(.preview-body,.editor) mark{background:#5c4a12;color:#f4e8c2}

/* 底部引用面板：引用方（双链） */
.bottom-panel{border-top:1px solid var(--border);background:var(--gray-1);display:flex;flex-direction:column;max-height:200px}
.bp-head{display:flex;align-items:center;gap:2px;padding:4px 12px}
.bp-tab{border:none;background:transparent;font-size:12px;color:var(--content-text-2);padding:4px 10px;border-radius:var(--radius-sm)}
.bp-tab.active{background:var(--content-bg);color:var(--content-text);font-weight:600;box-shadow:0 0 0 1px var(--border)}
/* WebDAV 本版本关闭：入口整体隐藏 */
.dav-off{display:none!important}
.bp-tools{margin-left:auto;display:flex;gap:2px}
.bp-summary{font-size:12px;color:var(--content-text-2);padding-left:4px}
.bottom-panel.collapsed .bp-body{display:none}
.bottom-panel.collapsed .bp-tab{display:none}
.bottom-panel:not(.collapsed) .bp-summary{display:none}
.bp-body{flex:1;overflow-y:auto;padding:2px 14px 8px;font-size:12.5px}
.bp-row{display:flex;align-items:center;gap:8px;padding:4px 6px;border-radius:var(--radius-sm);cursor:pointer;color:var(--content-text)}
.bp-row:hover{background:var(--gray-2)}
.bp-empty{color:var(--content-text-2);font-size:12px;padding:4px 6px;line-height:1.6}
.bp-create{color:var(--primary);cursor:pointer}

.statusbar{height:24px;display:flex;align-items:center;gap:14px;padding:0 14px;font-size:11px;
  color:var(--content-text-2);border-top:1px solid var(--border);background:var(--gray-1);flex:none}
.status-spacer{flex:1}
#status-save.dirty{color:var(--danger)}
#status-save.saved{color:var(--ok)}
#status-sync{color:var(--primary)}

/* ================= 菜单 / 弹窗 ================= */
.menu{position:fixed;background:var(--content-bg);border:1px solid var(--border);border-radius:6px;
  box-shadow:0 8px 24px rgba(0,0,0,.16);padding:4px;z-index:200;min-width:132px}
.menu button{display:block;width:100%;text-align:left;border:none;background:transparent;font-size:12.5px;
  padding:6px 10px;border-radius:4px;cursor:pointer;color:var(--content-text);font-family:inherit}
.menu button:hover{background:var(--gray-2)}
.menu button.danger{color:var(--danger)}

.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.34);display:flex;align-items:center;justify-content:center;z-index:300}
.modal-mask.hidden{display:none}
.modal{width:440px;max-height:84vh;overflow-y:auto;background:var(--content-bg);border-radius:var(--radius-md);box-shadow:0 14px 44px rgba(0,0,0,.24)}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:13px 18px;border-bottom:1px solid var(--border);font-weight:600;font-size:14px}
.modal-body{padding:14px 18px 20px}
.modal-body h3{font-size:12.5px;margin:16px 0 8px;color:var(--content-text-2);font-weight:600}
.modal-body h3:first-child,.modal-body > h3:first-of-type{margin-top:0}
.modal-body label{display:block;font-size:12px;color:var(--content-text-2);margin-bottom:10px}
.modal-body label.row{display:flex;align-items:center;gap:6px}
.modal-body input:not([type="checkbox"]){display:block;width:100%;margin-top:4px;padding:7px 9px;
  border:1px solid var(--border);border-radius:var(--radius-sm);font-size:13px;outline:none;font-family:inherit;
  background:var(--content-bg);color:var(--content-text)}
.modal-body input:focus{border-color:var(--primary)}
.modal-row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.btn{
  border:1px solid var(--border);background:var(--content-bg);color:var(--content-text);font-size:12.5px;
  padding:6px 14px;border-radius:var(--radius-sm);cursor:pointer;font-family:inherit}
.btn:hover{background:var(--gray-1)}
.btn:disabled{opacity:.45;cursor:default}
.btn:disabled:hover{background:var(--content-bg)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.modal-status{font-size:12px;color:var(--content-text-2);min-height:18px;margin:4px 0}
.modal-status.ok{color:var(--ok)}
.modal-status.err{color:var(--danger)}
.modal-hint{font-size:11px;line-height:1.6;color:var(--content-text-2);opacity:.85;margin:2px 0 6px}
.hidden{display:none!important}

/* 滚动条 */
.side-scroll::-webkit-scrollbar,.editor::-webkit-scrollbar,.preview-pane::-webkit-scrollbar,
.modal::-webkit-scrollbar,.bp-body::-webkit-scrollbar{width:8px}
.side-scroll::-webkit-scrollbar-thumb{background:#4a4a52;border-radius:4px}
.editor::-webkit-scrollbar-thumb,.preview-pane::-webkit-scrollbar-thumb,
.modal::-webkit-scrollbar-thumb,.bp-body::-webkit-scrollbar-thumb{background:var(--gray-4);border-radius:4px}

/* ================= 双栏：同时显示 / 编辑连续两天 ================= */
.panes{flex:1;display:flex;min-height:0;min-width:0}
.pane{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0;position:relative}
.pane.hidden{display:none}
.panes.splitting .pane + .pane{border-left:1px solid var(--border)}
/* 非活动窗格淡一档底色 + 标题转灰：一眼看出正在改哪一边 */
.pane.dim{background:var(--gray-2)}
.pane.dim .toolbar,.pane.dim .src-head{background:var(--gray-2)}
.pane.dim .doc-title{color:var(--content-text-2)}
/* 分栏后每列变窄：收留白、缩标题、工具栏按需换行 */
.panes.splitting .doc-head{padding:14px 20px 0}
.panes.splitting .doc-title{font-size:21px}
.panes.splitting .day-nav.prev{left:-22px;width:19px}
.panes.splitting .toolbar{padding:6px 16px 4px;row-gap:2px}
.panes.splitting .editor{padding:4px 20px 32px}
.panes.splitting .src-head{padding:6px 16px 4px}
.panes.splitting .src-view{padding:2px 20px 32px}
#btn-day-split.on{background:var(--gray-2);color:var(--primary)}
/* 侧栏：另一栏正在显示的那篇，给一个更浅的底 */
.note-item.open{background:rgba(255,255,255,.05)}

/* 窄屏 */
/* 窄屏：侧栏改浮层抽屉，默认收起；打开时内容区加遮罩 */
#side-mask{position:fixed;top:0;right:0;bottom:0;left:272px;background:rgba(0,0,0,.3);
  z-index:9;opacity:0;pointer-events:none;transition:opacity .18s;display:none}
@media (max-width:820px){
  #sidebar{position:absolute;height:100%;left:0;box-shadow:6px 0 24px rgba(0,0,0,.28)}
  #main{min-width:0}
  #side-mask{display:block}
  #side-mask.show{opacity:1;pointer-events:auto}
  .search-box{width:150px}
  .doc-head,.editor,.preview-pane{padding-left:20px;padding-right:20px}
  .toolbar{padding-left:20px;padding-right:74px;flex-wrap:wrap;row-gap:2px}
  /* 窄屏工具栏会换行，字数固定在第一行右端，避免独占一整行 */
  .wc-badge{position:absolute;right:20px;top:8px;margin:0}
  .day-nav.prev{left:-22px}
  /* 窄屏放两列太挤：双栏改成上下两段 */
  .panes.splitting{flex-direction:column}
  .panes.splitting .pane + .pane{border-left:none;border-top:1px solid var(--border)}
  .panes.splitting .toolbar{padding-left:20px;padding-right:74px}
  .panes.splitting .doc-head{padding-left:20px;padding-right:20px}
  .panes.splitting .editor{padding-left:20px;padding-right:20px}
}
@media (max-width:620px){
  .search-box{display:none}
  .doc-head,.editor,.preview-pane{padding-left:16px;padding-right:16px}
  .toolbar{padding-left:16px;padding-right:70px}
  .wc-badge{right:16px}
  .day-nav.prev{left:-19px;width:19px}
  .panes.splitting .toolbar{padding-left:16px;padding-right:70px}
  .panes.splitting .doc-head,.panes.splitting .editor{padding-left:16px;padding-right:16px}
}
</style>
</head>

    <!-- 窗格：单栏时只有 A；双栏时右侧克隆出 B，两栏各自独立编辑 -->

<script>
/* =====================================================================
   DK NOTE v0.1 — 单文件版（无模块依赖，双击 file:// 亦可运行）
   ===================================================================== */
(function () {
  'use strict';

  /* 本版本关闭的能力。改回 true 并去掉设置里那段 class="dav-off" 即可恢复入口 */
  const FEATURES = { webdav: false };

  /* ---------------- 工具 ---------------- */
  const $ = (id) => document.getElementById(id);
  const pad = (n) => String(n).padStart(2, '0');
  const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const dayKey = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const journalName = (d) => dayKey(d) + '.md';
  function parseJournalName(name) {
    const m = String(name).match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (!m) return null;
    const d = new Date(+m[1], +m[2] - 1, +m[3]);
    return isNaN(d.getTime()) ? null : d;
  }
  // 空白日记：文件存在但没有任何内容（不算“有笔记”）
  function isBlankJournal(n) {
    return !!parseJournalName(n.name) && !String(n.content || '').trim();
  }
  function isoWeek(date) {
    const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
    const day = d.getUTCDay() || 7;
    d.setUTCDate(d.getUTCDate() + 4 - day);
    const ys = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
    return Math.ceil(((d - ys) / 86400000 + 1) / 7);
  }

  /* ---------------- Markdown ---------------- */
  function inline(text, noteResolver) {
    // 字体颜色 / 高亮写成行内 HTML，先摘出来以免被转义
    const stash = [];
    const keep = (html) => { stash.push(html); return '\x00T' + (stash.length - 1) + '\x00'; };
    let raw = String(text);
    raw = raw.replace(/<span\s+style="color:([^"]+)"\s*>([\s\S]*?)<\/span>/gi, (m, col, inner) => {
      const c = String(col).trim();
      if (!/^[#a-zA-Z0-9(),.%\s]+$/.test(c)) return m;   // 不是颜色值就按普通文本处理
      return keep('<span data-color="' + c + '" style="color:' + c + '">' + inline(inner) + '</span>');
    });
    raw = raw.replace(/<mark>([\s\S]*?)<\/mark>/gi, (m, inner) => keep('<mark>' + inline(inner) + '</mark>'));

    let s = esc(raw);
    const codes = [];
    s = s.replace(/`([^`]+)`/g, (_, c) => { codes.push(c); return '\x00C' + (codes.length - 1) + '\x00'; });
    // 双链 [[笔记名]]
    s = s.replace(/\[\[([^\]]+)\]\]/g, (_, n) => `<a href="#" class="wiki" data-wiki="${esc(n)}">${esc(n)}</a>`);
    s = s.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, '<img src="$2" alt="$1" />');
    s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/\*([^*]+)\*/g, '<em>$1</em>');
    s = s.replace(/~~([^~]+)~~/g, '<del>$1</del>');
    // #标签（前面需为行首/空白/中文括号，避免误伤 URL 锚点）
    s = s.replace(/(^|[\s(（])#([^\s#，。,;；!！?？'"）)\]]{1,40})/g,
      (_, pre, t) => pre + '<span class="tag-chip" data-tag="' + esc(t) + '">#' + esc(t) + '</span>');
    s = s.replace(/\x00C(\d+)\x00/g, (_, i) => '<code>' + codes[+i] + '</code>');
    s = s.replace(/\x00T(\d+)\x00/g, (_, i) => stash[+i]);
    return s;
  }

  function renderMd(src) {
    const lines = String(src || '').replace(/\r\n?/g, '\n').split('\n');
    const out = [];
    let i = 0;
    while (i < lines.length) {
      const line = lines[i];

      if (/^```/.test(line)) {
        const lang = line.slice(3).trim();
        const buf = [];
        i++;
        while (i < lines.length && !/^```/.test(lines[i])) { buf.push(lines[i]); i++; }
        i++;
        out.push('<pre><code' + (lang ? ' class="lang-' + esc(lang) + '"' : '') + '>' +
          esc(buf.join('\n')) + '</code></pre>');
        continue;
      }

      const h = line.match(/^(#{1,6})\s+(.*)$/);
      if (h) { out.push(`<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`); i++; continue; }

      if (/^[\s\-*_]+$/.test(line) && /^\s*([-*_])\s*\1\s*\1/.test(line)) { out.push('<hr />'); i++; continue; }

      if (/^>\s?/.test(line)) {
        const buf = [];
        while (i < lines.length && /^>\s?/.test(lines[i])) { buf.push(lines[i].replace(/^>\s?/, '')); i++; }
        // 引用内空行表示一个空段落；连续空行按一个算
        const parts = [[]];
        buf.forEach(l => {
          if (!l.trim()) { if (parts[parts.length - 1].length) parts.push([]); }
          else parts[parts.length - 1].push(l);
        });
        const body = parts.filter(p => p.length).map(p => renderMd(p.join('\n'))).join('');
        out.push('<blockquote>' + (body || '<p><br /></p>') + '</blockquote>');
        continue;
      }

      if (/^\|(.+)\|\s*$/.test(line) && i + 1 < lines.length && /^\|[\s:|-]+\|\s*$/.test(lines[i + 1])) {
        const head = line.split('|').slice(1, -1).map(c => c.trim());
        i += 2;
        const rows = [];
        while (i < lines.length && /^\|(.+)\|\s*$/.test(lines[i])) {
          rows.push(lines[i].split('|').slice(1, -1).map(c => c.trim())); i++;
        }
        let t = '<table>';
        // 紧跟表格的列宽注释（拖动列边界时写入）
        const wm = (lines[i] || '').match(/^\s*<!--\s*tbw:\s*([\d.,\s]+?)\s*-->\s*$/);
        if (wm) {
          const ws = wm[1].split(',').map(v => parseFloat(v)).filter(v => v > 0);
          if (ws.length === head.length) {
            const sum = ws.reduce((a, b) => a + b, 0) || 1;
            t += '<colgroup>' + ws.map(v => '<col style="width:' + (v / sum * 100).toFixed(2) + '%">').join('') + '</colgroup>';
            i++;
          }
        }
        t += '<thead><tr>' + head.map(c => `<th>${inline(c)}</th>`).join('') + '</tr></thead><tbody>';
        rows.forEach(r => { t += '<tr>' + r.map(c => `<td>${inline(c)}</td>`).join('') + '</tr>'; });
        out.push(t + '</tbody></table>');
        continue;
      }

      if (/^\s*([-*+]|\d+[.)])\s+/.test(line)) {
        const items = [];
        while (i < lines.length && /^\s*([-*+]|\d+[.)])\s+/.test(lines[i])) {
          const m = lines[i].match(/^(\s*)([-*+]|\d+[.)])\s+(.*)$/);
          items.push({ indent: m[1].length, ordered: /\d/.test(m[2]), num: parseInt(m[2], 10) || 1, text: m[3] }); i++;
        }
        normalizeListItems(items);
        out.push(buildList(items, 0).html);
        continue;
      }

      if (/^\s*$/.test(line)) {
        let n = 0;
        while (i < lines.length && /^\s*$/.test(lines[i])) { n++; i++; }
        // 第 1 个空行只是块间分隔，多出来的每个空行对应用户留下的一个空段落
        const extra = i < lines.length ? Math.min(n - 1, 20) : 0;
        for (let k = 0; k < extra; k++) out.push('<p><br /></p>');
        continue;
      }

      const buf = [line]; i++;
      while (i < lines.length && !/^\s*$/.test(lines[i]) &&
        !/^(#{1,6}\s|```|>|\s*([-*+]|\d+[.)])\s+|\|)/.test(lines[i])) { buf.push(lines[i]); i++; }
      out.push('<p>' + inline(buf.join('\n')).replace(/\n/g, '<br />') + '</p>');
    }
    return out.join('\n');
  }

  // 把任意缩进（2 空格、3 空格、Tab 展开后的空格）归一到「层级 × 2」，
  // 否则奇数缩进会让 buildList 找不到匹配层级而死循环
  function normalizeListItems(items) {
    const stack = [];
    items.forEach(it => {
      while (stack.length && it.indent < stack[stack.length - 1]) stack.pop();
      if (!stack.length || it.indent > stack[stack.length - 1]) stack.push(it.indent);
      it.indent = (stack.length - 1) * 2;
    });
  }
  // olDepth：祖先里有序列表的个数，用来对上 CSS 的 ol1/ol2/ol3 计数器
  function buildList(items, level, olDepth) {
    const ordered = items[0].ordered;
    const tag = ordered ? 'ol' : 'ul';
    const myDepth = (olDepth || 0) + (ordered ? 1 : 0);
    const startNum = ordered ? (items[0].num || 1) : 1;
    // md 里首项写成 5. 时，列表从 5 开始编号（counter-reset 从 start-1 起）
    const attrs = ordered && startNum > 1
      ? ' start="' + startNum + '" style="counter-reset:ol' + myDepth + ' ' + (startNum - 1) + '"'
      : '';
    let html = '<' + tag + attrs + '>';
    let idx = 0;
    while (idx < items.length) {
      const cur = items[idx];
      if (cur.indent < level * 2) break;
      if (cur.indent > level * 2) {
        const sub = buildList(items.slice(idx), level + 1, myDepth);
        if (!sub.count) break; // 缩进异常时兜底，避免无限递归
        html = html.replace(/<\/li>$/, sub.html + '</li>');
        idx += sub.count;
        continue;
      }
      html += '<li>' + inline(cur.text);
      const next = items[idx + 1];
      if (next && next.indent > cur.indent) {
        const sub = buildList(items.slice(idx + 1), level + 1, myDepth);
        html += sub.html; idx += sub.count + 1; html += '</li>';
      } else { html += '</li>'; idx++; }
    }
    return { html: html + '</' + tag + '>', count: idx };
  }

  /* ---------------- HTML → Markdown（富文本编辑器回写） ---------------- */
  const BLOCKS = /^(H[1-6]|P|DIV|UL|OL|LI|BLOCKQUOTE|PRE|HR|TABLE)$/;
  function hasBlockChild(el) {
    return Array.from(el.children || []).some(c => BLOCKS.test(c.tagName));
  }
  function inlineToMd(node) {
    let s = '';
    Array.from(node.childNodes || []).forEach(c => {
      if (c.nodeType === 3) { s += c.textContent; return; }
      if (c.nodeType !== 1) return;
      const t = c.tagName.toLowerCase();
      if (t === 'br') { s += '\n'; return; }
      if (t === 'strong' || t === 'b') { const i = inlineToMd(c); s += i ? '**' + i + '**' : ''; return; }
      if (t === 'em' || t === 'i') { const i = inlineToMd(c); s += i ? '*' + i + '*' : ''; return; }
      if (t === 'del' || t === 's' || t === 'strike') { const i = inlineToMd(c); s += i ? '~~' + i + '~~' : ''; return; }
      if (t === 'code') { s += '`' + c.textContent.replace(/`/g, '') + '`'; return; }
      if (t === 'a') {
        if (c.dataset.wiki) { s += '[[' + c.dataset.wiki + ']]'; return; }
        const inner = inlineToMd(c) || c.getAttribute('href') || '';
        s += '[' + inner + '](' + (c.getAttribute('href') || '') + ')';
        return;
      }
      if (t === 'span' && c.dataset.tag) { s += '#' + c.dataset.tag; return; }
      if (t === 'span' && (c.dataset.color || (c.style && c.style.color))) {
        // 字体颜色用行内 HTML 表达，Markdown 本身没有颜色语法
        const col = c.dataset.color || c.style.color;
        s += '<span style="color:' + col + '">' + inlineToMd(c) + '</span>';
        return;
      }
      if (t === 'mark') { s += '<mark>' + inlineToMd(c) + '</mark>'; return; }
      if (t === 'img') { s += '![' + (c.alt || '') + '](' + (c.getAttribute('src') || '') + ')'; return; }
      s += inlineToMd(c);
    });
    return s;
  }
  function listToMd(list, out, indent, ordered) {
    // <ol start="5"> 要写成 5. 6. 7.，否则重新打开会从 1 重新编号
    let n = (ordered && parseInt(list.getAttribute('start'), 10)) || 1;
    Array.from(list.children).forEach(li => {
      if (li.tagName !== 'LI') return;
      const subs = [];
      const holder = document.createElement('div');
      Array.from(li.childNodes).forEach(c => {
        if (c.nodeType === 1 && /^(UL|OL)$/i.test(c.tagName)) subs.push(c);
        else holder.appendChild(c.cloneNode(true));
      });
      const text = inlineToMd(holder).replace(/\n+/g, ' ').trim();
      out.push(' '.repeat(indent) + (ordered ? (n++) + '. ' : '- ') + text);
      subs.forEach(s => listToMd(s, out, indent + 2, /^OL$/i.test(s.tagName)));
    });
  }
  function tableToMd(table, out) {
    const rows = Array.from(table.querySelectorAll('tr'));
    if (!rows.length) return;
    const cells = (r) => Array.from(r.children)
      .map(c => inlineToMd(c).replace(/\n/g, ' ').replace(/\|/g, '\\|').trim());
    const head = cells(rows[0]);
    out.push('| ' + head.join(' | ') + ' |');
    out.push('| ' + head.map(() => '---').join(' | ') + ' |');
    rows.slice(1).forEach(r => out.push('| ' + cells(r).join(' | ') + ' |'));
    // 手动拖过的列宽：紧跟表格写一行 HTML 注释（标准渲染器不可见），
    // 等分时不写，保持 md 干净
    const cg = table.querySelector(':scope > colgroup');
    if (cg && head.length > 1 && cg.children.length === head.length) {
      const ws = Array.from(cg.children).map(c => parseFloat(c.style.width) || 0);
      const even = 100 / head.length;
      if (ws.every(v => v > 0) && ws.some(v => Math.abs(v - even) > 0.6)) {
        out.push('<!--tbw:' + ws.map(v => Math.round(v * 10) / 10).join(',') + '-->');
      }
    }
  }
  function blockToMd(node, out, indent, blank) {
    const addBlank = blank !== false;
    const push = (t) => { out.push(t); if (addBlank) out.push(''); };
    if (node.nodeType === 3) {
      const t = node.textContent.replace(/\u00a0/g, ' ');
      if (t.trim()) push(t);
      return;
    }
    if (node.nodeType !== 1) return;
    const tag = node.tagName.toLowerCase();
    if (/^h[1-6]$/.test(tag)) {
      const txt = inlineToMd(node).replace(/\n+/g, ' ').trim();
      push('#'.repeat(+tag[1]) + ' ' + txt);
      return;
    }
    if (tag === 'ul' || tag === 'ol') {
      listToMd(node, out, indent, tag === 'ol');
      if (addBlank) out.push('');
      return;
    }
    if (tag === 'blockquote') {
      const inner = [];
      // 子块之间保留空行，否则重新渲染时会被并成一段
      Array.from(node.childNodes).forEach(c => blockToMd(c, inner, indent, true));
      // 合并连续空行、去掉首尾空行，避免写出 "> " 之类的空引用行
      const lines = [];
      inner.join('\n').split('\n').forEach(l => {
        if (!l.trim() && (!lines.length || !lines[lines.length - 1].trim())) return;
        lines.push(l);
      });
      while (lines.length && !lines[lines.length - 1].trim()) lines.pop();
      if (lines.length) lines.forEach(l => out.push(l.trim() ? '> ' + l : '>'));
      else out.push('>');
      if (addBlank) out.push('');
      return;
    }
    if (tag === 'pre') {
      const code = node.querySelector('code');
      const m = code && /lang-(\S+)/.exec(code.className || '');
      const body = (code ? code.innerText : node.innerText).replace(/\n$/, '');
      push('```' + (m ? m[1] : '') + '\n' + body + '\n```');
      return;
    }
    if (tag === 'hr') { push('---'); return; }
    if (tag === 'table') { tableToMd(node, out); if (addBlank) out.push(''); return; }
    if (tag === 'br') return;
    if (tag === 'p' || tag === 'div' || tag === 'section' || tag === 'article') {
      if (hasBlockChild(node)) {
        Array.from(node.childNodes).forEach(c => blockToMd(c, out, indent, addBlank));
        return;
      }
      const body = inlineToMd(node).replace(/\u00a0/g, ' ');
      // 空段落（只有一个 <br>）：只补一行空行，不加块间距，
      // 这样「块间距 1 行 + 空段落 1 行 = 2 行空行」，renderMd 才好把它还原成空行
      if (!body.replace(/[\s\u200b]/g, '') && !node.querySelector('img,table,hr')) {
        out.push('');
        return;
      }
      push(body);
      return;
    }
    const txt = inlineToMd(node);
    if (txt.trim()) push(txt);
  }
  function htmlToMd(root) {
    if (!root) return '';
    const out = [];
    Array.from(root.childNodes).forEach(n => blockToMd(n, out, 0, true));
    // 不再把 3 个以上换行压成 2 个：多出来的空行就是用户特意留的空段落
    return out.join('\n').replace(/^\n+|\s+$/g, '');
  }

  /* ---------------- 粘贴：外部 HTML → 本编辑器结构 ----------------
     别的编辑器（Word / 飞书 / 语雀 / 网页…）复制过来时，text/plain 只剩一行行文字，
     粗体、缩进层级、列表嵌套全丢。这里改读 text/html，按白名单重建结构后插入。 */
  const PST_DROP = new Set(['SCRIPT', 'STYLE', 'META', 'LINK', 'TITLE', 'NOSCRIPT', 'IFRAME', 'OBJECT',
    'EMBED', 'SVG', 'CANVAS', 'FORM', 'INPUT', 'BUTTON', 'SELECT', 'TEXTAREA', 'AUDIO', 'VIDEO',
    'COLGROUP', 'COL', 'FIGCAPTION']);
  const PST_BLOCK = new Set(['P', 'DIV', 'SECTION', 'ARTICLE', 'HEADER', 'FOOTER', 'MAIN', 'ASIDE',
    'FIGURE', 'ADDRESS', 'DL', 'DT', 'DD', 'CENTER', 'H1', 'H2', 'H3', 'H4', 'H5', 'H6',
    'BLOCKQUOTE', 'PRE', 'UL', 'OL', 'LI', 'TABLE', 'THEAD', 'TBODY', 'TFOOT', 'TR', 'TH', 'TD', 'HR']);

  function pstText(s) {
    return String(s || '').replace(/\u00a0/g, ' ').replace(/[\u200b-\u200d\ufeff]/g, '');
  }
  function pstColor(v) {
    const s = String(v || '').trim();
    if (!s) return '';
    if (/^#[0-9a-f]{3,8}$/i.test(s)) return s.toLowerCase();
    const m = s.match(/^rgba?\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)/i);
    if (!m) return '';
    const h = n => (+n).toString(16).padStart(2, '0');
    return '#' + h(m[1]) + h(m[2]) + h(m[3]);
  }
  function pstStyle(n) {
    const st = n.style || {};
    const g = k => String(st[k] || '').toLowerCase();
    const fw = g('fontWeight');
    const bg = pstColor(st.backgroundColor);
    return {
      bold: fw === 'bold' || fw === 'bolder' || (parseInt(fw, 10) >= 600),
      plainWeight: fw === 'normal' || fw === '400',
      italic: /^(italic|oblique)/.test(g('fontStyle')),
      plainStyle: g('fontStyle') === 'normal',
      color: pstColor(st.color) || pstColor(n.getAttribute('color')),
      mark: !!bg && bg !== '#000000' && bg !== '#ffffff',
    };
  }
  function pstWrap(tag, src, dest) {
    const el = document.createElement(tag);
    pstInline(src, el);
    if (el.textContent.trim() || el.querySelector('img,br')) dest.appendChild(el);
  }
  // 单个节点当成“行内片段”处理（不能直接把元素当容器，否则会丢掉它自己的粗体/颜色）
  function pstInlineNode(node, dest) {
    const frag = document.createDocumentFragment();
    frag.appendChild(node);
    pstInline(frag, dest);
  }
  // 行内内容：直接写进 dest
  function pstInline(src, dest) {
    Array.from(src.childNodes).forEach(n => {
      if (n.nodeType === 3) {
        const t = pstText(n.nodeValue).replace(/\s+/g, ' ');
        if (!t) return;
        if (!t.trim() && (!dest.lastChild || dest.lastChild.nodeName === 'BR')) return;  // 去掉首尾空白
        dest.appendChild(document.createTextNode(t));
        return;
      }
      if (n.nodeType !== 1) return;
      const tag = n.tagName.toUpperCase();
      if (PST_DROP.has(tag)) return;
      if (tag === 'BR') { dest.appendChild(document.createElement('br')); return; }
      const s = pstStyle(n);
      if (/^(B|STRONG)$/.test(tag)) return s.plainWeight ? pstInline(n, dest) : pstWrap('strong', n, dest);
      if (/^(I|EM|CITE|VAR|DFN)$/.test(tag)) return s.plainStyle ? pstInline(n, dest) : pstWrap('em', n, dest);
      if (/^(S|STRIKE|DEL)$/.test(tag)) return pstWrap('del', n, dest);
      if (/^(CODE|KBD|SAMP|TT)$/.test(tag)) return pstWrap('code', n, dest);
      if (tag === 'MARK' || s.mark) return pstWrap('mark', n, dest);
      if (tag === 'IMG') {
        const src2 = n.getAttribute('src') || '';
        if (/^(https?:|\.{0,2}\/)/i.test(src2)) {
          const img = document.createElement('img');
          img.setAttribute('src', src2);
          img.setAttribute('alt', n.getAttribute('alt') || '');
          dest.appendChild(img);
        }
        return;
      }
      if (tag === 'A' && n.dataset.wiki) {
        const a = document.createElement('a');
        a.className = 'wiki';
        a.dataset.wiki = n.dataset.wiki;
        a.setAttribute('href', '#');
        a.textContent = n.dataset.wiki;
        dest.appendChild(a);
        return;
      }
      if (tag === 'SPAN' && n.dataset.tag) {   // 从本应用内复制的标签，保持成标签
        const sp = document.createElement('span');
        sp.className = 'tag-chip';
        sp.dataset.tag = n.dataset.tag;
        sp.textContent = '#' + n.dataset.tag;
        dest.appendChild(sp);
        return;
      }
      if (tag === 'A') {
        const href = n.getAttribute('href') || '';
        if (/^(https?:|mailto:)/i.test(href)) {
          const a = document.createElement('a');
          a.setAttribute('href', href);
          pstInline(n, a);
          if (a.childNodes.length) dest.appendChild(a);
          return;
        }
        return pstInline(n, dest);
      }
      if (s.color) {
        const sp = document.createElement('span');
        sp.style.color = s.color;
        pstInline(n, sp);
        if (sp.childNodes.length) dest.appendChild(sp);
        return;
      }
      if (s.bold) return pstWrap('strong', n, dest);
      if (s.italic) return pstWrap('em', n, dest);
      if (PST_BLOCK.has(tag)) {   // 行内位置遇到块：当软换行处理
        dest.appendChild(document.createElement('br'));
        pstInline(n, dest);
        return;
