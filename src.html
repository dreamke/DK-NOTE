      html += '<button class="cp-swatch" data-color="' + c.c + '" title="' + c.n + '" ' +
        'style="background:' + c.c + '"></button>';
    });
    html += '<button class="cp-swatch none" data-color="" title="默认字色（清除颜色）">A</button></div>';
    html += '<div class="cp-row"><span class="cp-label">高亮</span>' +
      '<button class="cp-swatch hl" data-hl="1" title="标黄（再点一次取消）"></button>' +
      '<span class="cp-hint">先选中文字，再点颜色</span></div>';
    pop.innerHTML = html;
    pop.addEventListener('mousedown', (e) => e.preventDefault());   // 别让面板抢走编辑器选区
    pop.addEventListener('click', (e) => {
      const sw = e.target.closest ? e.target.closest('.cp-swatch') : null;
      if (!sw) return;
      e.preventDefault();
      const p = colorPane || curPane();
      if (sw.dataset.hl) vtToggleHl(p);
      else vtApplyColor(sw.dataset.color || '', p);
      closeColorPop();
    });
  }

  function positionColorPop(btn) {
    const pop = $('color-pop');
    let rect = btn && btn.getBoundingClientRect ? btn.getBoundingClientRect() : null;
    if (!rect || (!rect.width && !rect.height)) {
      rect = colorRange ? colorRange.getBoundingClientRect() : null;
    }
    if (!rect) rect = { left: 320, top: 120, bottom: 140 };
    const W = pop.offsetWidth || 188;
    const H = pop.offsetHeight || 96;
    const left = Math.min(Math.max(8, rect.left - 24), (window.innerWidth || 1200) - W - 12);
    let top = rect.bottom + 8;
    if (top + H > (window.innerHeight || 800) - 8) top = Math.max(8, rect.top - H - 8);
    pop.style.left = Math.round(left) + 'px';
    pop.style.top = Math.round(top) + 'px';
  }

  function openColorPop(p, btn) {
    p = p || curPane();
    if (!p || !p.vd) return;
    // 和双链面板一样：点工具栏按钮时浏览器可能已经清掉编辑器选区，先抢在 focus 之前记下来
    const sel = window.getSelection();
    const live = (sel.rangeCount && sel.anchorNode && p.el.host.contains(sel.anchorNode))
      ? sel.getRangeAt(0).cloneRange() : null;
    colorRange = live || (p.lastRange && p.lastRange.startContainer && p.lastRange.startContainer.isConnected
      ? p.lastRange.cloneRange() : null);
    colorPane = p;
    p.vd.focus();
    if (colorRange && colorRange.startContainer.isConnected) {
      const s2 = window.getSelection();
      s2.removeAllRanges();
      s2.addRange(colorRange);
    }
    buildColorPop();
    $('color-pop').classList.remove('hidden');
    positionColorPop(btn);
  }
  function closeColorPop() {
    $('color-pop').classList.add('hidden');
    colorPane = null;
    colorRange = null;
  }
  function toggleColorPop(p, btn) {
    if ($('color-pop').classList.contains('hidden')) openColorPop(p, btn);
    else closeColorPop();
  }

  function initColorUI() {
    buildColorPop();
    document.addEventListener('mousedown', (e) => {
      if ($('color-pop').classList.contains('hidden')) return;
      const tg = e.target;
      if (tg && tg.closest && (tg.closest('#color-pop') || tg.closest('[data-type="color"]'))) return;
      closeColorPop();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && !$('color-pop').classList.contains('hidden')) closeColorPop();
    });
    // 窗口尺寸一变（含双栏切换）面板会飘，直接收起
    window.addEventListener('resize', () => {
      if (!$('color-pop').classList.contains('hidden')) closeColorPop();
    });
  }

  /* ---------------- 表格工具条（两种编辑模式共用一套） ---------------- */
  // Vditor 自带的那条只在 wysiwyg 出现，而且功能性弱点：白色浮条直接压在正文上（实测盖住标题下半行），
  // 按钮里还塞了「块上移/下移/删除整块」——笔记里没有块拖拽这回事，纯属碍事。
  // 所以统一成这一条自绘的：两种模式用同一批按钮、同一个位置、同一套样式，CSS 里把 Vditor 那条藏掉。
  // 做法是直接改 <table> 的 DOM：IR 和 wysiwyg 的 getValue() 都是 Lute 从 DOM 反解 Markdown，
  // 改完调 markDirty 就能落盘，不用整篇 setValue（那样会丢滚动位置和光标）。
  // 两个坑：
  //   1. 对齐必须写 align 属性。写 style="text-align:center" Lute 反解不认，存下来会丢。
  //   2. 表头不能多行也不能删光，否则 GFM 表格结构就坏了，只对 tbody 动刀。
  const TBL = { table: null, row: 0, col: 0, pane: null };
  const TBL_BTNS = [
    { act: 'row-add-above', tip: '在上方插入一行',
      ico: '<path d="M8 2.6v6.2M5.4 5.2 8 2.6 10.6 5.2"/><path d="M2.5 13.2h11"/>' },
    { act: 'row-add', tip: '在下方插入一行',
      ico: '<path d="M8 13.4V7.2M5.4 10.8 8 13.4 10.6 10.8"/><path d="M2.5 2.8h11"/>' },
    { act: 'row-del', tip: '删除当前行',
      ico: '<path d="M2.5 3.5h11M2.5 12.5h11M5.9 8h4.2"/>' },
    { sep: true },
    { act: 'col-add-left', tip: '在左侧插入一列',
      ico: '<path d="M2.6 8h6.2M5.2 5.4 2.6 8 5.2 10.6"/><path d="M13.2 2.5v11"/>' },
    { act: 'col-add', tip: '在右侧插入一列',
      ico: '<path d="M13.4 8H7.2M10.8 5.4 13.4 8 10.8 10.6"/><path d="M2.8 2.5v11"/>' },
    { act: 'col-del', tip: '删除当前列',
      ico: '<path d="M2.5 2.5v11M13.5 2.5v11M6 8h4"/>' },
    { sep: true },
    { act: 'align-left', tip: '整列左对齐',
      ico: '<path d="M2.5 3.5h11M2.5 6.5h6.5M2.5 9.5h11M2.5 12.5h6.5"/>' },
    { act: 'align-center', tip: '整列居中',
      ico: '<path d="M2.5 3.5h11M4.75 6.5h6.5M2.5 9.5h11M4.75 12.5h6.5"/>' },
    { act: 'align-right', tip: '整列右对齐',
      ico: '<path d="M2.5 3.5h11M7 6.5h6.5M2.5 9.5h11M7 12.5h6.5"/>' },
    { sep: true },
    { act: 'tbl-del', tip: '删除整个表格',
      ico: '<path d="M3.2 4.6h9.6M6.2 4.6V3.2h3.6v1.4"/><path d="M4.4 4.6l.7 8.2h5.8l.7-8.2"/><path d="M6.6 7v3.6M9.4 7v3.6"/>' },
  ];

  const tblVisible = () => !$('tbl-bar').classList.contains('hidden');
  function tblSvg(inner) {
    return '<svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor"' +
      ' stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">' + inner + '</svg>';
  }

  function buildTableBar() {
    $('tbl-bar').innerHTML = TBL_BTNS.map((b) => (b.sep
      ? '<i class="tb-sep"></i>'
      : '<button type="button" data-act="' + b.act + '" title="' + b.tip + '" aria-label="' +
        b.tip + '">' + tblSvg(b.ico) + '</button>')).join('');
  }

  // 光标所在表格（IR 与 wysiwyg 都认）
  function tblFind(node) {
    const el = node && node.nodeType === 1 ? node : (node && node.parentElement);
    const cell = el && el.closest ? el.closest('td,th') : null;
    if (!cell) return null;
    const table = cell.closest('table');
    if (!table || !table.closest('.vditor-ir, .vditor-wysiwyg')) return null;
    return { table: table, row: cell.parentElement.rowIndex, col: cell.cellIndex };
  }

  const tblCols = (t) => (t.rows[0] ? t.rows[0].cells.length : 0);

  function tblHide() {
    const bar = $('tbl-bar');
    if (bar && !bar.classList.contains('hidden')) bar.classList.add('hidden');
    TBL.table = null;
    TBL.pane = null;
  }

  // 工具条能落脚的范围 = 当前窗格的可视区。只拿 window.innerWidth / innerHeight 判断会出事：
  // 双栏时 A 窗格右边紧挨着 B 窗格，表格把 A 吃满后「右侧还剩大半个窗口」，工具条就被甩到
  // 另一个窗格里压着别人的正文；窄屏上下堆叠时同理，往下挪一下就落进下面那栏。
  function tblRoom() {
    const host = TBL.pane && TBL.pane.el ? TBL.pane.el.host : null;
    const vw = window.innerWidth;
    const vh = window.innerHeight;
    const hr = host ? host.getBoundingClientRect() : null;
    // Vditor 会把 ir / wysiwyg / sv 三套 DOM 都铺在宿主里，非当前模式的那些是 display:none，
    // 宽度为 0。querySelector 只取文档里第一个，正好会踩到隐藏那套，所以挑可见的那个。
    const roots = host ? host.querySelectorAll('.vditor-ir .vditor-reset, .vditor-wysiwyg .vditor-reset') : [];
    let r = null;
    for (let i = 0; i < roots.length; i++) {
      const b = roots[i].getBoundingClientRect();
      if (b.width >= 80) { r = b; break; }
    }
    if (!r) {
      return { left: 8, right: vw - 8, top: 4, bottom: vh - 8 };
    }
    return {
      left: Math.round(r.left),
      right: Math.min(vw - 8, Math.round(r.right)),
      top: hr ? Math.max(0, Math.round(hr.top)) : 4,
      bottom: Math.min(vh - 8, hr ? Math.round(hr.bottom) : vh - 8),
    };
  }

  // 默认贴在表格右侧的空白处（不压任何字）；右边放不下才挪到表格下方，下方也放不下再放上方
  function tblPlace() {
    const bar = $('tbl-bar');
    const t = TBL.table;
    if (!t || !t.isConnected) { tblHide(); return; }
    // Vditor 给 IR 的 table 设了 display:block，盒子撑满整行，右边缘离内容很远；
    // 所以横向锚点取最后一个单元格的右边缘（表格横向滚动时不超过盒子）
    const box = t.getBoundingClientRect();
    const head = t.rows[0];
    const last = head && head.cells[head.cells.length - 1];
    const anchor = last ? last.getBoundingClientRect() : box;
    const right = Math.min(anchor.right, box.right);
    const top0 = last ? Math.min(anchor.top, box.top) : box.top;
    const bw = bar.offsetWidth || 190;
    const bh = bar.offsetHeight || 28;
    const room = tblRoom();

    let left = Math.round(right + 8);
    let top = Math.round(top0);
    // 右边缘对齐表格右边缘，但不许越出窗格；窗格比工具条还窄时才允许压左边
    const alignRight = Math.round(Math.max(room.left, Math.min(right - bw, room.right - bw)));
    if (left + bw > room.right) {
      // 表格已经把窗格宽度吃光（宽表格 / 双栏 / 窄屏）：右侧没位置，优先挪到表格下方，
      // 下方放不下才压到上方（上方往往是标题，遮住了最难看），两头都挤不开才贴在首行内
      left = alignRight;
      const below = Math.round(box.bottom + 6);
      const above = Math.round(top0 - bh - 6);
      if (below + bh <= room.bottom) top = below;
      else if (above >= room.top) top = above;
      else top = Math.round(Math.max(room.top, Math.min(top0, room.bottom - bh)));
    }
    bar.style.left = left + 'px';
    bar.style.top = top + 'px';
    if (RS && RS.t) tblRsPlace();
  }

  // 对齐按钮的按下态跟着当前列走
  function tblMarkAlign() {
    const bar = $('tbl-bar');
    const t = TBL.table;
    const head = t && t.rows[0] ? t.rows[0].cells[TBL.col] : null;
    const v = (head && head.getAttribute('align')) || 'left';
    ['left', 'center', 'right'].forEach((k) => {
      const b = bar.querySelector('[data-act="align-' + k + '"]');
      if (b) b.classList.toggle('on', v === k);
    });
  }

  // 每次选区变化跟着走：光标在表格里就亮，出去就收
  function tblSync() {
    const sel = window.getSelection();
    let hit = sel.rangeCount ? tblFind(sel.anchorNode) : null;
    if (!hit && sel.rangeCount) hit = tblFind(sel.focusNode);

    if (!hit || !PANES.a || !PANES.a.el) { tblHide(); return; }
    const pane = PANES.a.el.host.contains(hit.table) ? PANES.a
      : (PANES.b && PANES.b.el && PANES.b.el.host.contains(hit.table) ? PANES.b : null);
    if (!pane || !pane.note) { tblHide(); return; }

    // 同一格内打字（光标只是左右挪）就不必反复量布局，selectionchange 每次都来一次会很吵
    if (TBL.table === hit.table && TBL.row === hit.row && TBL.col === hit.col && tblVisible()) return;

    TBL.table = hit.table;
    TBL.row = hit.row;
    TBL.col = hit.col;
    TBL.pane = pane;
    $('tbl-bar').classList.remove('hidden');
    tblPlace();
    tblMarkAlign();
  }

  function tblCaret(t, row, col) {
    const tr = t.rows[row] || t.rows[t.rows.length - 1];
    if (!tr) return;
    const c = tr.cells[Math.min(col, tr.cells.length - 1)];
    if (!c) return;
    const r = document.createRange();
    r.selectNodeContents(c);
    r.collapse(true);
    const s = window.getSelection();
    s.removeAllRanges();
    s.addRange(r);
  }

  // 只有表头、没有数据行的表格，Lute 可能不给 tbody，得自己补一个
  function tblBody(t) {
    let tb = t.tBodies[0];
    if (!tb) { tb = document.createElement('tbody'); t.appendChild(tb); }
    return tb;
  }

  // 在下方加一行，返回新行的 rowIndex（失败 -1）
  function tblAddRow(t, row) {
    const tb = tblBody(t);
    const cols = tblCols(t);
    const tr = document.createElement('tr');
    for (let i = 0; i < cols; i++) {
      const td = document.createElement('td');
      const al = t.rows[0].cells[i] ? t.rows[0].cells[i].getAttribute('align') : null;
      if (al) td.setAttribute('align', al);      // 新列沿用表头对齐，免得整列歪掉
      td.innerHTML = '<br />';
      tr.appendChild(td);
    }
    const rows = Array.prototype.slice.call(tb.rows);
    if (!rows.length) { tb.appendChild(tr); return 1; }
    if (row <= 0) { tb.insertBefore(tr, rows[0]); return 1; }   // 光标在表头：插到第一行数据前
    const ref = rows[Math.min(row - 1, rows.length - 1)];
    ref.after(tr);
    return Math.min(row, rows.length) + 1;
  }

  function tblDelRow(t, row) {
    const tb = t.tBodies[0];
    if (!tb || tb.rows.length <= 1) return -1;    // 至少留一行数据，否则表格只剩表头
    const tr = t.rows[Math.max(row, 1)];
    if (!tr) return -1;
    tr.remove();
    return Math.min(Math.max(row, 1), tb.rows.length);
  }

  // col >= 0：插在该列右侧；col < 0：插到最左侧
  function tblAddCol(t, col) {
    const atLeft = col < 0;
    Array.prototype.forEach.call(t.rows, (tr) => {
      const isHead = tr.parentElement && tr.parentElement.tagName === 'THEAD';
      const src = tr.cells[atLeft ? 0 : Math.min(col, tr.cells.length - 1)];
      const c = document.createElement(isHead ? 'th' : 'td');
      const al = src && src.getAttribute('align');
      if (al) c.setAttribute('align', al);
      c.innerHTML = '<br />';
      if (!src) tr.appendChild(c);
      else if (atLeft) src.before(c);
      else src.after(c);
    });
  }

  function tblDelCol(t, col) {
    if (tblCols(t) <= 1) return false;
    Array.prototype.forEach.call(t.rows, (tr) => { if (tr.cells[col]) tr.cells[col].remove(); });
    return true;
  }

  function tblSetAlign(t, col, v) {
    Array.prototype.forEach.call(t.rows, (tr) => {
      const c = tr.cells[col];
      if (c) c.setAttribute('align', v);
    });
  }

  // 整张表删掉：直接 remove DOM 就够 —— IR 下 getValue() 是从 DOM 反解的，
  // 表格节点没了 Markdown 里对应的那块也就没了（实测不会留空段落）
  function tblDelete(t) {
    const parent = t.parentElement;
    if (!parent) return false;
    const prev = t.previousElementSibling;
    const next = t.nextElementSibling;
    t.remove();
    // 光标落到它后面的那块开头；后面没有就落到前面那块的末尾，别把光标丢在文档顶上
    const target = next || prev;
    if (target) {
      try {
        const r = document.createRange();
        if (next) { r.setStart(target, 0); r.collapse(true); }
        else { r.selectNodeContents(target); r.collapse(false); }
        const s = window.getSelection();
        s.removeAllRanges();
        s.addRange(r);
      } catch (err) { /* 结构怪就当没设光标，不影响删除 */ }
    }
    return true;
  }

  function tblRun(act) {
    const t = TBL.table;
    const p = TBL.pane;
    if (!t || !t.isConnected || !p) { tblHide(); return; }
    let row = TBL.row;
    let col = TBL.col;
    let fr = row;
    let fc = col;

    if (act === 'tbl-del') {
      const idx = tblIndexIn(p, t);
      if (!tblDelete(t)) return;
      markDirty(p);        // 删表格一定是内容变了，不必再比对 getValue
      // 这张表没了，它的尺寸记录跟着作废；后面的表格序号整体前移一位
      if (idx >= 0) tblSizeDrop(p, idx);
      tblHide();
      if (p.redecorate) p.redecorate();
      return;
    }

    // 删表格在上面单独处理，不用整篇反解一次（带大图的笔记 getValue 不便宜）
    const before = p.vd ? p.vd.getValue() : '';
    if (act === 'row-add') {
      fr = tblAddRow(t, row);
      if (fr < 0) return;
    } else if (act === 'row-add-above') {
      fr = tblAddRow(t, row - 1);          // 传 row-1 就是「插在这一行上面」
      if (fr < 0) return;
    } else if (act === 'row-del') {
      fr = tblDelRow(t, row);
      if (fr < 0) return;
    } else if (act === 'col-add') {
      tblAddCol(t, col);
      fc = col + 1;
    } else if (act === 'col-add-left') {
      tblAddCol(t, -1);
      fc = 0;
    } else if (act === 'col-del') {
      if (!tblDelCol(t, col)) return;
      fc = Math.max(0, col - 1);
    } else if (act === 'align-left') {
      tblSetAlign(t, col, 'left');
    } else if (act === 'align-center') {
      tblSetAlign(t, col, 'center');
    } else if (act === 'align-right') {
      tblSetAlign(t, col, 'right');
    } else {
      return;
    }

    TBL.row = fr;
    TBL.col = fc;
    tblCaret(t, fr, fc);
    // 工具栏那几个按钮（加粗、颜色）用的是 p.lastRange，这里顺便对齐一下
    const sel = window.getSelection();
    if (sel.rangeCount) p.lastRange = sel.getRangeAt(0).cloneRange();
    // 内容真变了才标脏；getValue() 从 DOM 反解，改过的表格自然进 Markdown
    if ((p.vd ? p.vd.getValue() : '') !== before) markDirty(p);
    // 结构变了，之前拖出来的宽高跟着改：加删列作废，加删行清行高（行号全错位）
    if (act === 'row-add' || act === 'row-add-above' || act === 'row-del') tblSizeAfterEdit(p, t, 'row');
    else if (act === 'col-add' || act === 'col-add-left' || act === 'col-del') tblSizeAfterEdit(p, t, 'col');
    tblPlace();
    tblMarkAlign();
  }

  // 窗格宽度一变（收/开侧栏、进出双栏），可用宽度就变了，工具条得跟着重新贴。
  // 这几种变化不动窗口尺寸，window 的 resize 收不到，所以盯窗格本身。
  // （表格本身的列宽是百分比，会自动跟着缩，不用在这里重算）
  let tblRO = null;
  const TBL_WATCHED = new Set();
  function tblWatch() {
    if (!window.ResizeObserver) return;
    if (!tblRO) tblRO = new ResizeObserver(() => {
      if (tblVisible()) tblPlace();
      if (RS && RS.t) tblRsPlace();
    });
    ['a', 'b'].forEach((k) => {
      const h = PANES[k] && PANES[k].el && PANES[k].el.host;
      if (h && !TBL_WATCHED.has(h)) { TBL_WATCHED.add(h); tblRO.observe(h); }
    });
  }

  function initTableUI() {
    buildTableBar();
    const bar = $('tbl-bar');
    // 点按钮别把编辑器选区抢走，否则下一次操作定位不到格子
    bar.addEventListener('mousedown', (e) => e.preventDefault());
    bar.addEventListener('click', (e) => {
      const b = e.target.closest ? e.target.closest('button[data-act]') : null;
      if (b) tblRun(b.dataset.act);
    });
    // 整表宽度手柄
    const rs = $('tbl-rs');
    if (rs) {
      rs.addEventListener('mousedown', tblRsDown);
      rs.addEventListener('dblclick', (e) => { e.preventDefault(); tblRsReset(); });
    }
    // 全局兜底：鼠标离开表格、又没扒在手柄上，就把手柄收掉。
    // 加了 `!RS.t` 的提前返回，没悬停在表格上时这条监听几乎不花钱
    document.addEventListener('mousemove', (e) => { if (RS.t) tblRsAway(e); }, true);
    // 滚动时表格位置会变，跟着重新贴；缩放直接收起（算起来不划算）
    document.addEventListener('scroll', () => {
      if (tblVisible()) tblPlace();
      if (RS.t) tblRsPlace();
    }, true);
    window.addEventListener('resize', () => { tblHide(); tblRsHide(); });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && tblVisible()) tblHide();
    });
    // 拖到一半窗口失焦（切标签、弹窗），mouseup 收不到，得自己收尾
    window.addEventListener('blur', () => {
      if (TDRAG) tblDragEnd();
      if (RDRAG) tblRsUp();
    });
    tblWatch();
  }

  /* ---------------- 表格尺寸：拖列宽 / 拖行高 ----------------
     Markdown 表格没有宽度语义。三条路都实测过：
       1. td.style.width  —— getMd() 输出仍是干净的 GFM，宽度整个丢掉（Lute 只按内容排）；
       2. 往表格里插 <colgroup> —— getMd() 直接把整张表吃掉（DOM 结构被改，反解不认）；
       3. 整块 HTML <table> —— Lute 原样透传，能带宽度，但 .md 不再是纯文本表格，
          旧版 index.html 的自研渲染器也认不了。
     所以取第四条：DOM 上用 inline style 生效（table-layout:fixed + 每列 width），
     数据存本机 settings 表（`tblsize:<笔记名>`），.md 一个字节都不动。
     代价是换机器/清缓存会丢样式（内容不丢）；好处是 ZIP、WebDAV、旧版全不受影响。 */
  const TBL_SIZES = new Map();       // 笔记名 -> { 表序号: { w:整表宽, cols:[列宽], rows:[行高] } }
  // 列宽下限按「含左右 padding 的目标宽」算：padding 合计 20px，给内容留 ~44px，
  // 再窄「08:20」这种值就只能一个字符一行地竖排了
  const TBL_MIN_COL = 64;
  const TBL_MIN_ROW = 26;
  const TBL_BOUND = new WeakSet();   // 已挂过拖拽监听的宿主，别重复挂
  let TDRAG = null;
  let TBL_HOVER_T = null;            // 当前挂着 resize 光标的表格

  const tblSizeKey = (p) => (p && p.note && p.note.name) ? String(p.note.name) : '';
  function tblSizeList(p) {                    // 取（必要时建）这篇笔记的表尺寸表
    const k = tblSizeKey(p);
    if (!k) return null;
    let v = TBL_SIZES.get(k);
    if (!v) { v = {}; TBL_SIZES.set(k, v); }
    return v;
  }
  // 取窗格里**可见的那套** .vditor-reset（IR / wysiwyg 两套 DOM 同时铺在宿主里，
  // 非当前模式那套 display:none、宽度 0，直接 querySelector 会踩到隐藏的）
  const tblRootOf = (p) => {
    if (!p || !p.el || !p.el.host) return null;
    const roots = p.el.host.querySelectorAll('.vditor-ir .vditor-reset, .vditor-wysiwyg .vditor-reset');
    for (let i = 0; i < roots.length; i++) {
      if (roots[i].getBoundingClientRect().width >= 80) return roots[i];
    }
    return p.el.host.querySelector('.vditor-ir .vditor-reset');
  };

  function tblSizeLoad(p) {
    const k = tblSizeKey(p);
    if (!k) return;
    if (TBL_SIZES.has(k)) { tblApplyAll(p); return; }
    Store.getSetting('tblsize:' + k, null).then((v) => {
      if (!TBL_SIZES.has(k)) TBL_SIZES.set(k, (v && typeof v === 'object') ? v : {});
      tblApplyAll(p);
    }).catch(() => { TBL_SIZES.set(k, {}); });
  }
  function tblSizeSave(p) {
    const k = tblSizeKey(p);
    const v = TBL_SIZES.get(k);
    if (!k || !v) return;
    clearTimeout(p._tsz);
    p._tsz = setTimeout(() => { try { Store.setSetting('tblsize:' + k, v); } catch {} }, 400);
  }

  // 笔记改名（普通笔记改标题即改名）后，尺寸得跟着换 key
  function tblSizeRename(from, to) {
    if (!from || !to || from === to) return;
    const v = TBL_SIZES.get(from);
    if (!v) return;
    TBL_SIZES.delete(from);
    TBL_SIZES.set(to, v);
    try { Store.setSetting('tblsize:' + to, v); Store.setSetting('tblsize:' + from, null); } catch {}
  }

  // 正文可用宽度（扣掉左右 padding）：拖动时把列宽归一化到它，表格才刚好占满一行
  function tblAvail(t) {
    const root = t && t.closest ? t.closest('.vditor-reset') : null;
    if (!root) return 0;
    const cs = getComputedStyle(root);
    return Math.max(0, Math.round(root.clientWidth
      - (parseFloat(cs.paddingLeft) || 0) - (parseFloat(cs.paddingRight) || 0)));
  }

  // 整表宽度下限：再窄连表头都放不下，拖到这儿就停
  const TBL_MIN_W = 160;
  // 默认宽度 = 正文可用宽的一半。表格默认铺满整行读起来不像是「一块表格」，而且没法把
  // 两张表并排看；半个正文宽更像文档里的插图，需要更宽就拖右下角手柄。
  const TBL_DEF_W = 0.5;

  // 只对「表格 DOM 被 Lute 重建过」或「需求值变了」的情况重套：dataset 指纹一样就直接跳过，
  // 别每次打字都写 style
  function tblApplyAll(p) {
    const root = tblRootOf(p);
    if (!root) return;
    const map = TBL_SIZES.get(tblSizeKey(p)) || null;
    const list = root.querySelectorAll('table');
    for (let i = 0; i < list.length; i++) tblApplyOne(list[i], map ? map[i] : null);
  }

  function tblApplyOne(t, spec) {
    const avail = tblAvail(t);
    // 指纹里带上可用宽度：缩窗口 / 进双栏后整表宽度和分列都要按新宽度重算
    const fp = (spec ? JSON.stringify(spec) : '') + '@' + avail;
    if (t.dataset.tblsz === fp) return;
    t.dataset.tblsz = fp;
    const cols = (spec && spec.cols && spec.cols.length) ? spec.cols : null;
    const rows = (spec && spec.rows) || [];
    const n = t.rows[0] ? t.rows[0].cells.length : 0;
    let total = 0;
    if (cols) for (let i = 0; i < n; i++) { if (cols[i] > 0) total += cols[i]; }

    // 先松绑再量：上一次留下的 fixed 列宽会把自然宽度带偏
    t.style.tableLayout = '';
    for (let ri = 0; ri < t.rows.length; ri++) {
      for (let i = 0; i < t.rows[ri].cells.length; i++) {
        t.rows[ri].cells[i].style.width = '';
        t.rows[ri].cells[i].style.minWidth = '';
      }
    }

    // 整表宽度：拖过就按存下来的 px（夹在 [下限, 正文宽]）；没拖过用默认值。
    // 默认「正文的一半」，但表格自己就装不下时按内容宽 —— 双栏 / 窄窗格里 50% 只剩
    // 两百来像素，四列表格每列一个汉字，竖排着读根本没法看。先把宽度松成 auto 量一次
    // 自然宽，再取两者的大者（同一个同步块里量完就写回，屏上不会闪）
    let boxW = 0;
    if (spec && spec.w > 0) {
      boxW = Math.max(TBL_MIN_W, Math.min(avail || Math.round(spec.w), Math.round(spec.w)));
      t.style.width = boxW + 'px';
    } else if (avail > 0) {
      t.style.width = 'auto';
      const nat = t.getBoundingClientRect().width;
      boxW = Math.round(Math.min(avail, Math.max(avail * TBL_DEF_W, nat)));
      t.style.width = boxW >= avail - 1 ? '100%' : boxW + 'px';
    } else {
      t.style.width = '';
      boxW = Math.round(t.getBoundingClientRect().width);
    }
    t.style.maxWidth = '100%';

    // 列宽分配：fixed 布局 + px 列宽。
    // 不用百分比 —— fixed 布局下 Chromium 把 td 的 width 当**内容宽**算，再叠上左右 padding，
    // 四列表格平白多出 80px（实测设 500 会渲成 577）。所以这里按「目标宽 - padding」写 px。
    const fixed = !!(cols && total > 0 && boxW > 0);
    t.style.tableLayout = fixed ? 'fixed' : '';
    let padX = 0;
    if (fixed) {
      const c0 = t.rows[0] && t.rows[0].cells[0];
      if (c0) {
        const cs = getComputedStyle(c0);
        padX = (parseFloat(cs.paddingLeft) || 0) + (parseFloat(cs.paddingRight) || 0);
      }
    }
    for (let ri = 0; ri < t.rows.length; ri++) {
      const tr = t.rows[ri];
      tr.style.height = rows[ri] > 0 ? rows[ri] + 'px' : '';
      if (!fixed) continue;
      let used = 0;
      for (let i = 0; i < tr.cells.length; i++) {
        const share = cols[i] > 0 ? cols[i] / total : 0;
        const w = i === tr.cells.length - 1 ? Math.max(1, boxW - used) : Math.max(1, Math.round(share * boxW));
        used += w;
        tr.cells[i].style.width = Math.max(1, w - padX) + 'px';
      }
    }
  }

  const tblColsMeasure = (t) => (t.rows[0] ? [...t.rows[0].cells].map((c) => Math.round(c.getBoundingClientRect().width)) : []);
  const tblRowsMeasure = (t) => [...t.rows].map((r) => Math.round(r.getBoundingClientRect().height));

  // 命中表头某一列的右边界 → 拖列宽；命中某行下边界 → 拖行高
  function tblHit(t, x, y) {
    const box = t.getBoundingClientRect();
    if (y < box.top - 2 || y > box.bottom + 2) return null;
    const head = t.rows[0];
    if (head) {
      for (let i = 0; i < head.cells.length; i++) {
        const r = head.cells[i].getBoundingClientRect();
        if (Math.abs(x - r.right) <= 4) return { kind: 'col', i: i };
      }
    }
    for (let i = 0; i < t.rows.length; i++) {
      const r = t.rows[i].getBoundingClientRect();
      if (Math.abs(y - r.bottom) <= 3 && x >= r.left - 2 && x <= r.right + 2) return { kind: 'row', i: i };
    }
    return null;
  }
  const tblTableAt = (node) => (node && node.closest ? node.closest('table') : null);

  function tblHover(e, p) {
    if (TDRAG || RDRAG) return;
    const root = tblRootOf(p);
    let t = tblTableAt(e.target);
    // 鼠标从表格挪到右下角手柄上时，target 已经不是表格了（手柄挂在 body 下），
    // 这里退回上一次悬停的表格，否则手柄刚碰到就自己消失
    if (!t && TBL_HOVER_T && TBL_HOVER_T.isConnected) t = TBL_HOVER_T;
    if (!t || !root || !root.contains(t)) {
      tblCursorOff();
      return;
    }
    TBL_HOVER_T = t;
    const box = t.getBoundingClientRect();
    const rs = $('tbl-rs');
    const rr = (rs && rs.classList.contains('on')) ? rs.getBoundingClientRect() : null;
    const onHandle = !!rr && e.clientX >= rr.left - 3 && e.clientX <= rr.right + 3
      && e.clientY >= rr.top - 3 && e.clientY <= rr.bottom + 3;
    // 贴着表格（外扩 10px）或已经扒在手柄上，就亮出宽度手柄
    const near = e.clientX >= box.left - 10 && e.clientX <= box.right + 10
      && e.clientY >= box.top - 10 && e.clientY <= box.bottom + 10;
    if (near || onHandle) {
      if (RS.t !== t || !(rs && rs.classList.contains('on'))) tblRsShow(t, p);
    } else if (RS.t) {
      tblRsHide();
    }
    const hit = tblHit(t, e.clientX, e.clientY);
    const cur = hit ? (hit.kind === 'col' ? 'col-resize' : 'row-resize') : '';
    if (t.style.cursor !== cur) t.style.cursor = cur;
  }

  // 鼠标离开表格/窗格时把 resize 光标摘掉，否则整个表格的正文都挂着 col-resize。
  // 手柄不在这里收 —— 手柄挂在 body 下，鼠标挪过去的过程中会先触发 host 的 mouseleave，
  // 在这里收掉就等于「刚碰到就消失」。手柄的显隐交给全局那条 mousemove 判定
  function tblCursorOff() {
    if (TBL_HOVER_T && TBL_HOVER_T.isConnected) TBL_HOVER_T.style.cursor = '';
    TBL_HOVER_T = null;
  }

  // 手柄该不该收：鼠标既不在表格附近、也不在手柄上
  function tblRsAway(e) {
    if (!RS.t || RDRAG || !RS.t.isConnected) return;
    const t = RS.t.getBoundingClientRect();
    const nearT = e.clientX >= t.left - 10 && e.clientX <= t.right + 10
      && e.clientY >= t.top - 10 && e.clientY <= t.bottom + 10;
    if (nearT) return;
    const rs = $('tbl-rs');
    const r = rs ? rs.getBoundingClientRect() : null;
    const onH = !!r && e.clientX >= r.left - 6 && e.clientX <= r.right + 6
      && e.clientY >= r.top - 6 && e.clientY <= r.bottom + 6;
    if (!onH) tblRsHide();
  }

  function tblIndexIn(p, t) {
    const root = tblRootOf(p);
    if (!root) return -1;
    return [...root.querySelectorAll('table')].indexOf(t);
  }

  function tblDragStart(e, p) {
    const t = tblTableAt(e.target);
    const root = tblRootOf(p);
    if (!t || !root || !root.contains(t)) return false;
    const hit = tblHit(t, e.clientX, e.clientY);
    if (!hit) return false;
    const idx = tblIndexIn(p, t);
    const map = tblSizeList(p);
    if (idx < 0 || !map) return false;
    e.preventDefault();
    e.stopPropagation();
    const spec = map[idx] || {};
    // 列宽统一换算成「整表 px」的份额：拖动时按 px 分配、落到 DOM 上换成百分比。
    // 归一化的目标是表格**当前实际宽度**，不是正文宽 —— 表格默认只有一半宽，
    // 按正文宽归一化会一按下去就跳（列宽凭空放大一倍）
    let baseCols = tblColsMeasure(t);
    const tw = Math.round(t.getBoundingClientRect().width);
    const sum0 = baseCols.reduce((s, v) => s + (v > 0 ? v : 0), 0);
    if (sum0 > 0 && tw > 40 && Math.abs(sum0 - tw) > 1) {
      baseCols = baseCols.map((w) => Math.max(1, Math.round((w * tw) / sum0)));
    }
    TDRAG = {
      t: t, p: p, idx: idx, kind: hit.kind, i: hit.i,
      x: e.clientX, y: e.clientY,
      baseCols: baseCols, baseRows: tblRowsMeasure(t),
      cols: baseCols.slice(),
      rows: spec.rows ? spec.rows.slice() : [],
      w: spec.w > 0 ? spec.w : 0,
      moved: false,
    };
    // 这里**不写 spec、也不改样式**。按下鼠标但没拖（想点格子、或者双击复位）时，
    // 一旦在这里把 auto 布局钉成 fixed + 精算列宽，列宽会莫名跳几像素，
    // 双击复位的判定坐标也跟着失效。真正移动了才落地，见 tblDragMove
    document.addEventListener('mousemove', tblDragMove, true);
    document.addEventListener('mouseup', tblDragEnd, true);
    document.body.classList.add('tbl-resizing');
    document.body.style.cursor = hit.kind === 'col' ? 'col-resize' : 'row-resize';
    return true;
  }

  function tblDragMove(e) {
    const d = TDRAG;
    if (!d) return;
    if (!d.t.isConnected) { tblDragEnd(); return; }
    e.preventDefault();
    d.moved = true;
    if (d.kind === 'col') {
      const i = Math.min(d.i, d.baseCols.length - 1);
      if (i < 0) return;
      const n = d.baseCols.length;
      const cols = d.baseCols.slice();
      // 表格总宽不变（就是当前这个宽度），拖宽某列时多出来的宽度从相邻列扣：
      // 先往右借（最像一个分隔条在推），右边都到下限了再往左借；借不动就停在原地。
      // 想改总宽用右下角手柄，两件事分开，互不干扰
      const delta = Math.round(e.clientX - d.x);
      if (delta > 0) {
        let need = delta;
        const order = [];
        for (let k = i + 1; k < n; k++) order.push(k);
        for (let k = i - 1; k >= 0; k--) order.push(k);
        for (let oi = 0; oi < order.length && need > 0; oi++) {
          const k = order[oi];
          const take = Math.min(need, cols[k] - TBL_MIN_COL);
          if (take > 0) { cols[k] -= take; need -= take; }
        }
        cols[i] += delta - need;
      } else if (delta < 0) {
        // 变窄：省下的宽度补给右邻居（没有就补左邻居），别在表格右边留一块空白
        const give = Math.min(-delta, cols[i] - TBL_MIN_COL);
        cols[i] -= give;
        const k = (i + 1 < n) ? i + 1 : (i - 1);
        if (give > 0 && k >= 0) cols[k] += give;
      }
      d.cols = cols;
    } else {
      const i = Math.min(d.i, d.baseRows.length - 1);
      if (i < 0) return;
      d.rows[i] = Math.round(Math.max(TBL_MIN_ROW, d.baseRows[i] + (e.clientY - d.y)));
    }
    const map = tblSizeList(d.p);
    if (!map) return;
    const sp = map[d.idx] || {};
    // 第一次真正移动时才把 auto 布局钉成 fixed：baseCols 是当时量的实测宽度，
    // 直接当成「整表 px 份额」用，换算回去和眼前的列宽一一对上。
    // 拖行高时**沿用已有的列宽分配**，不拿实测值重算 —— fixed 布局的换算有 ±10px 的
    // 舍入差，每拖一次行高就重算一次的话，列宽会一点点飘走
    const colsFor = d.kind === 'col' ? d.cols.slice()
      : (sp.cols && sp.cols.length ? sp.cols.slice() : []);
    map[d.idx] = { w: sp.w > 0 ? sp.w : (d.w > 0 ? d.w : 0), cols: colsFor, rows: d.rows.slice() };
    tblApplyOne(d.t, map[d.idx]);
  }

  function tblDragEnd() {
    const d = TDRAG;
    if (!d) return;
    TDRAG = null;
    document.removeEventListener('mousemove', tblDragMove, true);
    document.removeEventListener('mouseup', tblDragEnd, true);
    document.body.classList.remove('tbl-resizing');
    document.body.style.cursor = '';
    if (d.t.isConnected) d.t.style.cursor = '';
    if (d.moved) tblSizeSave(d.p);   // 只动样式，不 markDirty：笔记内容没变；没拖过就不存
  }

  /* ---------------- 整表宽度：拖右下角手柄 ----------------
     列宽拖的是列与列之间的分隔、行高拖的是行下边界，都能连成一条线；
     整表宽度没有这样一条天然的边界（表格右边缘 = 最后一列的右边缘，跟列宽撞），
     所以在右下角挂一个小方块当把手，三个操作互不打架。
     宽度同样是本机视图样式（Markdown 存不下），存进同一份 spec 的 w 字段。 */
  let RS = { t: null, p: null };     // 手柄当前对应的表格 / 窗格
  let RDRAG = null;

  function tblRsPlace() {
    const rs = $('tbl-rs');
    if (!rs) return;
    const t = RS.t;
    if (!t || !t.isConnected) { tblRsHide(); return; }
    const box = t.getBoundingClientRect();
    const room = tblRoom();
    // 表格底边滚出视口时把手柄贴到视口底部，否则用户永远够不到它
    const bottom = Math.min(box.bottom, room.bottom);
    rs.style.left = Math.round(Math.min(box.right, room.right) - 5) + 'px';
    rs.style.top = Math.round(bottom - 5) + 'px';
  }

  function tblRsShow(t, p) {
    RS.t = t;
    RS.p = p;
    const rs = $('tbl-rs');
    if (!rs) return;
    rs.classList.add('on');
    tblRsPlace();
  }

  function tblRsHide() {
    const rs = $('tbl-rs');
    if (rs) { rs.classList.remove('on'); rs.classList.remove('dragging'); }
    RS.t = null;
    RS.p = null;
  }

  function tblRsDown(e) {
    const t = RS.t;
    const p = RS.p;
    if (!t || !p || !t.isConnected || !p.note) return;
    const idx = tblIndexIn(p, t);
    if (idx < 0 || !tblSizeList(p)) return;
    e.preventDefault();
    e.stopPropagation();
    RDRAG = { t: t, p: p, idx: idx, x: e.clientX, w0: Math.round(t.getBoundingClientRect().width) };
    const rs = $('tbl-rs');
    if (rs) rs.classList.add('dragging');
    document.addEventListener('mousemove', tblRsMove, true);
    document.addEventListener('mouseup', tblRsUp, true);
    document.body.classList.add('tbl-resizing');
    document.body.style.cursor = 'nwse-resize';
  }

  function tblRsMove(e) {
    const d = RDRAG;
    if (!d) return;
    if (!d.t.isConnected) { tblRsUp(); return; }
    e.preventDefault();
    // 上限是正文可用宽（表格不许捅出编辑器），下限是 TBL_MIN_W
    const avail = tblAvail(d.t) || 0;
    let w = Math.round(d.w0 + (e.clientX - d.x));
    if (avail > 0) w = Math.min(w, avail);
    w = Math.max(TBL_MIN_W, w);
    const map = tblSizeList(d.p);
    if (!map) return;
    const sp = map[d.idx] || { cols: [], rows: [] };
    sp.w = w;
    map[d.idx] = sp;
    tblApplyOne(d.t, sp);
    tblRsPlace();
    if (tblVisible()) tblPlace();
  }

  function tblRsUp() {
    const d = RDRAG;
    if (!d) return;
    RDRAG = null;
    document.removeEventListener('mousemove', tblRsMove, true);
    document.removeEventListener('mouseup', tblRsUp, true);
    document.body.classList.remove('tbl-resizing');
    document.body.style.cursor = '';
    const rs = $('tbl-rs');
    if (rs) rs.classList.remove('dragging');
    tblSizeSave(d.p);
  }

  // 双击手柄 = 这张表回到默认宽度（正文一半）；列宽/行高不动
  function tblRsReset() {
    const t = RS.t;
    const p = RS.p;
    if (!t || !p || !t.isConnected) return;
    const idx = tblIndexIn(p, t);
    const map = tblSizeList(p);
    if (idx < 0 || !map || !map[idx]) return;
    const sp = map[idx];
    delete sp.w;
    if (!(sp.cols && sp.cols.length) && !(sp.rows && sp.rows.length)) delete map[idx];
    tblApplyOne(t, map[idx] || null);
    tblSizeSave(p);
    tblRsPlace();
    if (tblVisible()) tblPlace();
  }

  // 双击列/行边界 = 这张表恢复自动布局（列宽、行高清掉；整表宽度留着，
  // 那是「表格多大」而不是「怎么排」，要单独改请双击右下角手柄）
  function tblSizeReset(e, p) {
    const t = tblTableAt(e.target);
    if (!t) return;
    if (!tblHit(t, e.clientX, e.clientY)) return;
    const idx = tblIndexIn(p, t);
    const map = tblSizeList(p);
    if (idx < 0 || !map || !map[idx]) return;
    e.preventDefault();
    const keepW = map[idx].w > 0 ? map[idx].w : 0;
    if (keepW) map[idx] = { w: keepW, cols: [], rows: [] };
    else delete map[idx];
    tblApplyOne(t, keepW ? map[idx] : null);
    tblSizeSave(p);
  }

  // 拖宽/拖高之后表格结构变了（加删行/列），尺寸得跟着调整或作废
  function tblSizeAfterEdit(p, t, act) {
    const idx = tblIndexIn(p, t);
    const map = tblSizeList(p);
    if (idx < 0 || !map || !map[idx]) return;
    // 加删列只让「列宽分配」失效，整表宽度是另一回事，得留着
    if (act === 'col') map[idx].cols = [];
    else if (act === 'row') map[idx].rows = [];    // 行号全错位，干脆清掉行高
    if (!map[idx].cols.length && !map[idx].rows.length && !(map[idx].w > 0)) delete map[idx];
    tblApplyOne(t, map[idx] || null);
    tblSizeSave(p);
  }

  // 表格被删掉：这张表的记录作废，它后面那些表格的序号整体前移一位
  function tblSizeDrop(p, idx) {
    const k = tblSizeKey(p);
    const map = TBL_SIZES.get(k);
    if (!map) return;
    const out = {};
    Object.keys(map).forEach((key) => {
      const n = +key;
      if (n === idx) return;
      out[n > idx ? n - 1 : n] = map[key];
    });
    TBL_SIZES.set(k, out);
    tblSizeSave(p);
  }

  function tblBindPane(p) {
    const host = p && p.el && p.el.host;
    if (!host || TBL_BOUND.has(host)) return;
    TBL_BOUND.add(host);
    host.addEventListener('mousemove', (e) => tblHover(e, p));
    host.addEventListener('mouseleave', () => tblCursorOff());    // 捕获阶段拦：命中边界要抢在 Vditor 处理选区之前，否则一点就先把光标放进格子
    host.addEventListener('mousedown', (e) => {
      if (e.button !== 0 || e.ctrlKey || e.metaKey || e.altKey) return;
      if (e.detail > 1) return;                    // 双击交给 dblclick
      tblDragStart(e, p);
    }, true);
    host.addEventListener('dblclick', (e) => tblSizeReset(e, p));
  }

  /* ---------------- 图片 / 截图 ---------------- */
  // 图片内联进 Markdown：![](data:image/webp;base64,…)
  // 不搞「blob 存 IndexedDB、正文只留一个 id」那套：笔记得能单文件拷走、ZIP 导出、WebDAV 同步，
  // 图片必须跟着 .md 一起走，而这套离线应用也没有服务端可传。
  // 代价是体积，所以插入前统一压一道：最长边 1600、WebP。实测一张 2720×1800 的界面截图，
  // 原始 PNG 直接 base64 是 197KB，压完约 45KB；小图（≤100KB 且不用缩）原样保留，免得白损一次画质。
  const IMG_MAX_W = 1600;
  const IMG_KEEP_BYTES = 100 * 1024;
  const IMG_MAX_CHARS = 900 * 1024;                 // 单张 data URL 的字符上限
  const IMG_RAW_RE = /^image\/(gif|svg\+xml)$/i;    // GIF 重编码丢动画，SVG 是矢量，都别动

  /* 编辑器里不放 base64，放 blob: 短链。
     为什么必须这么做：Vditor 的 IR 会把 ![](…) 原文整串塞进一个 html-inline 标记节点的
     textContent 里。一张截图压完还有几十万字符，于是每次按键 —— Lute 反解这段 Markdown、
     我们算光标偏移时 Range.toString() 复制整篇文本 —— 都要搬一遍这串字符。
     实测 4MB 的图：3.8ms/键 → 246ms/键，三张图 623ms/键。
     换法：加载时把 data URI 换成 Blob 的 objectURL（约 60 字符），存盘前再换回来。
     落盘的 .md 一个字节都没变，旧版、ZIP、WebDAV 都照常。
     这些 objectURL 全程不 revoke：撤回栈里可能还攥着旧快照，一 revoke 撤回就丢图，
     宁可让浏览器在页面关闭时统一回收。 */
  const IMG_OBJ = new Map();   // objectURL -> data URI
  const IMG_REV = new Map();   // data URI -> objectURL（同一张图只建一次 blob）
  const IMG_DATA_RE = /!\[([^\]\n]*)\]\(\s*(data:image\/[a-z0-9.+-]+;base64,[A-Za-z0-9+/=]+)\s*\)/gi;
  const IMG_SRC_RE = /(\bsrc=["'])(data:image\/[a-z0-9.+-]+;base64,[A-Za-z0-9+/=]+)/gi;
  const IMG_BLOB_RE = /blob:[^\s)"']+/g;

  function dataUriToObjectUrl(uri) {
    if (!uri || uri.indexOf('data:image/') !== 0) return uri;
    const hit = IMG_REV.get(uri);
    if (hit) return hit;
    let url = '';
    try {
      const comma = uri.indexOf(',');
      const type = uri.slice(5, comma).split(';')[0] || 'image/png';
      const bin = atob(uri.slice(comma + 1));
      const u8 = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
      url = URL.createObjectURL(new Blob([u8], { type: type }));
    } catch (e) {
      return uri;                       // 解不开就原样用，宁可卡一点也别丢图
    }
    IMG_OBJ.set(url, uri);
    IMG_REV.set(uri, url);
    return url;
  }
  // 进编辑器：data URI → objectURL
  function mdForEditor(md) {
    md = md || '';
    if (md.indexOf('data:image/') < 0) return md;
    return md
      .replace(IMG_DATA_RE, (all, alt, uri) => '![' + alt + '](' + dataUriToObjectUrl(uri) + ')')
      .replace(IMG_SRC_RE, (all, pre, uri) => pre + dataUriToObjectUrl(uri));
  }
  // 出编辑器（存盘 / 导出 / 比对）：objectURL → data URI
  function mdForStore(md) {
    md = md || '';
    if (md.indexOf('blob:') < 0) return md;
    return md.replace(IMG_BLOB_RE, (u) => IMG_OBJ.get(u) || u);
  }

  function fileToDataUrl(file) {
    return new Promise((resolve) => {
      const fr = new FileReader();
      fr.onload = () => resolve(String(fr.result || ''));
      fr.onerror = () => resolve('');
      fr.readAsDataURL(file);
    });
  }

  function loadImage(file) {
    return new Promise((resolve) => {
      const url = URL.createObjectURL(file);
      const im = new Image();
      im.onload = () => resolve({ im, url });
      im.onerror = () => { URL.revokeObjectURL(url); resolve(null); };
      im.src = url;
    });
  }

  async function shrinkImage(file) {
    if (!file || !/^image\//i.test(file.type || '')) return '';
    if (IMG_RAW_RE.test(file.type)) return fileToDataUrl(file);
    const loaded = await loadImage(file);
    if (!loaded) return fileToDataUrl(file);
    const { im, url } = loaded;
    const nw = im.naturalWidth || 1, nh = im.naturalHeight || 1;
    const scale = Math.min(1, IMG_MAX_W / Math.max(nw, nh));
    if (scale === 1 && file.size <= IMG_KEEP_BYTES) {
      URL.revokeObjectURL(url);
      return fileToDataUrl(file);
    }
    const cv = document.createElement('canvas');
    cv.width = Math.max(1, Math.round(nw * scale));
    cv.height = Math.max(1, Math.round(nh * scale));
    const g = cv.getContext('2d');
    if (file.type !== 'image/jpeg') { g.clearRect(0, 0, cv.width, cv.height); }
    g.drawImage(im, 0, 0, cv.width, cv.height);
    URL.revokeObjectURL(url);
    let out = cv.toDataURL('image/webp', 0.86);
    const webp = out.indexOf('data:image/webp') === 0;
    if (!webp) out = cv.toDataURL('image/jpeg', 0.86);   // 不支持 WebP 的浏览器
    if (out.length > IMG_MAX_CHARS) {
      // 还是太大就等比缩到上限内再压一次：截图文字多，先缩尺寸比降质量好看
      const k = Math.sqrt(IMG_MAX_CHARS / out.length);
      const cv2 = document.createElement('canvas');
      cv2.width = Math.max(1, Math.round(cv.width * k));
      cv2.height = Math.max(1, Math.round(cv.height * k));
      cv2.getContext('2d').drawImage(cv, 0, 0, cv2.width, cv2.height);
      out = webp ? cv2.toDataURL('image/webp', 0.8) : cv2.toDataURL('image/jpeg', 0.8);
    }
    return out;
  }

  const kbText = (n) => (n < 1024 ? n + ' B' : Math.round(n / 1024) + ' KB');

  // 事件发生在哪个窗格的编辑器里（拖到侧栏的情况落回当前窗格）
  function paneAtNode(node) {
    for (let i = 0; i < 2; i++) {
      const p = PANES[i === 0 ? 'a' : 'b'];
      if (p && p.el && p.el.host && node && p.el.host.contains(node)) return p;
    }
    return null;
  }

  // 点图片之后该把光标放哪：图片独占一段，后面那行空段落才是接着写字的地方。
  // 停在图片段末尾的话，文字会挤在图片右侧（IR 里 img 是行内元素，会并排走）
  function caretAfterImage(img) {
    const block = img.closest('p,li,td,th,blockquote,h1,h2,h3,h4,h5,h6') || img.parentNode;
    if (!block) return null;
    let target = block;
    const next = block.nextElementSibling;
    if (block.tagName === 'P' && next && next.tagName === 'P' && !next.textContent.trim()) target = next;
    const r = document.createRange();
    r.selectNodeContents(target);
    r.collapse(target === block ? false : true);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(r);
    return r;
  }

  function insertImage(p, url) {
    p = p || curPane();
    if (!p || !p.vd || !url) return false;
    const sel = window.getSelection();
    const live = sel && sel.rangeCount && p.el.host.contains(sel.getRangeAt(0).startContainer);
    p.vd.focus();
    if (!live) {
      // 从工具栏按钮点下来的：焦点已经不在正文，用记下来的最后选区
      const r = p.lastRange && p.lastRange.startContainer && p.lastRange.startContainer.isConnected
        ? p.lastRange : null;
      if (r) { sel.removeAllRanges(); sel.addRange(r); }
    }
    // 前后各空一行：图片自己占一段，后面留一个空段落接着打字
    // 插入的是 objectURL，getMd() 存盘时会换回 data URI
    p.vd.insertValue('\n\n![](' + dataUriToObjectUrl(url) + ')\n\n', true);
    if (p.redecorate) p.redecorate();
    markDirty(p);
    return true;
  }

  let imgBusy = false;
  let imgPickPane = null;

  async function acceptImageFiles(files, p) {
    p = p || curPane();
    const list = Array.prototype.slice.call(files || [])
      .filter((f) => f && /^image\//i.test(f.type || ''));
    if (!list.length || imgBusy) return 0;
    imgBusy = true;
    status('正在处理图片…');
    let n = 0, chars = 0;
    try {
      for (const f of list) {
        const url = await shrinkImage(f);
        if (!url) continue;
        if (insertImage(p, url)) { n++; chars += url.length; }
      }
    } finally {
      imgBusy = false;
    }
    if (!n) status('图片读取失败，换一张试试');
    else if (n === 1) status('已插入图片 · ' + kbText(chars));
    else status('已插入 ' + n + ' 张图片 · ' + kbText(chars));
    return n;
  }

  function imageFilesFrom(ev) {
    const dt = ev.clipboardData || ev.dataTransfer;
    if (!dt) return [];
    const isImg = (o) => o && /^image\//i.test(o.type || '');
    if (dt.files && dt.files.length) return Array.prototype.slice.call(dt.files).filter(isImg);
    if (dt.items && dt.items.length) {
      return Array.prototype.slice.call(dt.items)
        .filter((it) => it.kind === 'file' && /^image\//i.test(it.type || ''))
        .map((it) => { try { return it.getAsFile(); } catch (e) { return null; } })
        .filter(isImg);
    }
    return [];
  }

  function pickImage(p) {
    let input = document.getElementById('img-file');
    if (!input) {
      input = document.createElement('input');
      input.type = 'file';
      input.accept = 'image/*';
      input.multiple = true;
      input.id = 'img-file';
      input.style.display = 'none';
      input.addEventListener('change', () => {
        const fs = input.files;
        input.value = '';
        acceptImageFiles(fs, imgPickPane || curPane());
      });
      document.body.appendChild(input);
    }
    imgPickPane = p || curPane();
    input.value = '';
    input.click();
  }

  // 粘贴 / 拖入都从这里进，用 document 捕获阶段先拦下来：
  // Vditor 默认会把原图直接转成 base64 塞进正文（一张截图 200KB 起），笔记很快就没法同步了
  function initImageUI() {
    document.addEventListener('paste', (ev) => {
      const files = imageFilesFrom(ev);
      if (!files.length) return;
      ev.preventDefault();
      ev.stopPropagation();
      acceptImageFiles(files, paneAtNode(ev.target) || curPane());
    }, true);

    const over = (ev) => {
      if (!imageFilesFrom(ev).length) return;
      ev.preventDefault();
      ev.stopPropagation();
      if (ev.dataTransfer) ev.dataTransfer.dropEffect = 'copy';
    };
    document.addEventListener('dragenter', over, true);
    document.addEventListener('dragover', over, true);
    document.addEventListener('drop', (ev) => {
      const files = imageFilesFrom(ev);
      if (!files.length) return;
      ev.preventDefault();
      ev.stopPropagation();
      acceptImageFiles(files, paneAtNode(ev.target) || curPane());
    }, true);
  }

  function initWikiUI() {
    const q = $('wiki-q');
    q.addEventListener('input', () => renderWikiList());
    // 持续记录每个窗格的光标：点工具栏按钮时浏览器可能先把选区清掉，
    // 只靠点击那一刻去读会拿不到位置（结果就是插到文首）
    document.addEventListener('selectionchange', () => {
      tblSync();                     // 光标签进表格就亮出表格工具条
      if (!$('wiki-pop').classList.contains('hidden')) return;
      const sel = window.getSelection();
      if (!sel.rangeCount) return;
      const r = sel.getRangeAt(0);
      if (!r.startContainer) return;
      ['a', 'b'].forEach((k) => {
        const p = PANES[k];
        if (p && p.el.host.contains(r.startContainer)) p.lastRange = r.cloneRange();
      });
    });
    q.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowDown') { e.preventDefault(); moveWikiIdx(1); return; }
      if (e.key === 'ArrowUp') { e.preventDefault(); moveWikiIdx(-1); return; }
      if (e.key === 'Enter') {
        e.preventDefault();
        const it = wikiList[wikiIdx];
        applyWiki(it ? it.name : q.value);
        return;
      }
      if (e.key === 'Escape') { e.preventDefault(); closeWikiPop(); }
    });
    // 点面板外面收起面板；点工具栏那个按钮交给 toggleWikiPop，不在这里关
    document.addEventListener('mousedown', (e) => {
      if ($('wiki-pop').classList.contains('hidden')) return;
      const tg = e.target;
      if (tg && tg.closest && (tg.closest('#wiki-pop') || tg.closest('[data-type="wiki"]'))) return;
      closeWikiPop();
    });
    // 预览面板里的双链 chip 也能点
    document.addEventListener('click', (e) => {
      const tg = e.target;
      const a = tg && tg.closest ? tg.closest('a.wiki-link[data-wiki]') : null;
      if (!a) return;
      e.preventDefault();
      openWikiTarget(a.dataset.wiki, curPane());
    });
    window.addEventListener('resize', () => {
      if (!$('wiki-pop').classList.contains('hidden')) positionWikiPop();
    });
  }

  /* ---------------- 笔记打开 / 保存 ---------------- */
  // 正在某个窗格里编辑的笔记以编辑器内容为准，避免收藏/改名时用旧内容覆盖
  function liveContent(note) {
    const p = paneOfNote(note);
    return p ? getMd(p) : (note.content || '');
  }
  function liveName(note) {
    const p = paneOfNote(note);
    if (!p) return note.name;
    const jd = parseJournalName(note.name);
    if (jd) return note.name;
    const t = p.el.title.value.trim();
    return t ? (t.endsWith('.md') ? t : t + '.md') : note.name;
  }
  function setTitleFor(note, p) {
    p = p || curPane();
    const t = p.el.title;
    const jd = parseJournalName(note.name);
    if (jd) {
      t.value = jd.getFullYear() + '年' + (jd.getMonth() + 1) + '月' + jd.getDate() + '日';
      t.readOnly = true;
      t.title = '日记文件名固定为日期，不可改名';
    } else {
      t.value = note.name.replace(/\.md$/, '');
      t.readOnly = false;
      t.title = '';
    }
    fitDatedTitle(jd, p);
  }
  // 日记标题按文字宽度收窄，好让「›」紧贴日期，又不动左边缘（标题仍与正文左对齐）
  function measureTextWidth(text, el) {
    const cs = getComputedStyle(el);
    const c = document.createElement('canvas').getContext('2d');
    c.font = cs.fontStyle + ' ' + cs.fontWeight + ' ' + cs.fontSize + ' / 1 ' + cs.fontFamily;
    return c.measureText(text).width;
  }
  function fitDatedTitle(jd, p) {
    p = p || curPane();
    const t = p.el.title;
    const on = !!jd;
    p.el.prevDay.classList.toggle('hidden', !on);
    p.el.nextDay.classList.toggle('hidden', !on);
    t.classList.toggle('dated', on);
    if (!on) { t.style.width = ''; return; }
    t.style.width = Math.ceil(measureTextWidth(t.value, t)) + 2 + 'px';
  }
  // 窗格对应的日期（非日记返回 null）
  function currentJournalDate(p) {
    p = p || curPane();
    return p.note ? parseJournalName(p.note.name) : null;
  }
  async function stepDay(delta, p) {
    p = p || curPane();
    const jd = currentJournalDate(p);
    if (!jd) return;
    // 用中午避开夏令时/时区边界
    const d = new Date(jd.getFullYear(), jd.getMonth(), jd.getDate() + delta, 12);
    if (p === curPane()) {
      S.calSel = new Date(d.getFullYear(), d.getMonth(), d.getDate());
      S.calView = new Date(d.getFullYear(), d.getMonth(), 1);
      renderCalendar();
    }
    await openJournal(d, p);
    status((delta < 0 ? '前一天 · ' : '后一天 · ') + (d.getMonth() + 1) + '月' + d.getDate() + '日');
  }

  async function openJournal(date, p) {
    p = p || curPane();
    const name = journalName(date);
    let note = await Store.byName(name);
    if (!note) {
      // 不落盘：只在内存里开一个草稿视图，用户真正写入内容后才创建 .md
      note = {
        id: 'draft:' + name,
        name: name,
        content: '',
        favorite: false,
        draft: true,
        updatedAt: Date.now(),
      };
    }
    await openNote(note, false, true, p);
  }

  // 只装载，不做保存 / 去重判断
  async function loadPane(p, note) {
    await p.ready;                     // Vditor 实例就绪后才能 setValue
    p.note = note;
    p.dirty = false;
    p.lastRange = null;                // 换了笔记，旧的编辑器光标位置作废
    setTitleFor(note, p);
    setMd(note.content || '', p);
    tblSizeLoad(p);                    // 恢复这篇笔记里拖过的表格列宽 / 行高
    updateWc(p);
    renderDocTags(p);
    if (p.el.tagInput) p.el.tagInput.value = '';   // 换笔记清掉标签框残留（含浏览器自动填充塞进来的值）
    renderFav(p);
    if (p === curPane()) {
      setSaveState(note.draft ? '未创建（输入内容后自动保存）' : '未修改', p);
    }
    renderNotes();
    renderBottomPanel();
  }

  async function openNote(note, pushHistory, doSave, p) {
    p = p || curPane();
    if (doSave !== false && p.dirty) await saveCurrent(false, p);

    const o = otherPane(p);
    // 同一篇笔记不同时占两个窗格：撞上了就互换两边内容
    const swap = (o && o.note && p.note && o.note.id === note.id) ? p.note : null;
    await loadPane(p, note);
    if (swap) await loadPane(o, swap);

    // 窄屏下选完笔记把抽屉收起来，别挡着正文
    if (p === curPane() && isNarrow()) setSidebar(false);
  }

  async function saveCurrent(manual, p) {
    p = p || curPane();
    if (!p.note || p.dead) return;
    const content = getMd(p);

    // 空白日记草稿不落盘：不产生文件、不进列表、不打日历圆点
    if (p.note.draft && !content.trim()) {
      p.note.content = '';
      p.dirty = false;
      if (p === curPane()) setSaveState('未创建（输入内容后自动保存）', p);
      if (manual) status('空日记未创建文件');
      return;
    }

    const title = p.el.title.value.trim() || '无标题';
    const jd = parseJournalName(p.note.name);
    const name = jd ? p.note.name
      : (title.endsWith('.md') ? title : title + '.md');
    const oldName = p.note.name;

    const saved = await Store.put({
      id: p.note.draft ? undefined : p.note.id,
      name: name,
      content: content,
      favorite: p.note.favorite || false,
    });
    p.note = saved;
    tblSizeRename(oldName, saved.name);   // 改过名，表格尺寸跟着换 key，别丢
    p.dirty = false;
    if (p === curPane()) {
      setSaveState('已保存 ' + new Date().toLocaleTimeString('zh-CN', { hour12: false }), p);
    }
    await refreshAll();
    updateWc(p);
    if (manual) status('已保存到本地');
    if (FEATURES.webdav && S.dav.auto && S.dav.url) {
      davPutOne(saved).catch(e => setSyncStatus('同步失败：' + e.message));
    }
  }

  /* ---------------- 脏标记 / 字数 / 保存状态 ---------------- */
  // Vditor 的 input 回调顺手把最新 Markdown 递过来，省一次 getValue
  function markDirty(p, value) {
    p = p || curPane();
    if (p.loading) return;             // 正在 setValue（换笔记 / 改标签）不算用户编辑
    // Vditor 递过来的 value 里图片还是 blob 短链（几十个字符），统计直接用它，
    // 只有真要跟已存内容比对时才换回 data URI —— 否则每敲一个字都要复制一遍整串 base64
    const raw = value === undefined ? (p.vd ? p.vd.getValue() : '') : value;
    // Vditor 渲染完偶尔会补发一次内容没变的 input，别把「已保存」又标成脏
    if (!p.dirty && p.note && mdForStore(raw) === (p.note.content || '')) return;
    p.dirty = true;
    setSaveState('未保存…', p);
    const plain = textOf(raw);
    if (p.el.wc) p.el.wc.textContent = countWords(plain);
    renderDocTags(p, plain);
    clearTimeout(p._t);
    p._t = setTimeout(() => saveCurrent(false, p), 650);
  }

  function updateWc(p) {
    p = p || curPane();
    if (p.el.wc) p.el.wc.textContent = countWords(textOf(p.vd ? p.vd.getValue() : getMd(p)));
  }
  // 状态栏只有一条：只显示活动窗格的保存状态
  function setSaveState(txt, p) {
    p = p || curPane();
    if (p !== curPane()) return;
    const el = $('status-save');
    el.textContent = txt;
    el.classList.toggle('dirty', p.dirty);
    el.classList.toggle('saved', !p.dirty && txt.indexOf('已保存') === 0);
  }

  function status(t) { $('status-text').textContent = t; }
  function setSyncStatus(t) {
    $('status-sync').textContent = t;
    clearTimeout(S._st);
    S._st = setTimeout(() => { $('status-sync').textContent = ''; }, 5000);
  }

  // 清掉历史版本“点日期即建空文件”留下的空日记（内容为空，无信息损失）
  async function purgeBlankJournals() {
    const blanks = (await Store.allNotes()).filter(isBlankJournal);
    for (const n of blanks) {
      try { await Store.del(n.id); } catch {}
    }
    return blanks.length;
  }

  async function refreshAll() {
    S.notes = (await Store.allNotes()).sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
    spKey = null;                      // 笔记变了，搜索命中缓存作废
    spText.clear();
    S.noteDates = new Set(
      S.notes
        .filter(n => !isBlankJournal(n))
        .map(n => parseJournalName(n.name)).filter(Boolean).map(d => dayKey(d))
    );
    renderNotes();
    renderTags();
    renderCalendar();   // 日历随数据刷新圆点
    renderBottomPanel(); // 新建 / 删除笔记后引用方随之更新
  }

  /* ---------------- 底部引用面板：双链引用方 ---------------- */
  function bpStats() {
    if (!S.current) return { refs: [], missing: [] };
    const curName = S.current.name.replace(/\.md$/, '');
    const jd = parseJournalName(S.current.name);
    const alias = jd ? jd.getFullYear() + '年' + (jd.getMonth() + 1) + '月' + jd.getDate() + '日' : null;
    const names = alias ? [curName, alias] : [curName];

    const refs = S.notes.filter(n => {
      if (n.id === S.current.id) return false;
      const links = extractWikiLinks(n.content).map(l => l.replace(/\.md$/, ''));
      if (links.some(l => names.includes(l))) return true;
      return names.some(nm => new RegExp('\\[([^\\]]*)\\]\\(' + nm.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\.md\\)').test(n.content || ''));
    });

    const missing = extractWikiLinks(getMd())
      .filter(l => !S.notes.some(n => n.name === l + '.md' || n.name === l || n.name === l.replace(/\.md$/, '') + '.md'));

    return { refs };
  }

  function renderBottomPanel() {
    const body = $('bp-body');
    if (!S.current) {
      $('bp-summary').textContent = '无打开笔记';
      body.innerHTML = '<div class="bp-empty">无打开笔记</div>';
      return;
    }
    const { refs } = bpStats();
    // 日记提示里用界面上看到的日期写法，用户照着写 [[2026年10月24日]] 也能解析
    const curName = displayName(S.current);
    $('bp-summary').textContent = '引用方 ' + refs.length;

    body.innerHTML = '';
    if (!refs.length) {
      body.innerHTML = '<div class="bp-empty">还没有其他笔记引用本篇。在别的笔记正文里写 [[' +
        esc(curName) + ']]，它就会出现在这里（双向链接）。</div>';
      return;
    }
    refs.forEach(n => body.appendChild(bpRow(n)));
  }

  function bpRow(n) {
    const div = document.createElement('div');
    div.className = 'bp-row';
    const d = parseJournalName(n.name);
    div.innerHTML = '<span>' + (d ? '📅' : '📄') + '</span><span></span>';
    div.lastElementChild.textContent = n.name.replace(/\.md$/, '');
    div.addEventListener('click', () => openNote(n, true));
    return div;
  }

  /* ---------------- 笔记菜单 ---------------- */
  let activeMenu = null;
  function closeMenu() {
    if (activeMenu) { activeMenu.remove(); activeMenu = null; }
  }
  function showNoteMenu(x, y, note) {
    closeMenu();
    const menu = document.createElement('div');
    menu.className = 'menu';
    const jd = parseJournalName(note.name);   // 日志标题就是日期，不可改名 —— 连入口都不给
    menu.style.left = Math.min(x, window.innerWidth - 150) + 'px';
    menu.style.top = Math.min(y, window.innerHeight - (jd ? 100 : 130)) + 'px';
    menu.innerHTML =
      '<button data-act="favorite">' + (note.favorite ? '取消收藏' : '收藏') + '</button>' +
      (jd ? '' : '<button data-act="rename">重命名</button>') +
      '<button data-act="export">导出 .md</button>' +
      '<button data-act="delete" class="danger">删除</button>';
    document.body.appendChild(menu);
    activeMenu = menu;
    menu.addEventListener('click', async (e) => {
      const act = e.target.dataset.act;
      if (!act) return;
      closeMenu();
      if (act === 'favorite') {
        const fav = !note.favorite;
        await Store.put({
          id: note.id, name: liveName(note), content: liveContent(note), favorite: fav,
        });
        if (S.current && S.current.id === note.id) S.current.favorite = fav;
        await refreshAll();
        const pp2 = paneOfNote(note);
        if (pp2) renderFav(pp2);
        status(fav ? '已收藏' : '已取消收藏');
      }
      if (act === 'export') downloadNote(note);
      if (act === 'rename') {
        const name = prompt('新名称（不含 .md）', note.name.replace(/\.md$/, ''));
        if (!name) return;
        await Store.put({ id: note.id, name: name + '.md', content: liveContent(note), favorite: note.favorite });
        await refreshAll();
        if (S.current && S.current.id === note.id) {
          const fresh = await Store.byName(name + '.md');
          if (fresh) await openNote(fresh, false, false);
        }
      }
      if (act === 'delete') {
        if (!confirm('删除「' + note.name + '」？')) return;
        await Store.del(note.id);
        if (S.current && S.current.id === note.id) {
          S.current = null;
          await refreshAll();
          await openJournal(new Date());
        } else {
          await refreshAll();
        }
      }
    });
  }
  document.addEventListener('click', (e) => {
    if (activeMenu && !activeMenu.contains(e.target)) closeMenu();
  });

  /* ---------------- 视图模式 ---------------- */
  // 写作 / 源码 / 预览三种视图交给 Vditor 自己的工具栏（edit-mode、both、preview），
  // 这里只剩「双栏」按钮的状态需要同步。
  function applyView() {
    const db = $('btn-day-split');
    if (!db) return;
    db.classList.toggle('on', S.daySplit);
    db.title = S.daySplit
      ? '退出双栏 (Ctrl+Shift+D)'
      : '双栏：同时编辑连续两天 (Ctrl+Shift+D)';
