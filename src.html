<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DK NOTE</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/dk-note-32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="assets/dk-note-16.png" />
<link rel="apple-touch-icon" href="assets/dk-note-256.png" />
<style>
/* ================= 设计令牌（对齐 Orca Note） ================= */
:root{
  --gray-1:#f7f7f8; --gray-2:#efeff0; --gray-3:#e3e3e5; --gray-4:#c9c9cd;
  --gray-5:#a0a0a8; --gray-6:#77777f; --gray-7:#4a4a52; --gray-8:#35353b; --gray-9:#232328;
  --primary:#0b6bcb; --primary-weak:#e8f1fb; --danger:#d64545; --ok:#2f9e63;
  --sidebar-bg:#2c2c31; --sidebar-text:#e8e8ea; --sidebar-text-2:#9a9aa3;
  --sidebar-hover:#3a3a41; --sidebar-active:#484852;
  --content-bg:#fff; --content-text:#1f1f24; --content-text-2:#77777f;
  --border:#e3e3e5; --radius-sm:4px; --radius-md:8px;
  --font-ui:-apple-system,"Segoe UI","Microsoft YaHei UI","PingFang SC","Noto Sans SC",sans-serif;
  --font-mono:"Cascadia Code",Consolas,"JetBrains Mono",monospace;
}
body.dark{
  --content-bg:#1e1e22; --content-text:#e6e6e8; --content-text-2:#9a9aa3;
  --border:#35353b; --gray-1:#26262b; --gray-2:#2e2e34; --gray-3:#3a3a41;
  --gray-4:#55555e; --gray-9:#111114; --primary-weak:#1d2f45;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--font-ui);color:var(--content-text);background:var(--gray-2);overflow:hidden}
#app{display:flex;height:100vh}

/* ================= 侧栏 ================= */
#sidebar{width:272px;min-width:272px;background:var(--sidebar-bg);color:var(--sidebar-text);
  display:flex;flex-direction:column;z-index:10;box-shadow:2px 0 12px rgba(0,0,0,.08);transition:margin-left .18s ease}
#sidebar.collapsed{margin-left:-272px}
.side-head{display:flex;align-items:center;gap:2px;padding:10px 10px 2px}
#main .icon-btn:hover{background:var(--gray-2)}
.icon-btn{border:none;background:transparent;color:inherit;font-size:15px;width:28px;height:28px;
  border-radius:var(--radius-sm);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;line-height:1}
.icon-btn:hover{background:var(--sidebar-hover)}
.icon-btn:disabled{opacity:.35;cursor:default;background:transparent}
/* 顶栏图标：统一 16px 线性 SVG，颜色跟随文字色 */
.icon-btn svg{display:block;pointer-events:none}
.icon-btn svg.rot{transition:transform .14s ease}
.bottom-panel:not(.collapsed) #btn-bp-toggle svg.rot{transform:rotate(180deg)}
.side-spacer{flex:1}

/* 日历 */
.calendar{padding:8px 12px 6px;user-select:none}
.cal-header{display:flex;align-items:center;gap:2px;margin-bottom:6px}
.cal-title{font-size:13px;font-weight:600;letter-spacing:.2px;white-space:nowrap;display:flex;align-items:center;gap:2px}
.cal-title .cal-btn{cursor:pointer;padding:1px 3px;border-radius:3px}
.cal-title .cal-btn:hover{background:var(--sidebar-hover)}
.cal-today-btn{border:none;background:transparent;color:var(--sidebar-text-2);
  font-size:12px;font-weight:400;padding:2px 6px;border-radius:var(--radius-sm);cursor:pointer}
.cal-today-btn:hover{background:var(--sidebar-hover);color:var(--sidebar-text)}
.cal-grid{display:grid;grid-template-columns:20px repeat(7,1fr);gap:1px;font-size:11px}
.cal-cell{height:23px;display:flex;align-items:center;justify-content:center;border-radius:var(--radius-sm);position:relative;color:var(--sidebar-text)}
.cal-cell.head{color:var(--sidebar-text-2);font-size:10px;height:20px}
.cal-cell.weeknum{color:var(--sidebar-text-2);font-size:9.5px;opacity:.75}
.cal-cell.day{cursor:pointer}
.cal-cell.day:hover{background:var(--sidebar-hover)}
.cal-cell.day.other{color:var(--sidebar-text-2);opacity:.5}
.cal-cell.day .num{width:20px;height:20px;display:flex;align-items:center;justify-content:center;border-radius:50%}
.cal-cell.day.today .num{outline:1.5px solid #4ecdc4;outline-offset:0}
.cal-cell.day.selected .num{background:var(--primary);color:#fff;outline:none}
.cal-cell .dot{position:absolute;bottom:1px;left:50%;transform:translateX(-50%);width:3px;height:3px;border-radius:50%;background:var(--sidebar-text-2)}
.cal-cell.selected .dot{background:#fff}

/* 分段页签 + 列表 */
.seg-tabs{display:flex;background:rgba(255,255,255,.06);border-radius:var(--radius-sm);padding:2px;margin:2px 12px 8px}
.seg-item{flex:1;border:none;background:transparent;color:var(--sidebar-text-2);font-size:12px;padding:5px 0;border-radius:3px;cursor:pointer}
.seg-item.selected{background:rgba(255,255,255,.12);color:var(--sidebar-text)}
.side-scroll{flex:1;overflow-y:auto;min-height:0;padding:0 10px}
/* 侧栏页脚：应用名 + 版本 */
.side-foot{display:flex;align-items:baseline;gap:6px;padding:9px 14px 11px;
  border-top:1px solid rgba(255,255,255,.07);user-select:none;flex-shrink:0}
.side-foot .sf-name{font-size:11.5px;font-weight:600;letter-spacing:.9px;color:var(--sidebar-text);opacity:.82}
.side-foot .sf-ver{font-size:10px;letter-spacing:.3px;color:var(--sidebar-text-2);opacity:.72}
.note-list,.tag-list{list-style:none;margin:0;padding:0}
.note-item,.tag-item{display:flex;align-items:center;gap:7px;padding:5px 8px;border-radius:var(--radius-sm);
  cursor:pointer;font-size:13px;color:var(--sidebar-text);position:relative}
.note-item:hover,.tag-item:hover{background:var(--sidebar-hover)}
.note-item.active{background:var(--sidebar-active)}
.note-item .n-icon{opacity:.8;font-size:12px;width:14px;text-align:center}
.note-item .n-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.note-item .n-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.35}
.note-item .n-snip{font-size:11px;line-height:1.35;color:var(--sidebar-text);opacity:.66;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 搜索命中高亮（侧栏是深色底，不用默认的黄色底） */
.note-item mark{background:rgba(232,196,90,.26);color:#ffe9a8;border-radius:2px;padding:0 1px}
.note-item .n-more{opacity:0;border:none;background:transparent;color:var(--sidebar-text-2);cursor:pointer;
  font-size:13px;width:20px;height:20px;border-radius:3px;line-height:1}
.note-item:hover .n-more{opacity:1}
.note-item .n-more:hover{background:rgba(255,255,255,.14);color:#fff}
.tag-item .t-count{margin-left:auto;font-size:10px;color:var(--sidebar-text-2)}
.empty-tip{padding:10px 8px;font-size:12px;color:var(--sidebar-text-2);opacity:.8}

.filter-bar{display:flex;align-items:center;gap:6px;margin:0 0 6px;padding:5px 8px;border-radius:var(--radius-sm);
  background:rgba(255,255,255,.08);font-size:12px;color:var(--sidebar-text)}
.filter-bar.hidden{display:none}
.filter-bar .fb-tag{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.filter-bar button{border:none;background:transparent;color:var(--sidebar-text-2);cursor:pointer;font-size:12px;
  width:18px;height:18px;border-radius:3px;line-height:1}
.filter-bar button:hover{background:rgba(255,255,255,.14);color:#fff}
.note-item .n-fav{margin-left:auto;border:none;background:transparent;color:var(--sidebar-text-2);cursor:pointer;
  font-size:12px;width:18px;height:18px;border-radius:3px;line-height:1;opacity:.42;padding:0}
.note-item .n-fav.on{opacity:1;color:#e8c45a}
.note-item .n-fav:hover{opacity:1;color:#e8c45a}

/* ================= 主区 ================= */
#main{flex:1;display:flex;flex-direction:column;background:var(--content-bg);min-width:0}
.headbar{height:44px;display:flex;align-items:center;padding:0 14px;gap:10px;border-bottom:1px solid var(--border)}
.search-box{position:relative;display:flex;align-items:center;gap:6px;background:var(--gray-1);border:1px solid var(--border);
  border-radius:6px;padding:4px 9px;width:260px}
.search-box input{border:none;outline:none;background:transparent;font-size:12.5px;color:var(--content-text);width:100%;font-family:inherit}
.search-box .search-ico{display:flex;color:var(--content-text-2);opacity:.62}
.head-right{margin-left:auto;display:flex;gap:2px}

/* 搜索下拉：结果跟着输入框走，侧栏收起来也照样能看能点 */
.search-pop{position:absolute;top:calc(100% + 6px);left:-1px;z-index:80;
  width:min(460px,calc(100vw - 40px));max-height:min(62vh,440px);display:flex;flex-direction:column;
  background:var(--content-bg);border:1px solid var(--border);border-radius:var(--radius-md);
  box-shadow:0 12px 32px rgba(0,0,0,.18);overflow:hidden}
.search-pop.hidden{display:none}
.sp-head{flex:none;display:flex;align-items:center;gap:6px;padding:6px 10px;font-size:11px;
  color:var(--content-text-2);background:var(--gray-1);border-bottom:1px solid var(--border)}
.sp-head .sp-n{margin-left:auto;flex:none}
.sp-list{overflow-y:auto;min-height:0;padding:5px}
.sp-item{display:block;width:100%;border:none;background:transparent;font-family:inherit;text-align:left;
  padding:6px 8px;border-radius:var(--radius-sm);cursor:pointer;color:var(--content-text)}
.sp-item:hover,.sp-item.on{background:var(--gray-2)}
.sp-name{display:flex;align-items:baseline;gap:6px;font-size:12.5px;font-weight:600;line-height:1.5}
.sp-name .sp-ico{font-size:11px;opacity:.55;font-weight:400;flex:none}
.sp-name .sp-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sp-snip{font-size:11.5px;color:var(--content-text-2);line-height:1.55;margin-top:1px;overflow:hidden;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.sp-item mark{background:var(--primary-weak);color:var(--primary);border-radius:2px;padding:0 1px;font-weight:600}
/* 暗色下 --primary 不换色，深蓝压深蓝看不清，单独给亮一档 */
body.dark .sp-item mark{background:rgba(11,107,203,.3);color:#8ec5ff}
.sp-empty{padding:12px 10px;font-size:12px;color:var(--content-text-2);line-height:1.7}
.sp-foot{flex:none;display:flex;align-items:center;gap:9px;padding:5px 10px;font-size:10.5px;
  color:var(--content-text-2);border-top:1px solid var(--border)}
.sp-key{border:1px solid var(--border);border-radius:3px;padding:0 4px;font-size:10px;line-height:14px}

.doc-head{padding:18px 44px 0}
.title-row{display:flex;align-items:center;gap:8px;position:relative}
.doc-title{flex:1;border:none;outline:none;background:transparent;font-size:26px;font-weight:700;
  color:var(--content-text);font-family:inherit;padding:0;min-width:0}
/* 日记：标题宽度贴合文字，好让「›」紧跟日期 */
.doc-title.dated{flex:none;max-width:100%}
.doc-title::placeholder{color:var(--gray-4)}
/* 日期翻页：前一天悬挂在标题左侧（不占位，保证标题仍与正文左对齐），后一天紧跟日期 */
.day-nav{border:none;background:transparent;color:var(--content-text-2);cursor:pointer;padding:0;
  width:22px;height:22px;border-radius:var(--radius-sm);font-size:18px;line-height:1;flex:none;
  display:inline-flex;align-items:center;justify-content:center;transition:background .12s,color .12s}
.day-nav:hover{background:var(--gray-2);color:var(--content-text)}
.day-nav:active{background:var(--gray-3)}
.day-nav.prev{position:absolute;left:-30px;top:50%;transform:translateY(-50%)}
.day-nav.hidden{display:none}
.wc-badge{font-size:11px;color:var(--content-text-2);background:var(--gray-2);padding:2px 8px;border-radius:10px;flex:none;
  margin-left:auto;margin-right:2px;line-height:1.5}

/* 标题下的标签条 */
.doc-tags{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:8px 0 2px;min-height:24px;position:relative}
/* 收藏星标：行首，与正文左边缘对齐；标签跟在它后面，因此整体右移一个星标的宽度。
   -3px 是把星形字形在按钮里的左右留白抵掉，让字形本身（不是按钮盒子）落到 44px 那条线上 */
.doc-fav{flex:none;display:inline-flex;align-items:center;justify-content:center;width:17px;height:17px;
  margin-left:-3px;border:none;background:transparent;padding:0;border-radius:3px;cursor:pointer;color:var(--content-text-2);
  font-size:14px;line-height:1;opacity:.7;transition:color .12s,opacity .12s,background .12s}
.doc-fav:hover{opacity:1;color:#d8a217;background:var(--gray-2)}
/* 白底上 #e8c45a 太浅，浅色主题用深一号的金；暗底仍用侧栏那支金 */
.doc-fav.on{opacity:1;color:#d8a217}
body.dark .doc-fav.on,body.dark .doc-fav:hover{color:#e8c45a}
/* 没有笔记时只隐藏、不撤位，免得标签行左右跳动 */
.doc-fav.hidden{visibility:hidden;pointer-events:none}
.dt-label{font-size:11px;color:var(--content-text-2);flex:none}
.dt-chips{display:flex;gap:5px;flex-wrap:wrap}
.dt-chip{display:inline-flex;align-items:center;gap:3px;font-size:11.5px;line-height:1;padding:4px 7px;
  border-radius:11px;background:var(--gray-2);color:var(--content-text-2);cursor:pointer}
.dt-chip:hover{background:var(--gray-3);color:var(--content-text)}
.dt-chip .dt-x{font-size:11px;opacity:.55;padding:0 1px}
.dt-chip .dt-x:hover{opacity:1}
.dt-input{border:none;outline:none;background:transparent;font-size:11.5px;color:var(--content-text);
  font-family:inherit;padding:3px 0;min-width:92px}
.dt-input::placeholder{color:var(--gray-4)}
/* 标签池建议：点一下才加到本篇 */
.tag-suggest{position:absolute;left:0;top:100%;z-index:40;min-width:200px;max-width:320px;
  background:var(--content-bg);border:1px solid var(--border);border-radius:var(--radius-md);
  box-shadow:0 8px 24px rgba(0,0,0,.14);padding:4px;max-height:220px;overflow-y:auto}
.tag-suggest.hidden{display:none}
.ts-item{display:flex;align-items:center;gap:8px;width:100%;border:none;background:transparent;
  color:var(--content-text);font-size:12.5px;font-family:inherit;text-align:left;padding:5px 8px;
  border-radius:var(--radius-sm);cursor:pointer}
.ts-item:hover,.ts-item.on{background:var(--gray-2)}
.ts-item .ts-count{margin-left:auto;font-size:10.5px;color:var(--content-text-2)}
.ts-empty{padding:6px 8px;font-size:11.5px;color:var(--content-text-2);line-height:1.6}

/* 双链插入面板：fixed 定位，跟着光标走，两个窗格共用一份 */
.wiki-pop{position:fixed;z-index:60;width:286px;max-height:326px;display:flex;flex-direction:column;
  background:var(--content-bg);border:1px solid var(--border);border-radius:var(--radius-md);
  box-shadow:0 10px 28px rgba(0,0,0,.18);padding:6px}
.wiki-pop.hidden{display:none}
.wiki-q{border:none;outline:none;background:transparent;font-family:inherit;font-size:13px;
  color:var(--content-text);padding:6px 7px;border-bottom:1px solid var(--border);flex:none}
.wiki-q::placeholder{color:var(--gray-4)}
.wiki-list{overflow-y:auto;min-height:0;padding-top:4px}
.wiki-item{display:flex;align-items:center;gap:7px;width:100%;border:none;background:transparent;
  color:var(--content-text);font-size:12.5px;font-family:inherit;text-align:left;padding:6px 8px;
  border-radius:var(--radius-sm);cursor:pointer}
.wiki-item:hover,.wiki-item.on{background:var(--gray-2)}
.wiki-item .wi-ico{width:13px;flex:none;font-size:11px;opacity:.5;text-align:center}
.wiki-item .wi-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wiki-item .wi-new{color:var(--primary)}
.wiki-empty{padding:8px;font-size:11.5px;color:var(--content-text-2);line-height:1.6}

/* 字体颜色 / 高亮面板：fixed，挂在工具栏按钮下面 */
.color-pop{position:fixed;z-index:60;width:auto;min-width:150px;background:var(--content-bg);border:1px solid var(--border);
  border-radius:var(--radius-md);box-shadow:0 10px 28px rgba(0,0,0,.18);padding:9px 10px}
.color-pop.hidden{display:none}
.cp-row{display:flex;align-items:center;gap:6px;flex-wrap:nowrap}
.cp-row + .cp-row{margin-top:8px;padding-top:8px;border-top:1px solid var(--border)}
.cp-label{font-size:11px;color:var(--content-text-2);width:26px;flex:none}
.cp-swatch{width:20px;height:20px;border-radius:50%;border:1px solid rgba(0,0,0,.14);cursor:pointer;
  padding:0;min-width:0;flex:none;transition:outline-color .12s,transform .12s}
.cp-swatch:hover{outline:2px solid var(--primary);outline-offset:1px}
body.dark .cp-swatch{border-color:rgba(255,255,255,.18)}
.cp-swatch.none{background:var(--content-bg);color:var(--content-text-2);font-size:11px;line-height:1;
  display:inline-flex;align-items:center;justify-content:center}
.cp-swatch.hl{background:#fff2a8;color:#8a6d1f;font-size:11px;line-height:1;
  display:inline-flex;align-items:center;justify-content:center;border-color:#e6d68a}
body.dark .cp-swatch.hl{background:#5c4a12;color:#f4e8c2;border-color:#7d6520}
.cp-hint{font-size:10.5px;color:var(--content-text-2);line-height:1.5;margin-top:7px}

/* Vditor 自带的块/表格操作条：只在 wysiwyg 出现，一条白底浮条直接压在正文上（实测盖住标题下半行），
   里面的按钮是「块上移/下移/删除」+「表格加行删行对齐」。这些我们已经用 #tbl-bar 统一了，
   两模式共用一套，所以把它藏掉。只藏带 data-type 的 button，代码块的语言 <select> 和评论按钮保留。 */
.vditor-panel--none > button[data-type]{display:none!important}
/* 面板里除了按钮还挂着「3 × 3」尺寸提示和快捷键说明的 span，只藏按钮会剩两块小字浮在正文上，
   支持 :has 的浏览器连整条面板一起藏（退化时上面那条至少把按钮拿掉） */
.vditor-panel--none:has(> button[data-type]){display:none!important}
/* 表格工具条：光标进表格时贴在表格右侧，两种编辑模式共用同一套按钮 */
.tbl-bar{position:fixed;z-index:59;display:flex;align-items:center;gap:1px;padding:2px;
  background:var(--content-bg);border:1px solid var(--border);border-radius:var(--radius-md);
  box-shadow:0 4px 14px rgba(0,0,0,.12)}
.tbl-bar.hidden{display:none}
body.dark .tbl-bar{box-shadow:0 4px 16px rgba(0,0,0,.55)}
.tbl-bar button{width:24px;height:24px;flex:none;display:flex;align-items:center;justify-content:center;
  padding:0;border:none;background:transparent;border-radius:var(--radius-sm);
  color:var(--content-text-2);cursor:pointer;transition:background .12s,color .12s}
.tbl-bar button:hover{background:var(--gray-2);color:var(--content-text)}
.tbl-bar button:active{background:var(--gray-3)}
.tbl-bar button.on{color:var(--primary);background:var(--gray-2)}
.tbl-bar button svg{display:block}
.tbl-bar .tb-sep{width:1px;height:14px;flex:none;background:var(--border);margin:0 3px}
/* 整表宽度手柄：贴表格右下角。列宽拖的是「列与列之间的分隔」，行高拖的是「行下边界」，
   整表宽度得有个不打架的落点，就用右下角这个小方块（双击回默认一半宽） */
.tbl-rs{position:fixed;z-index:60;display:none;width:12px;height:12px;
  border:1px solid var(--border);border-right-width:2px;border-bottom-width:2px;
  border-color:var(--content-text-2);border-top-color:transparent;border-left-color:transparent;
  border-radius:0 0 3px 0;background:transparent;cursor:nwse-resize}
.tbl-rs.on{display:block}
.tbl-rs:hover,.tbl-rs.dragging{background:var(--primary-weak);border-color:var(--primary)}
/* 拖表格列宽 / 行高 / 整表宽度时锁住选区，否则鼠标一过就把正文选中了 */
body.tbl-resizing{user-select:none;-webkit-user-select:none}
/* 双链 chip：只在预览面板渲染；IR 编辑器里保持 [[原文]] 不改 DOM，否则回写 Markdown 会丢括号 */
.vditor-preview a.wiki-link{color:var(--primary);background:var(--primary-weak);padding:0 3px;
  border-radius:3px;text-decoration:none;cursor:pointer}
/* IR 编辑器里的双链：只上色 + 底色，不动字号行高，避免打字时抖动 */

/* 双栏：每列变窄，收留白 */.panes.splitting .doc-head{padding:14px 20px 0}

<script>
/* =====================================================================
   DK NOTE v0.1 — 单文件版（无模块依赖，双击 file:// 亦可运行）
   ===================================================================== */
(function () {
  'use strict';

  /* 本版本关闭的能力。改回 true 并去掉设置里那段 class="dav-off" 即可恢复入口 */
  const FEATURES = { webdav: false };

  /* ---------------- 工具 ---------------- */
  const $ = (id) => document.getElementById(id);
  const pad = (n) => String(n).padStart(2, '0');
  const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const dayKey = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const journalName = (d) => dayKey(d) + '.md';
  function parseJournalName(name) {
    const m = String(name).match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (!m) return null;
    const d = new Date(+m[1], +m[2] - 1, +m[3]);
    return isNaN(d.getTime()) ? null : d;
  }
  // 空白日记：文件存在但没有任何内容（不算“有笔记”）
  function isBlankJournal(n) {
    return !!parseJournalName(n.name) && !String(n.content || '').trim();
  }
  function isoWeek(date) {
    const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
    const day = d.getUTCDay() || 7;
    d.setUTCDate(d.getUTCDate() + 4 - day);
    const ys = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
    return Math.ceil(((d - ys) / 86400000 + 1) / 7);
  }

  /* ---------------- 正文工具：字数 / 标签 / 双链 ---------------- */
  // 摘掉图片载荷再统计：`![](…)` 里的 data URI 或 blob 短链跟字数、标签无关，
  // 但每敲一个字都要把它扫一遍的话，几百 KB 的图就成了每键固定开销
  const IMG_MD_RE = /!\[[^\]]*\]\([^)]*\)/g;
  function textOf(md) {
    const s = String(md || '');
    if (s.indexOf('![') < 0) return s;
    return s.replace(IMG_MD_RE, ' ');
  }
  function countWords(text) {
    const t = String(text || '').replace(/```[\s\S]*?```/g, '')
      .replace(/<\/?(?:span|mark)\b[^>]*>/gi, '')
      .replace(/[#>*`~\-|[\]()!]/g, '');
    const cjk = (t.match(/[\u3400-\u4DBF\u4E00-\u9FFF\u3040-\u30FF\uAC00-\uD7AF]/g) || []).length;
    const latin = (t.replace(/[\u3400-\u4DBF\u4E00-\u9FFF\u3040-\u30FF\uAC00-\uD7AF]/g, ' ').match(/[A-Za-z0-9]+/g) || []).length;
    return cjk + latin;
  }

  function extractTags(text) {
    // 去掉代码块与行内 HTML（字体颜色/高亮），避免把 #d64545 这类色值当成标签
    const t = String(text || '')
      .replace(/```[\s\S]*?```/g, '')
      .replace(/<\/?(?:span|mark)\b[^>]*>/gi, '');
    const tags = new Set();
    const re = /(^|[\s(（])#([^\s#，。,;；!！?？'"）)]{1,40})/g;
    let m;
    while ((m = re.exec(t))) tags.add(m[2]);
    return Array.from(tags);
  }

  function extractWikiLinks(text) {
    const t = String(text || '').replace(/```[\s\S]*?```/g, '');
    const out = new Set();
    const re = /\[\[([^\]]+)\]\]/g;
    let m;
    while ((m = re.exec(t))) out.add(m[1].trim());
    return Array.from(out);
  }

  /* ---------------- 存储层（IndexedDB → localStorage → 内存） ---------------- */
  const Store = {
    mode: 'indexeddb',      // indexeddb | localstorage | memory
    db: null,
    mem: new Map(),
    LS_KEY: 'orca-notes-data',

    async init() {
      try {
        if (!('indexedDB' in window)) throw new Error('no indexedDB');
        this.db = await new Promise((res, rej) => {
          const req = indexedDB.open('orca-notes', 1);
          req.onupgradeneeded = () => {
            const db = req.result;
            if (!db.objectStoreNames.contains('notes')) {
              const s = db.createObjectStore('notes', { keyPath: 'id' });
              s.createIndex('name', 'name', { unique: true });
            }
            if (!db.objectStoreNames.contains('settings')) db.createObjectStore('settings', { keyPath: 'key' });
          };
          req.onsuccess = () => res(req.result);
          req.onerror = () => rej(req.error || new Error('open failed'));
          setTimeout(() => rej(new Error('open timeout')), 3000);
        });
        this.mode = 'indexeddb';
      } catch (e) {
        // 降级到 localStorage
        try {
          localStorage.setItem('__t', '1');
          localStorage.removeItem('__t');
          this.mode = 'localstorage';
        } catch (e2) {
          this.mode = 'memory';
        }
      }
      // 兼容旧数据：曾绑定过本地文件夹的用户，把残留的 handle 清掉
      try { await this.setSetting('folderHandle', null); } catch {}
      return this.mode;
    },

    _lsRead() {
      try { return JSON.parse(localStorage.getItem(this.LS_KEY) || '{"notes":{},"settings":{}}'); }
      catch { return { notes: {}, settings: {} }; }
    },
    _lsWrite(data) {
      try { localStorage.setItem(this.LS_KEY, JSON.stringify(data)); } catch {}
    },

    async allNotes() {
      if (this.mode === 'indexeddb') {
        try {
          return await new Promise((res, rej) => {
            const r = this.db.transaction('notes', 'readonly').objectStore('notes').getAll();
            r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
          });
        } catch { /* 落回下方 */ }
      }
      if (this.mode === 'localstorage') return Object.values(this._lsRead().notes);
      return Array.from(this.mem.values());
    },

    async byName(name) {
      const all = await this.allNotes();
      return all.find(n => n.name === name) || null;
    },

    async put(note) {
      const now = Date.now();
      let target = note;
      if (!note.id) {
        const exist = await this.byName(note.name);
        target = Object.assign({}, exist || {}, note, { id: exist ? exist.id : note.name });
      }
      target.updatedAt = now;

      if (this.mode === 'indexeddb') {
        try {
          await new Promise((res, rej) => {
            const r = this.db.transaction('notes', 'readwrite').objectStore('notes').put(target);
            r.onsuccess = () => res(); r.onerror = () => rej(r.error);
          });
          return target;
        } catch { /* 落回 */ }
      }
      if (this.mode === 'localstorage') {
        const d = this._lsRead(); d.notes[target.id] = target; this._lsWrite(d); return target;
      }
      this.mem.set(target.id, target);
      return target;
    },

    async del(id) {
      if (this.mode === 'indexeddb') {
        try {
          await new Promise((res, rej) => {
            const r = this.db.transaction('notes', 'readwrite').objectStore('notes').delete(id);
            r.onsuccess = () => res(); r.onerror = () => rej(r.error);
          });
          return;
        } catch {}
      }
      if (this.mode === 'localstorage') {
        const d = this._lsRead(); delete d.notes[id]; this._lsWrite(d); return;
      }
      this.mem.delete(id);
    },

    async clear() {
      if (this.mode === 'indexeddb') {
        try {
          await new Promise((res, rej) => {
            const r = this.db.transaction('notes', 'readwrite').objectStore('notes').clear();
            r.onsuccess = () => res(); r.onerror = () => rej(r.error);
          });
          return;
        } catch {}
      }
      if (this.mode === 'localstorage') { const d = this._lsRead(); d.notes = {}; this._lsWrite(d); return; }
      this.mem.clear();
    },

    async getSetting(key, fb) {
      if (this.mode === 'indexeddb' || this.db) {
        try {
          const rec = await new Promise((res, rej) => {
            const r = this.db.transaction('settings', 'readonly').objectStore('settings').get(key);
            r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
          });
          return rec ? rec.value : fb;
        } catch {}
      }
      if (this.mode === 'localstorage') {
        const d = this._lsRead(); return key in d.settings ? d.settings[key] : fb;
      }
      return fb;
    },

    async setSetting(key, value) {
      if (this.mode === 'indexeddb' || this.db) {
        try {
          await new Promise((res, rej) => {
            const r = this.db.transaction('settings', 'readwrite').objectStore('settings').put({ key, value });
            r.onsuccess = () => res(); r.onerror = () => rej(r.error);
          });
          return;
        } catch {}
      }
      if (this.mode === 'localstorage') {
        const d = this._lsRead(); d.settings[key] = value; this._lsWrite(d);
      }
    },
  };

  /* ---------------- 状态 ---------------- */
  const S = {
    notes: [],
    // current / dirty 是「活动窗格」的快捷视图，见下面的 defineProperty
    view: 'edit',                 // edit | preview
    split: false,                 // 源码对照（左编辑 / 右 Markdown 源码）
    daySplit: false,              // 双栏：左右各一天，可同时编辑
    tags: [],
    dav: { url: '', user: '', pass: '', auto: false },
    firstMonday: true,
    search: '',
    tab: 'fav',                   // all=全部日志 | fav=收藏（默认） | tags=标签
    tagFilter: '',                // 侧栏标签筛选
    bpOpen: false,                // 底部引用面板展开状态
    calView: new Date(),
    calSel: new Date(),
    noteDates: new Set(),
  };

  /* ---------------- 窗格（单栏 A / 双栏 A+B，编辑器内核 = Vditor） ---------------- */
  // 每个窗格一个 Vditor 实例 + 自己的笔记 / 脏标记 / 自动保存定时器；
  // 所有「当前」操作落到 ACTIVE 窗格上，另一个窗格只负责显示与自存。
  const PANES = {};
  let ACTIVE = 'a';
  const curPane = () => PANES[ACTIVE] || PANES.a;
  const otherPane = (p) => (p && p.key === 'a' ? PANES.b : PANES.a);
  const isDark = () => document.body.classList.contains('dark');

  Object.defineProperty(S, 'current', {
    get: () => curPane().note,
    set: (v) => { curPane().note = v; },
    configurable: true,
  });
  Object.defineProperty(S, 'dirty', {
    get: () => curPane().dirty,
    set: (v) => { curPane().dirty = v; },
    configurable: true,
  });

  // 工具栏：常用的摆在外面，其余收进「更多」。图片走内联 data URL，不需要服务端
  // 双链 / 字色 / 图片是自定义项，Vditor 会把 icon 字符串直接 innerHTML 进按钮，所以给内联 SVG。
  // 注意 Vditor 对工具栏 svg 统一 fill:currentColor，描边图形会被整块涂黑 —— 统一挂 vt-ico，
  // 由 CSS 单独放行成描边（见「工具栏自绘图标」那段）
  const WIKI_ICON = '<svg class="vt-ico" viewBox="0 0 16 16" width="16" height="16" fill="none" ' +
    'stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">' +
    '<path d="M6 3.4H3.9v9.2H6"/><path d="M10 3.4h2.1v9.2H10"/>' +
    '<path d="M7.3 6.4h1.4M7.3 8h1.4M7.3 9.6h1.4"/></svg>';
  // 字色 / 高亮按钮：一个 A 加一条底色杠
  const COLOR_ICON = '<svg class="vt-ico" viewBox="0 0 16 16" width="16" height="16" fill="none" ' +
    'stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">' +
    '<path d="M4 10.4 7.9 3.2l3.9 7.2"/><path d="M5.3 8.4h5.2"/>' +
    '<path class="vt-bar" d="M3 13.2h10"/></svg>';
  // 图片按钮：一个相框，右上角一个小太阳
  const IMG_ICON = '<svg class="vt-ico" viewBox="0 0 16 16" width="16" height="16" fill="none" ' +
    'stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">' +
    '<rect x="2.3" y="3.4" width="11.4" height="9.2" rx="1.3"/>' +
    '<circle cx="10.6" cy="6.1" r="1.05"/>' +
    '<path d="M2.6 11.2 6.2 7.7l2.1 2.1 1.7-1.6 3.4 3.2"/></svg>';
  const vdToolbar = (p) => [
    'headings', 'bold', 'italic', 'strike', '|',
    'list', 'ordered-list', 'check', '|',
    'quote', 'line', 'code', 'inline-code', 'link',
    { name: 'wiki', tip: '双链 [[笔记标题]]', tipPosition: 's', icon: WIKI_ICON,
      click: (ev) => { if (ev) ev.preventDefault(); toggleWikiPop(p); } },
    { name: 'color', tip: '字体颜色 / 高亮', tipPosition: 'n', icon: COLOR_ICON,
      click: (ev) => { if (ev) ev.preventDefault(); toggleColorPop(p, ev && ev.currentTarget); } },
    { name: 'image', tip: '插入图片 / 截图', tipPosition: 'n', icon: IMG_ICON,
      click: (ev) => { if (ev) ev.preventDefault(); pickImage(p); } },
    'table', '|',
    'undo', 'redo', '|', 'edit-mode',
    // 'both'（预览对照）在本版点了没反应，不放出来占位置
    { name: 'more', toolbar: ['preview', 'code-theme', 'content-theme', 'export', 'help'] },
  ];

  function vdOptions(p) {
    const dark = isDark();
    // 单文件版把内容主题 / 代码主题的 CSS 内联在页面里，这里先把 <style> 的 href
    // 对齐到当前主题，Vditor 内部再做主题检查时就不会退回去建 <link> 发请求
    if (window.__vdInlineTheme) window.__vdInlineTheme(dark);
    return {
      cdn: 'vditor',
      lang: 'zh_CN',
      icon: 'ant',
      mode: 'ir',                       // 即时渲染：输入即见排版，最接近旧版的写作态
      height: '100%',
      width: '100%',
      theme: dark ? 'dark' : 'classic',
      cache: { enable: false },         // 存储由本应用负责，不要 Vditor 自己的 localStorage 缓存
      counter: { enable: false },       // 字数由标题行的徽章显示
      outline: { enable: false },
      toolbarConfig: { pin: true, hide: false },
      toolbar: vdToolbar(p),
      placeholder: '开始书写…',
      undoDelay: 600,
      preview: {
        delay: 400,
        hljs: { enable: true, lineNumber: false, style: dark ? 'monokai' : 'github' },
        math: { engine: 'KaTeX' },
        theme: { current: dark ? 'dark' : 'light', path: 'vditor/dist/css/content-theme' },
        // 预览面板里把 [[X]] 渲染成 chip（只在这里改 DOM，IR 编辑器里不动，否则回写 Markdown 会丢括号）
        parse: (el) => decorateWiki(el),
      },
      input: (value) => markDirty(p, value),
    };
  }

  // 建实例是异步的（要等 lute 与图标脚本就位），openNote 里 await 这个 promise
  function initVditor(p) {
    return new Promise((resolve) => {
      p.vd = new Vditor(p.el.host, Object.assign(vdOptions(p), {
        after: () => {
          p.el.host.classList.add('vd-ready');
          // 单文件版：初始化过程里 Vditor 可能把内联的主题 <style> 换成了 <link>，补一次
          if (window.__vdInlineAfter) window.__vdInlineAfter(isDark());
          // 工具栏按钮点下去别抢走编辑器选区，否则插入点就丢了
          ['wiki', 'color', 'image'].forEach((k) => {
            const btn = p.el.host.querySelector('.vditor-toolbar [data-type="' + k + '"]');
            if (btn && btn.addEventListener) btn.addEventListener('mousedown', (e) => e.preventDefault());
          });
          const ir = p.el.host.querySelector('.vditor-ir');
          if (ir) bindWikiInEditor(p, ir);
          resolve();        },
      }));
    });
  }

  // 明暗主题：Vditor 的界面主题 / 正文内容主题 / 代码高亮主题一起换
  function applyEditorTheme() {
    const dark = isDark();
    // 单文件版：先把内联主题的 href 对齐，setTheme 内部发现 href 不一致就会删掉
    // 我们的 <style> 再去建 <link>；调用完再兜一次，防止实现里有二次删除
    if (window.__vdInlineTheme) window.__vdInlineTheme(dark);
    ['a', 'b'].forEach(k => {
      const p = PANES[k];
      if (!p || !p.vd) return;
      p.vd.setTheme(dark ? 'dark' : 'classic', dark ? 'dark' : 'light', dark ? 'monokai' : 'github');
    });
    if (window.__vdInlineTheme) window.__vdInlineTheme(dark);
  }

  function paneOfNote(note) {
    if (!note) return null;
    for (let i = 0; i < 2; i++) {
      const p = PANES[i === 0 ? 'a' : 'b'];
      if (p && p.note && p.note.id === note.id) return p;
    }
    return null;
  }
  function paintActivePane() {
    ['a', 'b'].forEach(k => {
      const p = PANES[k];
      if (!p) return;
      p.root.classList.toggle('dim', k !== ACTIVE);
      p.root.classList.toggle('active', k === ACTIVE);
    });
  }
  // 切窗格：状态栏、侧栏高亮、引用面板、日历都跟着走
  function setActive(key) {
    if (!PANES[key] || ACTIVE === key) return;
    ACTIVE = key;
    paintActivePane();
    const p = curPane();
    renderNotes();
    renderBottomPanel();
    if (p.note) {
      setSaveState(p.dirty ? '未保存…'
        : (p.note.draft ? '未创建（输入内容后自动保存）' : '未修改'), p);
    }
    const jd = currentJournalDate(p);
    if (jd) {
      fitDatedTitle(jd, p);
      if (dayKey(jd) !== dayKey(S.calSel)) {
        S.calSel = new Date(jd.getFullYear(), jd.getMonth(), jd.getDate());
        S.calView = new Date(jd.getFullYear(), jd.getMonth(), 1);
        renderCalendar();
      }
    }
  }

  // 右栏由左栏克隆出来（结构 / 样式与左栏完全一致），id 统一加 “-b” 后缀
  function buildPane(key) {
    const sfx = key === 'a' ? '' : '-' + key;
    let root = key === 'a' ? $('pane-a') : null;
    if (key !== 'a') {
      const clone = $('pane-a').cloneNode(true);
      clone.querySelectorAll('[id]').forEach(el => { el.id = el.id + sfx; });
      clone.id = 'pane-' + key;
      clone.classList.remove('active', 'dim');
      clone.classList.add('hidden');
      const c = (id) => clone.querySelector('#' + id + sfx);
      c('doc-title').value = '';
      c('doc-title').style.width = '';
      c('dt-chips').innerHTML = '';
      c('btn-fav').classList.remove('on');
      c('btn-fav').classList.add('hidden');
      c('btn-fav').textContent = '☆';
      c('tag-suggest').innerHTML = '';
      c('tag-suggest').classList.add('hidden');
      c('wc-badge').textContent = '0';
      c('btn-prev-day').classList.add('hidden');
      c('btn-next-day').classList.add('hidden');
      // 克隆过来的编辑器 DOM 会被 Vditor 初始化时整体清空，不用手工收拾
      $('panes').appendChild(clone);
      root = clone;
    }
    const q = (id) => document.getElementById(id + sfx);
    // 克隆时宿主被改成 vd-a-b，这里统一成 vd-b，取元素时不用记两套名字
    const host = q('vd-a');
    if (key !== 'a') host.id = 'vd-' + key;
    const p = {
      key: key, sfx: sfx, root: root,
      note: null, dirty: false, _t: null, vd: null, loading: false,
      el: {
        host: host, title: q('doc-title'), chips: q('dt-chips'), fav: q('btn-fav'),
        tagInput: q('dt-input'), tagSuggest: q('tag-suggest'), wc: q('wc-badge'),
        prevDay: q('btn-prev-day'), nextDay: q('btn-next-day'),
      },
    };
    p.ready = initVditor(p);
    bindPane(p);
    return p;
  }

  async function initPanes() {
    PANES.a = buildPane('a');
    paintActivePane();
    await PANES.a.ready;
  }

  // 双栏开关：打开时右栏显示“当前日期的后一天”，两栏都能写
  async function setDaySplit(on) {
    if (!!on === !!S.daySplit) return;
    if (on) {
      await saveCurrent(false, curPane());
      S.daySplit = true;
      PANES.b = buildPane('b');
      $('panes').classList.add('splitting');
      PANES.b.root.classList.remove('hidden');
      PANES.b.root.classList.add('dim');
      const base = currentJournalDate(PANES.a);
      // 左栏是日记 → 右栏接着显示次日；左栏是普通笔记 → 右栏显示今天
      const next = base
        ? new Date(base.getFullYear(), base.getMonth(), base.getDate() + 1, 12)
        : new Date();
      await openJournal(next, PANES.b);
      const from = base || next;
      status('双栏：' + (from.getMonth() + 1) + '月' + from.getDate() + '日 / ' +
        (next.getMonth() + 1) + '月' + next.getDate() + '日');
    } else {
      const wasB = ACTIVE === 'b';
      const b = PANES.b;
      if (b) {
        clearTimeout(b._t);
        if (b.dirty) await saveCurrent(false, b);
        b.dead = true;
      }
      S.daySplit = false;
      $('panes').classList.remove('splitting');
      // 不调 vd.destroy()：它会顺手删掉全局图标精灵（#vditorIconScript），左栏图标会一起消失
      if (b) b.root.remove();
      delete PANES.b;
      ACTIVE = 'a';
      // 焦点在右栏时，把右栏正在看的笔记挪到左栏，别让眼前内容消失
      if (wasB && b && b.note) await loadPane(PANES.a, b.note);
      paintActivePane();
      status('已退出双栏');
    }
    await Store.setSetting('daySplit', S.daySplit);
    applyView();
    renderNotes();
    // 双栏一进一出窗格宽度就变了，表格工具条还停在老位置（表格宽到吃满窗格时会飘到另一边）
    tblWatch();
    if (tblVisible()) tblPlace();
    renderBottomPanel();
  }

  /* ---------------- 日历 ---------------- */
  function renderCalendar() {
    const grid = $('cal-grid');
    const y = S.calView.getFullYear();
    const m = S.calView.getMonth();
    $('cal-year').textContent = y;
    $('cal-month').textContent = m + 1;

    const heads = S.firstMonday
      ? ['一', '二', '三', '四', '五', '六', '日']
      : ['日', '一', '二', '三', '四', '五', '六'];

    let html = '<div class="cal-cell head"></div>';
    heads.forEach(w => { html += '<div class="cal-cell head">周' + w + '</div>'; });

    const first = new Date(y, m, 1);
    const offset = S.firstMonday ? (first.getDay() + 6) % 7 : first.getDay();
    const start = new Date(y, m, 1 - offset);
    const today = new Date();
    const cur = new Date(start);

    for (let row = 0; row < 6; row++) {
      html += '<div class="cal-cell weeknum">' + isoWeek(cur) + '</div>';
      for (let col = 0; col < 7; col++) {
        const cls = ['cal-cell', 'day'];
        if (cur.getMonth() !== m) cls.push('other');
        if (dayKey(cur) === dayKey(today)) cls.push('today');
        if (dayKey(cur) === dayKey(S.calSel)) cls.push('selected');
        const has = S.noteDates.has(dayKey(cur));
        html += '<div class="' + cls.join(' ') + '" data-date="' + dayKey(cur) + '">' +
          '<span class="num">' + cur.getDate() + '</span>' +
          (has ? '<span class="dot"></span>' : '') + '</div>';
        cur.setDate(cur.getDate() + 1);
      }
    }
    grid.innerHTML = html;

    grid.querySelectorAll('.cal-cell.day').forEach(cell => {
      cell.addEventListener('click', () => {
        const p = cell.dataset.date.split('-').map(Number);
        S.calSel = new Date(p[0], p[1] - 1, p[2]);
        S.calView = new Date(p[0], p[1] - 1, 1);
        renderCalendar();
        openJournal(new Date(p[0], p[1] - 1, p[2]));
      });
    });
  }

  /* ---------------- 搜索辅助 ---------------- */
  // 日记文件名是 2026-10-24，界面上显示 2026年10月24日（只用于显示，不参与搜索）
  function journalAlias(name) {
    const d = parseJournalName(name);
    if (!d) return '';
    return d.getFullYear() + '年' + (d.getMonth() + 1) + '月' + d.getDate() + '日';
  }
  // Markdown → 可读纯文字（去标记，保留内容），供搜索命中与结果摘要使用
  function plainText(md) {
    return String(md || '')
      .replace(/<!--[\s\S]*?-->/g, ' ')
      .replace(/^```[^\n]*$/gm, ' ')
      .replace(/!\[[^\]]*\]\([^)]*\)/g, ' ')
      .replace(/\[\[([^\]]*)\]\]/g, '$1')
      .replace(/\[([^\]]*)\]\([^)]*\)/g, '$1')
      .replace(/^\s{0,3}#{1,6}\s+/gm, '')
      .replace(/^\s{0,3}>\s?/gm, '')
      .replace(/^\s*(?:[-*+]|\d+\.)\s+/gm, '')
      .replace(/[*_~`]/g, '')
      .replace(/\s+/g, ' ')
      .trim();
  }
  // 空格分词，全部命中才算（AND）
  function searchTerms() {
    return S.search.trim().toLowerCase().split(/\s+/).filter(Boolean);
  }
  // 命中处前后各取一小段作为摘要；起点优先落在标点之后，保证关键词在窄侧栏里也能露出来
  function snippetOf(text, terms) {
    if (!text) return '';
    const low = text.toLowerCase();
    let at = -1;
    terms.forEach(t => {
      const i = low.indexOf(t);
      if (i >= 0 && (at < 0 || i < at)) at = i;
    });
    if (at < 0) return '';
    let start = Math.max(0, at - 10);
    if (start > 0) {
      const win = text.slice(start, at);
      const p = Math.max.apply(null, [' ', '，', '。', '：', '；', '、', '）', '】', '!', '?']
        .map(c => win.lastIndexOf(c)));
      if (p >= 0) start = start + p + 1;
    }
    const end = Math.min(text.length, at + 56);
    const body = text.slice(start, end).trim();
    return (start > 0 ? '…' : '') + body + (end < text.length ? '…' : '');
  }
  // 把命中词包成 <mark>（先分词再逐个转义，避免把标签也替换掉）
  function hlTerms(text, terms) {
    if (!terms.length) return esc(text);
    const pattern = terms.map(t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'))
      .sort((a, b) => b.length - a.length).join('|');
    const re = new RegExp('(' + pattern + ')', 'gi');
    return String(text).split(re)
      .map((seg, i) => (i % 2 ? '<mark>' + esc(seg) + '</mark>' : esc(seg))).join('');
  }
  // 日记在列表里直接显示中文日期，和顶部标题一致
  function displayName(n) {
    const d = parseJournalName(n.name);
    return d ? journalAlias(n.name) : n.name.replace(/\.md$/i, '');
  }

  /* ---------------- 搜索下拉结果 ---------------- */
  // 结果直接挂在搜索框下面，不再往侧栏里塞：侧栏一收（窄屏 / 手动隐藏）搜索就白搜了。
  const SP_MAX = 80;                  // 一次最多渲染 80 条：再多也翻不到，纯属让每个键都变慢
  let spRows = [], spIdx = -1, spKey = null, spTotal = 0;

  // 全库扫一遍正文（去 Markdown 标记）。按关键词缓存，焦点回到输入框时不必重算
  // 正文也缓存：只有两个窗格里正在编辑的那篇会变，其余笔记落盘后才动，命中缓存就不再 plainText
  const spText = new Map();               // note.id -> { sig, text }
  function noteText(n) {
    const p = paneOfNote(n);
    if (p) return plainText(getMd(p));    // 正在编辑，不做缓存
    const raw = n.content || '';
    const sig = (n.updatedAt || 0) + ':' + raw.length;
    const hit = spText.get(n.id);
    if (hit && hit.sig === sig) return hit.text;
    const text = plainText(raw);
    spText.set(n.id, { sig: sig, text: text });
    return text;
  }
  function searchMatches(terms) {
    const key = terms.join(' ');
    if (spKey === key) return spRows;
    spKey = key;
    spIdx = -1;
    if (!terms.length) { spRows = []; spTotal = 0; return spRows; }
    const rows = [];
    S.notes.forEach((n) => {
      if (isBlankJournal(n)) return;
      const body = noteText(n);
      if (!terms.every(t => body.toLowerCase().includes(t))) return;
      rows.push({ note: n, body: body });
    });
    rows.sort((a, b) => (b.note.updatedAt || 0) - (a.note.updatedAt || 0));
    spTotal = rows.length;
    spRows = rows.slice(0, SP_MAX);
    return spRows;
  }
  function openSearchPop() { $('search-pop').classList.remove('hidden'); }
  function closeSearchPop() {
    $('search-pop').classList.add('hidden');
    spIdx = -1;
  }
  function searchPopOpen() { return !$('search-pop').classList.contains('hidden'); }

  function renderSearchPop() {
    const terms = searchTerms();
    if (!terms.length) { closeSearchPop(); return; }
    const rows = searchMatches(terms);
    const list = $('search-list');
    $('search-terms').textContent = '“' + S.search.trim() + '”';
    if (!rows.length) {
      $('search-count').textContent = '0 条';
      list.innerHTML = '<div class="sp-empty">没有匹配的笔记。空格分隔多个关键词，全部命中才算。</div>';
      openSearchPop();
      return;
    }
    if (spIdx < 0 || spIdx >= rows.length) spIdx = 0;
    $('search-count').textContent = spTotal > rows.length
      ? spTotal + ' 条 · 显示前 ' + rows.length + ' 条'
      : rows.length + ' 条';
    list.innerHTML = '';
    rows.forEach((r, i) => {
      const d = parseJournalName(r.note.name);
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'sp-item' + (i === spIdx ? ' on' : '');
      btn.dataset.idx = String(i);
      btn.dataset.name = r.note.name;
      btn.innerHTML =
        '<span class="sp-name"><span class="sp-ico">' + (d ? '📅' : '📄') + '</span>' +
          '<span class="sp-title">' + hlTerms(displayName(r.note), terms) + '</span></span>' +
        '<span class="sp-snip">' + hlTerms(snippetOf(r.body, terms) || r.body.slice(0, 48), terms) + '</span>';
      list.appendChild(btn);
    });
    openSearchPop();
  }

  function moveSearchIdx(d) {
    if (!spRows.length) return;
    spIdx = (spIdx + d + spRows.length) % spRows.length;
    const items = $('search-list').querySelectorAll('.sp-item');
    Array.prototype.forEach.call(items, (el, i) => el.classList.toggle('on', i === spIdx));
    if (items[spIdx]) items[spIdx].scrollIntoView({ block: 'nearest' });
  }

  async function openSearchHit(i) {
    const row = spRows[i];
    if (!row) return;
    closeSearchPop();
    await openNote(row.note, true);
  }

  /* ---------------- 侧栏列表 ---------------- */
  function renderNotes() {
    const ul = $('note-list');
    // 空日记（bug 遗留或清空后的）不参与列表
    let list = S.notes.filter(n => !isBlankJournal(n));

    // 分段：全部 / 收藏
    if (S.tab === 'fav') list = list.filter(n => !!n.favorite);
    // 标签筛选
    if (S.tagFilter) list = list.filter(n => extractTags(n.content).includes(S.tagFilter));

    // 筛选条只服务标签筛选；搜索走顶栏下拉，不再动这份列表
    const bar = $('filter-bar');
    if (S.tagFilter) {
      $('filter-label').textContent = '#' + S.tagFilter;
      bar.classList.remove('hidden');
    } else {
      bar.classList.add('hidden');
    }

    if (!list.length) {
      let tip = '还没有日志，点日历上的任意一天开始写';
      if (S.tagFilter) tip = '没有带 #' + S.tagFilter + ' 的日志';
      else if (S.tab === 'fav') tip = '还没有收藏。再点一次「收藏」回到全部日志，点右侧 ☆ 即可收藏。';
      ul.innerHTML = '<li class="empty-tip">' + esc(tip) + '</li>';
      return;
    }
    ul.innerHTML = '';
    // 日志按日期倒序（文件名就是 YYYY-MM-DD，天然有序）；导入进来的普通笔记没有日期，统一排在后面按修改时间倒序
    const sorted = list.slice().sort((a, b) => {
      const da = parseJournalName(a.name);
      const db = parseJournalName(b.name);
      if (da && db) return db - da;
      if (da) return -1;
      if (db) return 1;
      return (b.updatedAt || 0) - (a.updatedAt || 0);
    });
    // 另一个窗格正在显示的那篇，用浅底标出来（活动窗格那篇仍是 .active）
    const op = ACTIVE === 'b' ? PANES.a : PANES.b;
    const bp = op && op.note && !(S.current && op.note.id === S.current.id) ? op.note.id : null;
    sorted.slice(0, 300).forEach(n => {
      const d = parseJournalName(n.name);
      const li = document.createElement('li');
      li.className = 'note-item' +
        (S.current && S.current.id === n.id ? ' active' : (bp && bp === n.id ? ' open' : ''));
      li.innerHTML =
        '<span class="n-icon">' + (d ? '📅' : '📄') + '</span>' +
        '<span class="n-main"><span class="n-name"></span></span>' +
        '<button class="n-fav' + (n.favorite ? ' on' : '') + '" title="' +
          (n.favorite ? '取消收藏' : '收藏') + '">' + (n.favorite ? '★' : '☆') + '</button>' +
        '<button class="n-more" title="更多">⋮</button>';
      li.querySelector('.n-name').textContent = displayName(n);
      li.addEventListener('click', (e) => {
        if (e.target.closest('.n-more') || e.target.closest('.n-fav')) return;
        openNote(n, true);
      });
      li.querySelector('.n-fav').addEventListener('click', async (e) => {
        e.stopPropagation();
        const fav = !n.favorite;
        await Store.put({ id: n.id, name: liveName(n), content: liveContent(n), favorite: fav });
        if (S.current && S.current.id === n.id) S.current.favorite = fav;
        await refreshAll();
        const pp = paneOfNote(n);
        if (pp) renderFav(pp);
        status(fav ? '已收藏' : '已取消收藏');
      });
      li.querySelector('.n-more').addEventListener('click', (e) => {
        e.stopPropagation();
        showNoteMenu(e.clientX, e.clientY, n);
      });
      ul.appendChild(li);
    });
  }

  // 侧栏分段：收藏 / 标签，两个都不选中 = 全部日志（点已选中的那个即可取消，回到全部）
  function setSeg(tab) {
    const cur = document.querySelector('.seg-item.selected');
    const cancel = !!cur && cur.dataset.tab === tab;   // 再点一次当前页签 → 取消，回到全部
    if (tab !== 'tags') S.tagFilter = '';              // 离开标签视图就清掉标签筛选
    S.tab = cancel ? 'all' : tab;
    document.querySelectorAll('.seg-item').forEach(b => {
      b.classList.toggle('selected', !cancel && b.dataset.tab === tab);
    });
    const isTags = S.tab === 'tags';
    $('tag-list').classList.toggle('hidden', !isTags);
    $('note-list').classList.toggle('hidden', isTags);
    if (isTags) {
      $('filter-bar').classList.add('hidden');
      renderTags();
      return;
    }
    renderNotes();
  }

  function filterByTag(tag) {
    setSeg('all');          // 先退回全部（不匹配任何页签，等于清空选中）
    S.tagFilter = tag;
    renderNotes();
  }

  // 标签池：所有笔记里用过的标签（含使用次数），供侧栏列表与「添加标签」建议共用
  function tagPool() {
    const map = new Map();
    S.notes.forEach(n => extractTags(n.content).forEach(t => map.set(t, (map.get(t) || 0) + 1)));
    return Array.from(map.entries())
      .sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]))
      .map(([name, count]) => ({ name, count }));
  }
  function renderTags() {
    const ul = $('tag-list');
    const tags = tagPool();
    if (!tags.length) {
      ul.innerHTML = '<li class="empty-tip">还没有标签。在编辑区标题下方的「＋ 添加标签」，或直接在正文写 #标签。</li>';
      return;
    }
    ul.innerHTML = '';
    tags.forEach(({ name: t, count: c }) => {
      const li = document.createElement('li');
      li.className = 'tag-item';
      li.innerHTML = '<span>#' + esc(t) + '</span><span class="t-count">' + c + '</span>';
      li.addEventListener('click', () => {
        S.search = '';
        $('search').value = '';
        closeSearchPop();
        filterByTag(t);
        status('筛选 #' + t + '：' + c + ' 篇');
      });
      ul.appendChild(li);
    });
  }

  /* ---------------- 收藏星标（标题下、标签行首） ---------------- */
  function renderFav(p) {
    p = p || curPane();
    const b = p.el.fav;
    if (!b) return;
    const on = !!(p.note && p.note.favorite);
    b.classList.toggle('on', on);
    b.textContent = on ? '★' : '☆';
    b.title = on ? '取消收藏' : '收藏';
    b.classList.toggle('hidden', !p.note);
  }
  async function toggleFav(p) {
    p = p || curPane();
    if (!p.note) return;
    const fav = !p.note.favorite;
    p.note.favorite = fav;
    renderFav(p);
    // 草稿还没落盘：只记在内存，等这篇日记真的写了内容再一起存，不为点星标凭空建文件
    if (p.note.draft) {
      status(fav ? '已收藏（写入内容后一并保存）' : '已取消收藏');
      return;
    }
    await Store.put({
      id: p.note.id, name: liveName(p.note), content: getMd(p), favorite: fav,
    });
    await refreshAll();
    renderFav(p);
    status(fav ? '已收藏' : '已取消收藏');
  }

  /* ---------------- 当前笔记的标签条 ---------------- */
  function renderDocTags(p, md) {
    p = p || curPane();
    const box = p.el.chips;
    if (!box) return;
    if (!p.note) { box.innerHTML = ''; return; }
    const tags = extractTags(md === undefined ? getMd(p) : md);
    box.innerHTML = '';
    tags.forEach(t => {
      const chip = document.createElement('span');
      chip.className = 'dt-chip';
      chip.dataset.tag = t;
      chip.innerHTML = '<span>#' + esc(t) + '</span><span class="dt-x" title="从正文移除">✕</span>';
      chip.querySelector('.dt-x').addEventListener('click', (e) => {
        e.stopPropagation();
        removeTag(t, p);
      });
      chip.addEventListener('click', () => filterByTag(t));
      box.appendChild(chip);
    });
  }

  function addTag(tag, p) {
    p = p || curPane();
    const clean = String(tag || '').trim().replace(/^#+/, '').replace(/\s+/g, '');
    if (!clean) return;
    // 浏览器自动填充会往标签框里塞邮箱，别让它变成正文里的 #xxx
    if (/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(clean)) {
      status('这看起来是邮箱地址，没有当作标签写入');
      return;
    }
    if (extractTags(getMd(p)).includes(clean)) { renderDocTags(p); return; }
    // 标签就是正文末尾的一行 #标签：直接改 Markdown，再交回编辑器渲染
    const md = getMd(p).replace(/\s+$/, '');
    setMd(md ? md + '\n\n#' + clean : '#' + clean, p, true);
    markDirty(p);
    renderDocTags(p);
  }

  function removeTag(tag, p) {
    p = p || curPane();
    const re = new RegExp('(^|[\\s(（])#' + tag.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '(?=$|[\\s，。,;；!！?？\'"）)])', 'g');
    const md = getMd(p).replace(re, (m, p1) => p1)
      .replace(/\n{3,}/g, '\n\n').replace(/\s+$/, '');
    setMd(md, p, true);
    markDirty(p);
    renderDocTags(p);
  }

  /* --- 标签池建议：别的笔记用过的标签会出现在这里，点一下才标记到本篇 --- */
  let tagSugIdx = -1;
  let tagSugList = [];
  let tagSugPane = null;
  function tagSuggestCandidates(p) {
    const used = extractTags(getMd(p));
    const q = p.el.tagInput.value.trim().replace(/^#+/, '').toLowerCase();
    return tagPool()
      .filter(x => !used.includes(x.name))
      .filter(x => !q || x.name.toLowerCase().includes(q));
  }
  function showTagSuggest(p) {
    p = p || curPane();
    const box = p.el.tagSuggest;
    if (!box) return;
    tagSugPane = p;
    tagSugList = tagSuggestCandidates(p);
    tagSugIdx = -1;
    if (!tagSugList.length) {
      const other = tagPool().filter(x => !extractTags(getMd(p)).includes(x.name));
      box.innerHTML = '<div class="ts-empty">' + (other.length
        ? '没有匹配的标签'
        : '标签池里还没有别的标签。输入新名字回车，它会出现在其它笔记的建议里。') + '</div>';
      box.classList.remove('hidden');
      return;
    }
    box.innerHTML = '';
    tagSugList.slice(0, 10).forEach((x, i) => {
      const b = document.createElement('button');
      b.className = 'ts-item';
      b.dataset.i = String(i);
      b.innerHTML = '<span>#' + esc(x.name) + '</span><span class="ts-count">' + x.count + ' 篇</span>';
      b.addEventListener('mousedown', (e) => { e.preventDefault(); pickTag(x.name, p); });
      box.appendChild(b);
    });
    box.classList.remove('hidden');
  }
  function pickTag(name, p) {
    p = p || tagSugPane || curPane();
    addTag(name, p);
    p.el.tagInput.value = '';
    hideTagSuggest(p);
    status('已添加标签 #' + name);
  }
  function hideTagSuggest(p) {
    p = p || curPane();
    const box = p.el.tagSuggest;
    if (box) box.classList.add('hidden');
    tagSugIdx = -1;
  }
  function moveTagSug(delta, p) {
    p = p || curPane();
    if (!tagSugList.length) return;
    tagSugIdx = (tagSugIdx + delta + tagSugList.length) % tagSugList.length;
    const box = p.el.tagSuggest;
    Array.from(box.querySelectorAll('.ts-item')).forEach((el, i) => el.classList.toggle('on', i === tagSugIdx));
  }

  /* ---------------- 双链：插入面板 / 点击跳转 / 预览渲染 ---------------- */
  // 面板是全局单例（双栏共用一个），状态记着「给哪个窗格插、从哪种方式打开」
  let wikiPane = null;       // 面板服务的窗格
  let wikiMode = 'button';   // button = 工具栏按钮；bracket = 正文里刚敲了 [[
  let wikiRange = null;      // 打开面板时的编辑器选区，插入前要恢复
  let wikiList = [];         // 当前候选（可能含「新建 xxx」这一项）
  let wikiIdx = -1;

  // 双链目标：普通笔记 + 日记。日记用界面上显示的中文日期，用户照抄也能被认出来
  function wikiCandidates(p, kw) {
    const cur = p && p.note ? p.note.name : '';
    const q = (kw || '').trim().toLowerCase();
    return S.notes
      .filter(n => n.name !== cur && !isBlankJournal(n))
      .map(n => ({
        name: displayName(n),
        raw: n.name.replace(/\.md$/i, ''),
        journal: !!parseJournalName(n.name),
        ts: n.updatedAt || 0,
      }))
      .filter(x => !q || x.name.toLowerCase().includes(q) || x.raw.toLowerCase().includes(q))
      .sort((a, b) => {
        const pa = a.name.toLowerCase().indexOf(q) === 0 ? 0 : 1;
        const pb = b.name.toLowerCase().indexOf(q) === 0 ? 0 : 1;
        return pa !== pb ? pa - pb : b.ts - a.ts;
      });
  }

  function renderWikiList() {
    const box = $('wiki-list');
    const kw = $('wiki-q').value.trim();
    const items = wikiCandidates(wikiPane, kw).slice(0, 12)
      .map(x => ({ name: x.name, journal: x.journal, create: false }));
    // 双链天生允许指向还不存在的笔记：没有完全同名的候选就给一个新建入口
    if (kw && !items.some(x => x.name === kw)) items.push({ name: kw, journal: false, create: true });
    wikiList = items;

    box.innerHTML = '';
    items.forEach((x, i) => {
      const b = document.createElement('button');
      b.className = 'wiki-item';
      b.dataset.i = String(i);
      const ico = document.createElement('span');
      ico.className = 'wi-ico';
      ico.textContent = x.create ? '＋' : (x.journal ? '📅' : '📄');
      const nm = document.createElement('span');
      nm.className = 'wi-name' + (x.create ? ' wi-new' : '');
      nm.textContent = x.create ? '新建「' + x.name + '」' : x.name;
      b.appendChild(ico);
      b.appendChild(nm);
      b.addEventListener('mousedown', (e) => { e.preventDefault(); applyWiki(x.name); });
      box.appendChild(b);
    });
    if (!items.length) {
      box.innerHTML = '<div class="wiki-empty">还没有别的笔记。直接输入名字回车，可以插一个指向新笔记的双链。</div>';
    }
    wikiIdx = items.length ? 0 : -1;
    paintWikiIdx();
  }

  function paintWikiIdx() {
    const els = Array.from(document.querySelectorAll('#wiki-list .wiki-item'));
    els.forEach((el, i) => el.classList.toggle('on', i === wikiIdx));
    const on = els[wikiIdx];
    if (on && on.scrollIntoView) { try { on.scrollIntoView({ block: 'nearest' }); } catch (e) {} }
  }
  function moveWikiIdx(d) {
    if (!wikiList.length) return;
    wikiIdx = (wikiIdx + d + wikiList.length) % wikiList.length;
    paintWikiIdx();
  }

  function openWikiPop(p, mode) {
    p = p || curPane();
    if (!p || !p.vd) return;
    // 光标位置：优先取实时选区，取不到就退回上一次记录的位置
    // （点工具栏按钮时浏览器可能先把选区清掉，只看实时选区会插到文首）
    const sel = window.getSelection();
    const live = (sel.rangeCount && sel.anchorNode && p.el.host.contains(sel.anchorNode))
      ? sel.getRangeAt(0).cloneRange() : null;
    wikiRange = live || (p.lastRange && p.lastRange.startContainer && p.lastRange.startContainer.isConnected
      ? p.lastRange.cloneRange() : null);
    p.vd.focus();
    if (wikiRange && wikiRange.startContainer.isConnected) {
      const s2 = window.getSelection();
      s2.removeAllRanges();
      s2.addRange(wikiRange);
    }
    wikiPane = p;
    wikiMode = mode || 'button';
    // 选中了文字就先拿它当搜索词，回车即可链过去
    const seed = wikiMode === 'bracket' ? '' : (wikiRange ? wikiRange.toString().trim() : '');
    const q = $('wiki-q');
    q.value = seed;
    renderWikiList();
    $('wiki-pop').classList.remove('hidden');
    positionWikiPop();
    q.focus();
    q.select();
  }
  function closeWikiPop() {
    $('wiki-pop').classList.add('hidden');
    wikiIdx = -1;
  }
  function toggleWikiPop(p) {
    if ($('wiki-pop').classList.contains('hidden')) openWikiPop(p, 'button');
    else closeWikiPop();
  }

  function positionWikiPop() {
    const pop = $('wiki-pop');
    let rect = null;
    if (wikiRange) {
      const rs = wikiRange.getClientRects();
      rect = rs.length ? rs[rs.length - 1] : wikiRange.getBoundingClientRect();
    }
    if (!rect || (!rect.width && !rect.height)) {
      const host = wikiPane && wikiPane.el ? wikiPane.el.host : null;
      const hb = host ? host.getBoundingClientRect() : { left: 300, top: 160 };
      rect = { left: hb.left + 60, top: hb.top + 90, bottom: hb.top + 90 };
    }
    const W = pop.offsetWidth || 286;
    const H = pop.offsetHeight || 240;
    const left = Math.min(Math.max(8, rect.left), (window.innerWidth || 1200) - W - 12);
    let top = rect.bottom + 8;
    if (top + H > (window.innerHeight || 800) - 8) top = Math.max(8, rect.top - H - 8);
    pop.style.left = Math.round(left) + 'px';
    pop.style.top = Math.round(top) + 'px';
  }

  // 真正往编辑器里写 [[标题]]：先收面板，再把光标放回原处
  function applyWiki(name) {
    const p = wikiPane;
    const target = String(name || '').trim();
    const mode = wikiMode;
    closeWikiPop();
    if (!p || !p.vd || !target) return;
    p.vd.focus();
    const sel = window.getSelection();
    if (wikiRange && p.el.host.contains(wikiRange.startContainer)) {
      sel.removeAllRanges();
      sel.addRange(wikiRange);
    }
    if (mode === 'bracket') {
      // 正文里已经敲了 [[：先删掉这两个字符，否则会插成 [[[[X]]
      const r = sel.rangeCount ? sel.getRangeAt(0) : null;
      if (r && r.collapsed && r.startContainer.nodeType === 3 &&
          (r.startContainer.nodeValue || '').slice(r.startOffset - 2, r.startOffset) === '[[') {
        r.setStart(r.startContainer, r.startOffset - 2);
        r.deleteContents();
        r.collapse(true);
        sel.removeAllRanges();
        sel.addRange(r);
      }
    } else if (sel.rangeCount && !sel.isCollapsed) {
      document.execCommand('delete');   // 有选中文字：用双链替换掉
    }
    p.vd.insertValue('[[' + target + ']]', true);
    // insertValue 走的是 Vditor 自己的更新路径，不一定冒泡 input 事件，主动补一次上色
    if (p.redecorate) p.redecorate();
    wikiRange = null;
  }

  // 点双链 / 预览里的 chip：有这篇就打开，没有就问一句新建
  async function openWikiTarget(name, p) {
    const raw = String(name || '').replace(/\.md$/i, '').trim();
    if (!raw) return;
    p = p || curPane();
    // 1) 中文日期或 ISO 日期 → 当天的日记
    let d = null;
    const cn = raw.match(/^(\d{4})年(\d{1,2})月(\d{1,2})日$/);
    if (cn) d = new Date(+cn[1], +cn[2] - 1, +cn[3], 12);
    else if (/^\d{4}-\d{2}-\d{2}$/.test(raw)) d = parseJournalName(raw);
    if (d && !isNaN(d.getTime())) { await openJournal(d, p); return; }
    // 2) 已有笔记
    const hit = S.notes.find(n => n.name === raw + '.md' || n.name === raw);
    if (hit) { await openNote(hit, true, true, p); return; }
    // 3) 还没有这篇：双链本来就是「先写链接、后补内容」
    if (!window.confirm('「' + raw + '」还没有笔记，新建一篇？')) return;
    await Store.put({ name: raw + '.md', content: '', favorite: false });
    await refreshAll();
    const created = await Store.byName(raw + '.md');
    if (created) await openNote(created, true, true, p);
  }

  // 预览面板里把 [[X]] 渲染成 chip。只在预览的 DOM 上做，IR 编辑器里不动，
  // 否则 Vditor 反解 Markdown 时会把括号吃掉
  function decorateWiki(root) {
    if (!root || !window.NodeFilter) return;
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
    const hits = [];
    let n;
    while ((n = walker.nextNode())) {
      if (n.nodeValue && n.nodeValue.indexOf('[[') >= 0) hits.push(n);
    }
    hits.forEach((node) => {
      const txt = node.nodeValue;
      const re = /\[\[([^\[\]\n]+)\]\]/g;
      const frag = document.createDocumentFragment();
      let last = 0, m, hit = false;
      while ((m = re.exec(txt))) {
        hit = true;
        if (m.index > last) frag.appendChild(document.createTextNode(txt.slice(last, m.index)));
        const a = document.createElement('a');
        a.className = 'wiki-link';
        a.dataset.wiki = m[1].trim();
        a.textContent = m[1].trim();
        frag.appendChild(a);
        last = m.index + m[0].length;
      }
      if (!hit) return;
      if (last < txt.length) frag.appendChild(document.createTextNode(txt.slice(last)));
      if (node.parentNode) node.parentNode.replaceChild(frag, node);
    });
  }

  /* IR 编辑器里的双链外观：给 [[X]] 套一层 chip。
     关键点——span 里保留完整的 [[X]] 文本，一字不删，这样 Vditor 反解 Markdown 时
     textContent 不变，存盘仍是 [[X]]；装饰前后按「文本偏移量」重新定位光标，避免打字被打断。 */
  function wikiTextOffset(host, node, offset) {
    try {
      const r = document.createRange();
      r.setStart(host, 0);
      r.setEnd(node, offset);
      return r.toString().length;
    } catch (e) { return -1; }
  }
  function wikiLocateOffset(host, target) {
    if (target < 0) return null;
    let acc = 0;
    const walker = document.createTreeWalker(host, NodeFilter.SHOW_TEXT, null);
    let n;
    while ((n = walker.nextNode())) {
      const len = (n.nodeValue || '').length;
      if (acc + len >= target) return { node: n, offset: target - acc };
      acc += len;
    }
    return null;
  }
  function wikiInCode(node, host) {
    let el = node.parentNode;
    while (el && el.nodeType === 1 && el !== host) {
      const tag = el.tagName;
      if (tag === 'PRE' || tag === 'CODE') {
        // 编辑器根节点自己就是 <pre class="vditor-reset">，不能当代码块
        if (el.classList && el.classList.contains('vditor-reset')) return false;
        return true;
      }
      el = el.parentNode;
    }
    return false;
  }

  function decorateWikiInline(p) {
    const host = p && p.el && p.el.host.querySelector('.vditor-ir .vditor-reset');
    if (!host) return;

    const targets = [];
    const walker = document.createTreeWalker(host, NodeFilter.SHOW_TEXT, null);
    let n;
    while ((n = walker.nextNode())) {
      if (!n.nodeValue || n.nodeValue.indexOf('[[') < 0) continue;
      const par = n.parentNode;
      if (par && par.classList && par.classList.contains('wiki-inline')) continue;
      if (wikiInCode(n, host)) continue;
      targets.push(n);
    }
    // 没有 [[ ]] 就到此为止：换算光标偏移要 Range.toString() 把整篇文本复制一遍，
    // 普通段落里一个字都不用碰，别为它付这笔钱（大文档里这笔钱很贵）
    if (!targets.length) return;

    // 记光标在哪，装饰完按字符偏移还原
    const sel = window.getSelection();
    const hasSel = sel.rangeCount > 0 && sel.anchorNode && host.contains(sel.anchorNode);
    const caretAt = hasSel ? wikiTextOffset(host, sel.anchorNode, sel.anchorOffset) : -1;

    targets.forEach((node) => {
      const txt = node.nodeValue;
      const re = /\[\[([^\[\]\n]+)\]\]/g;
      const frag = document.createDocumentFragment();
      let last = 0, m, hit = false;
      while ((m = re.exec(txt))) {
        hit = true;
        if (m.index > last) frag.appendChild(document.createTextNode(txt.slice(last, m.index)));
        const sp = document.createElement('span');
        sp.className = 'wiki-inline';
        sp.dataset.wiki = m[1].trim();
        // 方括号拆成独立子元素只是为了让它们淡一点；textContent 一字不改，
        // 所以 Vditor 反解 Markdown 时仍然是完整的 [[X]]
        const lb = document.createElement('i');
        lb.className = 'wb';
        lb.textContent = '[[';
        const rb = document.createElement('i');
        rb.className = 'wb';
        rb.textContent = ']]';
        sp.appendChild(lb);
        sp.appendChild(document.createTextNode(m[1]));
        sp.appendChild(rb);
        frag.appendChild(sp);
        last = m.index + m[0].length;
      }
      if (!hit) return;
      if (last < txt.length) frag.appendChild(document.createTextNode(txt.slice(last)));
      if (node.parentNode) node.parentNode.replaceChild(frag, node);
    });

    if (caretAt >= 0) {
      const loc = wikiLocateOffset(host, caretAt);
      if (loc) {
        const r = document.createRange();
        r.setStart(loc.node, loc.offset);
        r.collapse(true);
        sel.removeAllRanges();
        sel.addRange(r);
      }
    }
  }

  // 光标落在 [[...]] 里时取出链接目标。
  // chip 装饰把 [[ 和标题拆到了不同节点，所以按「整段文本 + 光标偏移」算；
  // 只要光标严格落在 [[ 和 ]] 之间就算命中（点在括号上也能跳）
  function wikiAtCaret(host) {
    const sel = window.getSelection();
    if (!sel.rangeCount) return null;
    const r = sel.getRangeAt(0);
    const node = r.startContainer;
    if (!node || !host || !host.contains(node)) return null;

    // 只在光标所在的那一段里找，别去扫全文
    const el = node.nodeType === 1 ? node : node.parentElement;
    const block = (el && el.closest && el.closest('p,li,h1,h2,h3,h4,h5,h6,blockquote,td,th')) || host;

    const before = document.createRange();
    try { before.setStart(block, 0); before.setEnd(node, r.startOffset); } catch (e) { return null; }
    const after = document.createRange();
    try { after.setStart(node, r.startOffset); after.setEnd(block, block.childNodes.length); } catch (e) { return null; }

    const head = before.toString();
    const full = head + after.toString();
    const caret = head.length;

    const re = /\[\[([^\[\]\n]+)\]\]/g;
    let m;
    while ((m = re.exec(full))) {
      const s = m.index, e = m.index + m[0].length;
      if (caret > s && caret < e) return m[1].trim() || null;
    }
    return null;
  }

  function bindWikiInEditor(p, ir) {
    // 点正文里的 [[X]] 直接跳过去
    ir.addEventListener('click', (e) => {
      if (e.button !== 0 || e.ctrlKey || e.metaKey) return;
      const name = wikiAtCaret(ir);
      if (!name) return;
      e.preventDefault();
      openWikiTarget(name, p);
    });

    // [[X]] 上色：Vditor 每次输入都会重排 IR 的 DOM，套上去的 span 会被冲掉，
    // 所以每次输入后补一次；140ms 的延迟让 Vditor 先把 DOM 稳下来
    let dt = null;
    p.redecorate = () => {
      clearTimeout(dt);
      dt = setTimeout(() => {
        decorateWikiInline(p);
        decorateVt(p);          // 字色 / 高亮也靠这一轮补上色
        tblApplyAll(p);         // Lute 重排后表格的 inline 宽高会被冲掉，补回去
      }, 140);
    };
    ir.addEventListener('input', () => p.redecorate());
    ir.addEventListener('compositionend', () => p.redecorate());

    // 正文里敲 [[ 自动弹面板。Vditor 在 input 之后会重排 IR 的 DOM，
    // 所以延后一拍再读光标，并确认节点还挂在编辑器里
    let t = null;
    ir.addEventListener('input', () => {
      clearTimeout(t);
      t = setTimeout(() => {
        if (!$('wiki-pop').classList.contains('hidden')) return;
        const sel = window.getSelection();
        if (!sel.rangeCount) return;
        const r = sel.getRangeAt(0);
        const node = r.startContainer;
        if (!r.collapsed || !node || node.nodeType !== 3 || !node.isConnected || !ir.contains(node)) return;
        if (r.startOffset < 2) return;
        const v = node.nodeValue || '';
        if (v.slice(r.startOffset - 2, r.startOffset) !== '[[') return;
        if (v.slice(r.startOffset, r.startOffset + 1) === ']') return;   // 已经写全了就不再弹
        openWikiPop(p, 'bracket');
      }, 70);
    });
  }

  /* ---------------- 字体颜色 / 高亮 ---------------- */
  // Markdown 没有字色语法，只能写成内联 HTML（与旧版同一套：<span data-color style="color"> / <mark>）。
  // Lute 把内联 HTML 收进一个 html-inline「标记」节点：标记本身在 IR 里不显示，包住的文字也不会自动上色。
  // 所以两头都要管 —— 标记承载标签文本（反解 Markdown 靠它的 textContent），标记之间再套一层纯样式元素上色；
  // 这种没有语义的包裹 Lute 反解时会丢掉，Markdown 不会被污染。
  const VT_COLORS = [
    { n: '红', c: '#d64545' }, { n: '橙', c: '#d9822b' }, { n: '绿', c: '#2f9e63' },
    { n: '蓝', c: '#0b6bcb' }, { n: '紫', c: '#7b52c9' }, { n: '灰', c: '#77777f' },
  ];
  const VT_HL_BG = '#ffe58f';
  let colorPane = null;
  let colorRange = null;

  const vtRoot = (p) => (p && p.el && p.el.host.querySelector('.vditor-ir .vditor-reset')) || null;
  const VT_OPEN_COLOR = /^<span\b[^>]*?(?:data-color="(#[0-9a-fA-F]{3,8})"|style="[^"]*?color:\s*(#[0-9a-fA-F]{3,8}))/;
  const VT_OPEN_FONT = /^<font\b[^>]*?color="(#[0-9a-fA-F]{3,8})"/;

  function vtMarkerText(sp) {
    const code = sp && sp.querySelector ? sp.querySelector('code.vditor-ir__marker') : null;
    return code ? (code.textContent || '').trim() : '';
  }

  // 把 IR 里的 html-inline 标记配对：开标记 + 之后最近的同 tag 闭标记
  function vtPairs(host) {
    const out = [];
    const stack = [];
    Array.prototype.forEach.call(host.querySelectorAll('span[data-type="html-inline"]'), (sp) => {
      const t = vtMarkerText(sp);
      if (!t) return;
      let kind = null, tag = null, color = null, isOpen = true;
      if (/^<mark\b/i.test(t)) { kind = 'hl'; tag = 'mark'; }
      else if (/^<\/mark>/i.test(t)) { kind = 'hl'; tag = 'mark'; isOpen = false; }
      else if (VT_OPEN_FONT.test(t)) { kind = 'color'; tag = 'font'; color = t.match(VT_OPEN_FONT)[1]; }
      else if (/^<\/font>/i.test(t)) { kind = 'color'; tag = 'font'; isOpen = false; }
      else if (VT_OPEN_COLOR.test(t)) {
        const m = t.match(VT_OPEN_COLOR);
        kind = 'color'; tag = 'span'; color = m[1] || m[2];
      } else if (/^<\/span>/i.test(t)) { kind = 'color'; tag = 'span'; isOpen = false; }
      if (!kind) return;
      if (isOpen) { stack.push({ kind: kind, tag: tag, color: color, open: sp }); return; }
      for (let i = stack.length - 1; i >= 0; i--) {
        if (stack[i].tag !== tag) continue;
        const pr = stack.splice(i, 1)[0];
        out.push({ kind: pr.kind, tag: pr.tag, color: pr.color, open: pr.open, close: sp });
        return;
      }
    });
    return out;
  }

  function vtUnwrap(el) {
    const par = el.parentNode;
    if (!par) return;
    while (el.firstChild) par.insertBefore(el.firstChild, el);
    par.removeChild(el);
  }

  // 拆/套包裹会动到选区（extractContents 会把选区并掉），所以装饰前后按字符偏移存一次、还一次
  function vtSaveSel(host) {
    const sel = window.getSelection();
    if (!sel.rangeCount || !sel.anchorNode || !host.contains(sel.anchorNode)) return null;
    const a = wikiTextOffset(host, sel.anchorNode, sel.anchorOffset);
    if (a < 0) return null;
    const b = (sel.focusNode && host.contains(sel.focusNode))
      ? wikiTextOffset(host, sel.focusNode, sel.focusOffset) : a;
    return { from: Math.min(a, b), to: Math.max(a, b) };
  }
  function vtApplySel(host, box) {
    const a = wikiLocateOffset(host, box.from);
    if (!a) return;
    const r = document.createRange();
    try {
      r.setStart(a.node, a.offset);
      const b = box.to > box.from ? wikiLocateOffset(host, box.to) : null;
      if (b) r.setEnd(b.node, b.offset); else r.collapse(true);
    } catch (e) { return; }
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(r);
  }

  // 幂等：每次先把上一轮套的样式全拆掉，再按标记重套一遍
  function decorateVt(p) {
    const host = vtRoot(p);
    if (!host) return;
    // 先看有没有活儿干：没标记也没残留包裹就直接走人。
    // 反过来的话每次按键都要 vtSaveSel → Range.toString() 复制整篇文本，纯属白抛
    const pairs = vtPairs(host);
    const old = host.querySelectorAll('.vt-c,.vt-h');
    if (!pairs.length && !old.length) return;
    const box = vtSaveSel(host);
    if (old.length) Array.prototype.forEach.call(old, vtUnwrap);
    pairs.forEach((pr) => {
      if (!pr.open.isConnected || !pr.close.isConnected) return;
      if (!pr.open.nextSibling || pr.open.nextSibling === pr.close) return;
      const r = document.createRange();
      try { r.setStartAfter(pr.open); r.setEndBefore(pr.close); } catch (e) { return; }
      const frag = r.extractContents();
      const wrap = document.createElement(pr.kind === 'hl' ? 'mark' : 'span');
      wrap.className = pr.kind === 'hl' ? 'vt-h' : 'vt-c';
      if (pr.color) wrap.style.color = pr.color;
      wrap.appendChild(frag);
      r.insertNode(wrap);
      // 标记挂 data-vt + 色值：光标进来时 CSS 会把那串标签收成一个小色块
      [pr.open, pr.close].forEach((sp) => {
        sp.dataset.vt = pr.kind;
        sp.style.setProperty('--vtc', pr.color || VT_HL_BG);
      });
    });
    if (box) vtApplySel(host, box);
  }

  function vtBlockOf(node, host) {
    const el = node && node.nodeType === 1 ? node : (node && node.parentElement);
    const b = el && el.closest ? el.closest('p,li,h1,h2,h3,h4,h5,h6,blockquote,td,th') : null;
    return b && host.contains(b) ? b : host;
  }

  function vtCurrentRange(p) {
    if (colorRange && colorRange.startContainer && colorRange.startContainer.isConnected) return colorRange;
    const sel = window.getSelection();
    if (sel.rangeCount && sel.anchorNode && p.el.host.contains(sel.anchorNode)) return sel.getRangeAt(0);
    if (p.lastRange && p.lastRange.startContainer && p.lastRange.startContainer.isConnected) return p.lastRange;
    return null;
  }

  // 把「选区」和「已有格式」都换算成整篇的文字偏移再比较。
  // 不能比 DOM 边界点：标记元素内部末尾和标记之后是两个位置，会把「刚好选满」误判成交叉。
  function vtMeasure(host, range) {
    const pairs = [];
    vtPairs(host).forEach((pr) => {
      if (!pr.open.isConnected || !pr.close.isConnected) return;
      try {
        const a = document.createRange();
        a.setStart(host, 0);
        a.setEndAfter(pr.open);
        const b = document.createRange();
        b.setStart(host, 0);
        b.setEndBefore(pr.close);
        const from = a.toString().length, to = b.toString().length;
        if (to > from) pairs.push({ pr: pr, from: from, to: to });
      } catch (e) { /* 跨了块就算了 */ }
    });
    const s1 = wikiTextOffset(host, range.startContainer, range.startOffset);
    const s2 = wikiTextOffset(host, range.endContainer, range.endOffset);
    return { pairs: pairs, sf: Math.min(s1, s2), se: Math.max(s1, s2) };
  }

  // 一半在格式里、一半在外，会套出不平衡的标签，这种直接拦掉
  function vtCrossing(m) {
    return m.pairs.some((x) => (m.sf < x.from && m.se > x.from && m.se < x.to) ||
                              (m.sf > x.from && m.sf < x.to && m.se > x.to));
  }

  function vtMakeMarker(text) {
    const sp = document.createElement('span');
    sp.setAttribute('data-type', 'html-inline');
    sp.className = 'vditor-ir__node';
    const code = document.createElement('code');
    code.className = 'vditor-ir__marker';
    code.textContent = text;
    sp.appendChild(code);
    return sp;
  }
  function vtSetMarkerText(sp, text) {
    const code = sp.querySelector('code.vditor-ir__marker');
    if (code) code.textContent = text;
  }
  function vtRemovePair(pr) {
    if (pr.open.parentNode) pr.open.parentNode.removeChild(pr.open);
    if (pr.close.parentNode) pr.close.parentNode.removeChild(pr.close);
  }
  function vtWrapRange(range, openTag, closeTag) {
    const frag = range.extractContents();
    const open = vtMakeMarker(openTag);
    const close = vtMakeMarker(closeTag);
    const fr = document.createDocumentFragment();
    fr.appendChild(open);
    fr.appendChild(frag);
    fr.appendChild(close);
    range.insertNode(fr);
    return { open: open, close: close };
  }

  const VT_KEYS = ['p', 'li', 'h1', 'h2', 'h3', 'h4', 'h5', 'h6', 'blockquote', 'td', 'th', 'div'];

  // 派发 input 后 Vditor 会拿 Markdown 重排这一段，原来那对节点已经不在文档里了，
  // 所以先把「上色内容的起止」换算成整篇文字里的偏移，等 DOM 稳下来再按偏移把选区还回去
  function vtSelectRange(p, from, to) {
    const host = vtRoot(p);
    if (!host) return;
    const a = wikiLocateOffset(host, from);
    if (!a) return;
    const b = to > from ? wikiLocateOffset(host, to) : null;
    const r = document.createRange();
    try {
      r.setStart(a.node, a.offset);
      if (b) r.setEnd(b.node, b.offset); else r.collapse(true);
    } catch (e) { return; }
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(r);
  }

  // 收尾：派发一次 input 让 Vditor 记撤回快照 + 触发自动保存，再立刻上色、把选区还回去
  function vtFinish(p, pair) {
    const host = vtRoot(p);
    let from = -1, to = -1;
    if (host && pair && pair.open.isConnected && pair.close.isConnected && host.contains(pair.open)) {
      try {
        const ra = document.createRange();
        ra.setStart(host, 0);
        ra.setEndAfter(pair.open);
        from = ra.toString().length;
        const rb = document.createRange();
        rb.setStart(host, 0);
        rb.setEndBefore(pair.close);
        to = rb.toString().length;
      } catch (e) { from = to = -1; }
    }
    if (host) host.dispatchEvent(new Event('input', { bubbles: true }));
    decorateVt(p);
    if (from >= 0) setTimeout(() => vtSelectRange(p, from, to), 0);
  }

  // 清掉完全落在选区里的同类格式（返回是否有改动）
  function vtClearKind(m, kind) {
    const hit = m.pairs.filter(x => x.pr.kind === kind && x.from >= m.sf && x.to <= m.se);
    hit.forEach(x => vtRemovePair(x.pr));
    return hit.length > 0;
  }
  function vtColorOpenTag(hex) {
    return '<span data-color="' + hex + '" style="color:' + hex + '">';
  }

  function vtApplyColor(hex, p) {
    p = p || colorPane || curPane();
    const host = vtRoot(p);
    const range = vtCurrentRange(p);
    if (!host || !range) { status('先点进正文，再选中要设置格式的文字'); return; }
    if (range.collapsed) { status('请先选中要设置颜色的文字'); return; }
    if (vtBlockOf(range.startContainer, host) !== vtBlockOf(range.endContainer, host)) {
      status('请在同一段里选择文字'); return;
    }
    const m = vtMeasure(host, range);
    if (m.sf < 0) { status('请先选中要设置颜色的文字'); return; }
    if (vtCrossing(m)) { status('选中的范围跨过了已有的颜色 / 高亮，请先清除或重新选择'); return; }

    // 正好选满一段已有颜色：改它的色值（或清除），不再套一层
    const exact = m.pairs.filter(x => x.pr.kind === 'color' && x.from === m.sf && x.to === m.se).pop();
    if (exact) {
      if (!hex) { vtRemovePair(exact.pr); vtFinish(p, null); status('已恢复默认字色'); return; }
      vtSetMarkerText(exact.pr.open, vtColorOpenTag(hex));
      vtSetMarkerText(exact.pr.close, '</span>');
      vtFinish(p, exact.pr);
      status('已设置字体颜色');
      return;
    }
    if (!hex) {
      if (!vtClearKind(m, 'color')) { status('选中的文字没有设置颜色'); return; }
      vtFinish(p, null);
      status('已恢复默认字色');
      return;
    }
    const made = vtWrapRange(range, vtColorOpenTag(hex), '</span>');
    vtFinish(p, made);
    status('已设置字体颜色');
  }

  function vtToggleHl(p) {
    p = p || colorPane || curPane();
    const host = vtRoot(p);
    const range = vtCurrentRange(p);
    if (!host || !range) { status('先点进正文，再选中要标黄的文字'); return; }
    if (range.collapsed) { status('请先选中要标黄的文字'); return; }
    if (vtBlockOf(range.startContainer, host) !== vtBlockOf(range.endContainer, host)) {
      status('请在同一段里选择文字'); return;
    }
    const m = vtMeasure(host, range);
    if (m.sf < 0) { status('请先选中要标黄的文字'); return; }
    if (vtCrossing(m)) { status('选中的范围跨过了已有的颜色 / 高亮，请先清除或重新选择'); return; }

    const exact = m.pairs.filter(x => x.pr.kind === 'hl' && x.from === m.sf && x.to === m.se).pop();
    if (exact) { vtRemovePair(exact.pr); vtFinish(p, null); status('已取消高亮'); return; }
    if (vtClearKind(m, 'hl')) { vtFinish(p, null); status('已取消高亮'); return; }
    const made = vtWrapRange(range, '<mark>', '</mark>');
    vtFinish(p, made);
    status('已标黄');
  }

  /* --- 面板 --- */
  function buildColorPop() {
    const pop = $('color-pop');
    if (!pop || pop.dataset.built) return;
    pop.dataset.built = '1';
    let html = '<div class="cp-row"><span class="cp-label">字色</span>';
    VT_COLORS.forEach((c) => {
